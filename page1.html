<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>AKSH — How are you feeling today?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:#fff;
    background:#18202b;

    -webkit-font-smoothing:antialiased;
}

/* =========================================================
   PAGE
========================================================= */

.page{
    position:relative;

    width:100%;
    min-height:100svh;
    min-height:100vh;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    isolation:isolate;
}


/* =========================================================
   PREMIUM LIVING BACKGROUND
========================================================= */

.background{
    position:absolute;
    inset:0;

    z-index:-5;

    background:
        radial-gradient(
            ellipse at 12% 18%,
            rgba(170,205,226,.52) 0%,
            rgba(170,205,226,.18) 23%,
            transparent 48%
        ),

        radial-gradient(
            ellipse at 88% 18%,
            rgba(226,193,222,.42) 0%,
            rgba(226,193,222,.12) 25%,
            transparent 50%
        ),

        radial-gradient(
            ellipse at 50% 70%,
            rgba(202,170,202,.20) 0%,
            transparent 48%
        ),

        linear-gradient(
            135deg,
            #26394b 0%,
            #506176 38%,
            #71667b 67%,
            #292c3d 100%
        );

    animation:
        backgroundBreathing 18s ease-in-out infinite alternate;
}

@keyframes backgroundBreathing{

    0%{
        transform:scale(1);
    }

    100%{
        transform:scale(1.045);
    }
}


/* =========================================================
   CLOUD-LIKE LIGHT
========================================================= */

.cloud{
    position:absolute;

    border-radius:50%;

    filter:blur(45px);

    pointer-events:none;

    opacity:.48;
}

.cloud.one{
    width:55vw;
    height:22vw;

    max-width:760px;
    max-height:310px;

    left:-12%;
    top:8%;

    background:
        rgba(220,235,242,.28);

    animation:
        cloudOne 16s ease-in-out infinite alternate;
}

.cloud.two{
    width:48vw;
    height:20vw;

    max-width:680px;
    max-height:290px;

    right:-10%;
    top:16%;

    background:
        rgba(241,220,239,.25);

    animation:
        cloudTwo 19s ease-in-out infinite alternate;
}

.cloud.three{
    width:65vw;
    height:25vw;

    max-width:850px;
    max-height:340px;

    left:18%;
    bottom:-13%;

    background:
        rgba(188,183,214,.20);

    animation:
        cloudThree 21s ease-in-out infinite alternate;
}

@keyframes cloudOne{

    from{
        transform:translateX(0) translateY(0);
    }

    to{
        transform:translateX(80px) translateY(18px);
    }
}

@keyframes cloudTwo{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-75px) translateY(25px);
    }
}

@keyframes cloudThree{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-55px) translateY(-20px);
    }
}


/* =========================================================
   CINEMATIC OVERLAY
========================================================= */

.overlay{
    position:absolute;
    inset:0;

    z-index:-2;

    background:
        linear-gradient(
            180deg,
            rgba(14,21,30,.12) 0%,
            rgba(14,18,28,.02) 40%,
            rgba(10,13,21,.54) 100%
        );

    pointer-events:none;
}


/* =========================================================
   TOP BRAND
========================================================= */

.brand{
    position:absolute;

    z-index:20;

    top:max(24px,env(safe-area-inset-top));

    left:50%;

    transform:translateX(-50%);

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;
}

.brand img{
    width:62px;
    height:62px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 8px 24px rgba(0,0,0,.28)
        );
}

.brand-name{
    margin-top:5px;

    font-size:10px;

    font-weight:800;

    letter-spacing:.30em;

    text-transform:uppercase;

    color:rgba(255,255,255,.82);
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content{
    position:relative;

    z-index:10;

    width:min(
        1180px,
        calc(100% - 36px)
    );

    padding:
        125px 0
        max(42px,env(safe-area-inset-bottom));

    text-align:center;
}


/* =========================================================
   HEADING
========================================================= */

.eyebrow{
    font-size:9px;

    font-weight:800;

    letter-spacing:.34em;

    text-transform:uppercase;

    color:rgba(255,255,255,.66);

    margin-bottom:15px;

    text-shadow:
        0 3px 18px rgba(0,0,0,.25);
}

h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            44px,
            7vw,
            82px
        );

    font-weight:400;

    line-height:1;

    letter-spacing:-.055em;

    text-shadow:
        0 8px 35px rgba(0,0,0,.28);
}

.intro{
    width:min(
        620px,
        100%
    );

    margin:
        18px auto 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            15px,
            2vw,
            19px
        );

    line-height:1.55;

    color:rgba(255,255,255,.84);

    text-shadow:
        0 4px 18px rgba(0,0,0,.20);
}


/* =========================================================
   FOUR EMOTION CARDS
========================================================= */

.cards{
    width:100%;

    margin:
        40px auto 0;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.card{
    position:relative;

    min-height:235px;

    padding:25px 23px;

    border-radius:26px;

    border:
        1px solid
        rgba(255,255,255,.24);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.19),
            rgba(255,255,255,.065)
        );

    box-shadow:
        0 24px 65px
        rgba(0,0,0,.18);

    color:#fff;

    text-align:left;

    cursor:pointer;

    appearance:none;
    -webkit-appearance:none;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    transition:
        transform .32s ease,
        background .32s ease,
        border-color .32s ease,
        box-shadow .32s ease;
}

.card:hover{
    transform:translateY(-8px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.27),
            rgba(255,255,255,.09)
        );

    border-color:
        rgba(255,255,255,.44);

    box-shadow:
        0 34px 80px
        rgba(0,0,0,.25);
}

.card:active{
    transform:scale(.985);
}

.card:focus-visible{
    outline:
        2px solid
        rgba(255,255,255,.9);

    outline-offset:4px;
}


/* number */

.number{
    position:absolute;

    top:17px;
    right:19px;

    font-size:8px;

    font-weight:800;

    letter-spacing:.18em;

    color:rgba(255,255,255,.42);
}


/* icon */

.icon{
    width:53px;
    height:53px;

    margin-bottom:28px;

    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid
        rgba(255,255,255,.19);

    background:
        rgba(255,255,255,.105);

    font-size:22px;

    box-shadow:
        inset 0 1px
        rgba(255,255,255,.08);
}


/* title */

.card h2{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:22px;

    font-weight:400;

    line-height:1.12;

    letter-spacing:-.02em;
}


/* description */

.card p{
    margin-top:10px;

    font-size:10px;

    line-height:1.55;

    color:rgba(255,255,255,.67);
}


/* arrow */

.arrow{
    position:absolute;

    left:23px;
    bottom:18px;

    font-size:18px;

    color:rgba(255,255,255,.72);

    transition:
        transform .25s ease;
}

.card:hover .arrow{
    transform:translateX(7px);
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom-note{
    margin-top:22px;

    font-size:8px;

    font-weight:700;

    letter-spacing:.17em;

    text-transform:uppercase;

    color:rgba(255,255,255,.52);

    text-shadow:
        0 3px 15px rgba(0,0,0,.2);
}


/* =========================================================
   PAGE TRANSITION
========================================================= */

.page-transition{
    position:fixed;
    inset:0;

    z-index:100;

    background:
        linear-gradient(
            135deg,
            #26394b,
            #71667b,
            #292c3d
        );

    opacity:0;

    pointer-events:none;

    transition:
        opacity .45s ease;
}

.page-transition.show{
    opacity:1;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:950px){

    .cards{
        grid-template-columns:
            repeat(2,1fr);

        max-width:720px;
    }

    .card{
        min-height:205px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .brand{
        top:max(
            14px,
            env(safe-area-inset-top)
        );
    }

    .brand img{
        width:49px;
        height:49px;
    }

    .brand-name{
        font-size:7px;
        margin-top:3px;
    }

    .content{
        width:
            calc(100% - 24px);

        padding-top:92px;
    }

    .eyebrow{
        font-size:6px;
        margin-bottom:10px;
    }

    h1{
        font-size:
            clamp(
                36px,
                10.5vw,
                52px
            );
    }

    .intro{
        margin-top:12px;
        font-size:13px;
    }

    .cards{
        margin-top:24px;
        gap:9px;
    }

    .card{
        min-height:184px;

        padding:
            18px 15px;

        border-radius:20px;
    }

    .number{
        top:12px;
        right:13px;
        font-size:6px;
    }

    .icon{
        width:40px;
        height:40px;

        margin-bottom:19px;

        border-radius:13px;

        font-size:17px;
    }

    .card h2{
        font-size:17px;
    }

    .card p{
        margin-top:7px;
        font-size:8px;
        line-height:1.42;
    }

    .arrow{
        left:15px;
        bottom:12px;
        font-size:15px;
    }

    .bottom-note{
        margin-top:14px;
        font-size:6px;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:380px){

    .content{
        padding-top:82px;
    }

    .intro{
        font-size:11px;
    }

    .cards{
        margin-top:18px;
    }

    .card{
        min-height:160px;
        padding:14px 12px;
    }

    .icon{
        width:34px;
        height:34px;
        margin-bottom:14px;
        border-radius:11px;
        font-size:15px;
    }

    .card h2{
        font-size:14px;
    }

    .card p{
        font-size:7px;
    }

    .arrow{
        left:12px;
        bottom:9px;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media(
    orientation:landscape
) and (max-height:600px){

    .brand{
        top:10px;
    }

    .brand img{
        width:38px;
        height:38px;
    }

    .brand-name{
        display:none;
    }

    .content{
        padding-top:55px;
    }

    .eyebrow{
        display:none;
    }

    h1{
        font-size:34px;
    }

    .intro{
        margin-top:6px;
        font-size:10px;
    }

    .cards{
        margin-top:12px;
    }

    .card{
        min-height:135px;
        padding:13px;
    }

    .icon{
        width:32px;
        height:32px;
        margin-bottom:9px;
    }

    .card h2{
        font-size:14px;
    }

    .card p{
        font-size:7px;
    }

    .bottom-note{
        display:none;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>

<body>

<main class="page">

    <!-- BACKGROUND -->
    <div class="background">

        <div class="cloud one"></div>
        <div class="cloud two"></div>
        <div class="cloud three"></div>

    </div>

    <div class="overlay"></div>


    <!-- AKSH BRAND -->
    <div class="brand">

        <img
            src="aksh-icon.PNG"
            alt="AKSH"
        >

        <div class="brand-name">
            AKSH
        </div>

    </div>


    <!-- MAIN CONTENT -->
    <section class="content">

        <div class="eyebrow">
            A safe space for every mind
        </div>


        <h1>
            How are you<br>
            feeling today?
        </h1>


        <p class="intro">
            There is no right answer.
            Just choose what feels closest to you right now.
        </p>


        <!-- FOUR EMOTION CARDS -->
        <div class="cards">


            <!-- ANXIOUS -->

            <button
                class="card"
                type="button"
                data-emotion="anxious"
            >

                <span class="number">
                    01
                </span>

                <div class="icon">
                    ◌
                </div>

                <h2>
                    Anxious
                </h2>

                <p>
                    Your mind feels restless,
                    worried or unable to slow down.
                </p>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- OVERWHELMED -->

            <button
                class="card"
                type="button"
                data-emotion="overwhelmed"
            >

                <span class="number">
                    02
                </span>

                <div class="icon">
                    ≋
                </div>

                <h2>
                    Overwhelmed
                </h2>

                <p>
                    There is too much happening
                    and you need some breathing room.
                </p>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- NEED SOMEONE -->

            <button
                class="card"
                type="button"
                data-emotion="talk"
            >

                <span class="number">
                    03
                </span>

                <div class="icon">
                    ◇
                </div>

                <h2>
                    Need someone to talk
                </h2>

                <p>
                    You don't want to carry the thought
                    alone. Someone can be here with you.
                </p>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- EXPLORING -->

            <button
                class="card"
                type="button"
                data-emotion="exploring"
            >

                <span class="number">
                    04
                </span>

                <div class="icon">
                    ✦
                </div>

                <h2>
                    Just exploring
                </h2>

                <p>
                    You are curious about yourself,
                    emotions, growth or AKSH.
                </p>

                <span class="arrow">
                    →
                </span>

            </button>


        </div>


        <div class="bottom-note">
            Take your time · You are welcome here
        </div>

    </section>


    <!-- TRANSITION -->
    <div
        class="page-transition"
        id="pageTransition"
    ></div>

</main>


<script>

/*
=========================================================
AKSH PAGE 1 NAVIGATION
=========================================================

Each emotion card:

1. Saves the selected emotion.
2. Creates a smooth transition.
3. Opens page2.html.

No video.
No music.
No sound button.
No changes to index.html.
=========================================================
*/

const cards =
    document.querySelectorAll(".card");

const transition =
    document.getElementById("pageTransition");


cards.forEach(function(card){

    card.addEventListener(
        "click",
        function(){

            const emotion =
                this.dataset.emotion;


            /*
            Save selected emotion.
            Page 2 can read this later.
            */

            try{

                sessionStorage.setItem(
                    "akshEmotion",
                    emotion
                );

            }catch(error){

                /* Navigation still works
                   if storage is unavailable. */

            }


            /*
            Start page transition.
            */

            transition.classList.add("show");


            /*
            Move to Page 2.
            */

            setTimeout(function(){

                window.location.href =
                    "page2.html";

            },450);

        }
    );

});

</script>

</body>
</html>
