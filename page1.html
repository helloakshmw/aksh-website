<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#8fa9c7">
<title>AKSH — How are you feeling today?</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
  background:#91aeca;
  -webkit-font-smoothing:antialiased;
}

.page{
  position:relative;
  width:100%;
  height:100svh;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
}


/* =========================================================
   ANIMATED SKY
========================================================= */

.sky{
  position:absolute;
  inset:0;
  z-index:-10;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      #a9c4dc 0%,
      #c6d9e8 42%,
      #dbe4e9 100%
    );
  transition:background 2s ease;
}


/* Sun */

.sun{
  position:absolute;
  width:clamp(120px,18vw,240px);
  height:clamp(120px,18vw,240px);
  border-radius:50%;
  top:8%;
  right:10%;
  background:rgba(255,244,199,.78);
  filter:blur(3px);
  box-shadow:
    0 0 60px rgba(255,242,190,.45),
    0 0 130px rgba(255,226,150,.25);
  animation:sunFloat 10s ease-in-out infinite alternate;
}

@keyframes sunFloat{
  from{transform:translateY(0)}
  to{transform:translateY(18px)}
}


/* Clouds */

.cloud{
  position:absolute;
  width:260px;
  height:75px;
  border-radius:100px;
  background:rgba(255,255,255,.54);
  filter:blur(7px);
  opacity:.72;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:inherit;
}

.cloud:before{
  width:120px;
  height:120px;
  left:45px;
  bottom:15px;
}

.cloud:after{
  width:95px;
  height:95px;
  left:135px;
  bottom:10px;
}

.cloud.one{
  top:18%;
  left:-280px;
  animation:cloudOne 38s linear infinite;
}

.cloud.two{
  top:34%;
  left:-320px;
  transform:scale(.72);
  opacity:.45;
  animation:cloudTwo 52s linear infinite;
}

.cloud.three{
  top:53%;
  left:-300px;
  transform:scale(1.25);
  opacity:.28;
  animation:cloudThree 64s linear infinite;
}

@keyframes cloudOne{
  to{left:110%}
}

@keyframes cloudTwo{
  to{left:115%}
}

@keyframes cloudThree{
  to{left:120%}
}


/* =========================================================
   AFTERNOON GOLDEN ATMOSPHERE
========================================================= */

.warm-glow{
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(
      circle at 75% 25%,
      rgba(255,191,112,.35),
      transparent 30%
    );
  opacity:.55;
  animation:warmMove 12s ease-in-out infinite alternate;
}

@keyframes warmMove{
  from{transform:translate(-2%,0)}
  to{transform:translate(2%,2%)}
}


/* =========================================================
   EVENING RAIN
========================================================= */

.rain{
  position:absolute;
  inset:-30%;
  opacity:0;
  pointer-events:none;
  background-image:
    repeating-linear-gradient(
      105deg,
      rgba(255,255,255,.0) 0px,
      rgba(255,255,255,.0) 7px,
      rgba(255,255,255,.28) 8px,
      rgba(255,255,255,.0) 10px,
      rgba(255,255,255,.0) 24px
    );
  animation:rainFall .65s linear infinite;
  transition:opacity 2s ease;
}

@keyframes rainFall{
  from{transform:translateY(-80px)}
  to{transform:translateY(120px)}
}


/* =========================================================
   PURPLE EVENING
========================================================= */

.lavender{
  position:absolute;
  inset:0;
  opacity:0;

  background:
    radial-gradient(
      ellipse at 20% 45%,
      rgba(185,155,230,.45),
      transparent 40%
    ),
    radial-gradient(
      ellipse at 80% 30%,
      rgba(113,87,171,.45),
      transparent 45%
    );

  transition:opacity 2s ease;
}


/* =========================================================
   NIGHT
========================================================= */

.night-sky{
  position:absolute;
  inset:0;
  opacity:0;

  background:
    radial-gradient(
      circle at 72% 23%,
      rgba(255,255,255,.08),
      transparent 12%
    ),
    linear-gradient(
      180deg,
      #15162e 0%,
      #26234d 52%,
      #4b3563 100%
    );

  transition:opacity 2s ease;
}


/* Moon */

.moon{
  position:absolute;

  width:clamp(65px,9vw,125px);
  height:clamp(65px,9vw,125px);

  top:11%;
  right:13%;

  border-radius:50%;

  background:#fff9dd;

  box-shadow:
    0 0 25px rgba(255,250,214,.75),
    0 0 80px rgba(255,240,185,.35);

  opacity:0;

  transition:opacity 2s ease;
}


/* Stars */

.stars{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 2s ease;

  background-image:
    radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,255,255,.65) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px);

  background-size:
    83px 91px,
    137px 121px,
    191px 157px;

  background-position:
    10px 20px,
    50px 80px,
    100px 30px;

  animation:starsMove 7s ease-in-out infinite alternate;
}

@keyframes starsMove{
  from{opacity:.65}
  to{opacity:1}
}


/* Shooting stars */

.shooting-star{
  position:absolute;
  width:120px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.9)
    );

  transform:rotate(-35deg);

  opacity:0;
}

.shooting-star.one{
  top:24%;
  left:68%;
  animation:shoot 8s 2s linear infinite;
}

.shooting-star.two{
  top:37%;
  left:42%;
  animation:shoot 11s 6s linear infinite;
}

@keyframes shoot{
  0%,82%{
    opacity:0;
    transform:translate(0,0) rotate(-35deg);
  }

  85%{
    opacity:1;
  }

  92%{
    opacity:0;
    transform:translate(-180px,110px) rotate(-35deg);
  }

  100%{
    opacity:0;
  }
}


/* =========================================================
   CINEMATIC OVERLAY
========================================================= */

.overlay{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(20,24,35,.16),
      transparent 38%,
      rgba(12,15,25,.28) 100%
    );
}


/* =========================================================
   TOP
========================================================= */

.top{
  position:absolute;
  z-index:20;

  top:max(20px,env(safe-area-inset-top));
  left:max(20px,env(safe-area-inset-left));
  right:max(20px,env(safe-area-inset-right));

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.icon{
  width:50px;
  height:50px;
  object-fit:contain;

  filter:drop-shadow(0 5px 18px rgba(0,0,0,.25));
}

.back{
  width:42px;
  height:42px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  text-decoration:none;

  border:1px solid rgba(255,255,255,.28);
  background:rgba(0,0,0,.12);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  transition:.25s ease;
}

.back:hover{
  transform:translateX(-3px);
  background:rgba(0,0,0,.25);
}


/* =========================================================
   CONTENT
========================================================= */

.content{
  position:relative;
  z-index:10;

  width:min(1080px,calc(100% - 36px));
  height:100%;

  margin:auto;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:
    80px 0
    max(40px,env(safe-area-inset-bottom));
}

.eyebrow{
  font-size:9px;
  font-weight:800;
  letter-spacing:.32em;
  text-transform:uppercase;

  margin-bottom:16px;

  text-shadow:0 3px 15px rgba(0,0,0,.28);
}

h1{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:clamp(40px,6.5vw,78px);
  font-weight:400;
  line-height:1;

  letter-spacing:-.045em;

  text-shadow:
    0 5px 30px rgba(0,0,0,.25);
}

.subtitle{
  max-width:560px;

  margin-top:18px;

  font-family:Georgia,"Times New Roman",serif;

  font-size:clamp(15px,2vw,19px);

  line-height:1.5;

  color:rgba(255,255,255,.9);

  text-shadow:
    0 3px 18px rgba(0,0,0,.25);
}


/* =========================================================
   EMOTION CARDS
========================================================= */

.cards{
  width:100%;
  max-width:1000px;

  margin-top:34px;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  gap:14px;
}

.card{
  position:relative;

  min-height:155px;

  padding:24px 17px;

  border:1px solid rgba(255,255,255,.23);
  border-radius:25px;

  background:rgba(255,255,255,.10);

  color:#fff;

  cursor:pointer;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
    0 20px 60px rgba(0,0,0,.12);

  transition:
    transform .35s ease,
    background .35s ease,
    border-color .35s ease,
    box-shadow .35s ease;
}

.card:hover{
  transform:translateY(-8px);

  background:rgba(255,255,255,.18);

  border-color:rgba(255,255,255,.45);

  box-shadow:
    0 28px 70px rgba(0,0,0,.22);
}

.card:active{
  transform:scale(.98);
}

.card-symbol{
  width:43px;
  height:43px;

  margin:0 auto 13px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.13);

  border:1px solid rgba(255,255,255,.18);

  font-family:Georgia,serif;
  font-size:20px;
}

.card-title{
  font-family:Georgia,"Times New Roman",serif;

  font-size:18px;
  font-weight:400;

  line-height:1.2;
}

.card-text{
  margin-top:8px;

  font-size:9px;
  line-height:1.45;

  color:rgba(255,255,255,.68);
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom-note{
  margin-top:24px;

  font-size:8px;
  font-weight:700;

  letter-spacing:.2em;
  text-transform:uppercase;

  color:rgba(255,255,255,.62);

  text-shadow:0 2px 12px rgba(0,0,0,.3);
}


/* =========================================================
   SOUND
========================================================= */

.sound{
  position:absolute;

  z-index:30;

  left:max(20px,env(safe-area-inset-left));
  bottom:max(20px,env(safe-area-inset-bottom));

  width:42px;
  height:42px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.25);

  background:rgba(0,0,0,.14);

  color:#fff;

  cursor:pointer;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

  .cards{
    grid-template-columns:repeat(2,1fr);
    max-width:620px;
    gap:10px;
  }

  .card{
    min-height:125px;
    padding:17px 12px;
  }

  .card-title{
    font-size:16px;
  }
}


@media(max-width:500px){

  .top{
    top:max(14px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));
    right:max(15px,env(safe-area-inset-right));
  }

  .icon{
    width:43px;
    height:43px;
  }

  .back{
    width:38px;
    height:38px;
  }

  .content{
    width:calc(100% - 26px);
    padding-top:68px;
  }

  .eyebrow{
    font-size:7px;
    margin-bottom:11px;
  }

  h1{
    font-size:clamp(34px,10vw,48px);
  }

  .subtitle{
    margin-top:12px;
    font-size:14px;
    max-width:340px;
  }

  .cards{
    margin-top:22px;
    gap:8px;
  }

  .card{
    min-height:112px;
    padding:13px 8px;
    border-radius:18px;
  }

  .card-symbol{
    width:34px;
    height:34px;
    margin-bottom:8px;
    font-size:16px;
  }

  .card-title{
    font-size:13px;
  }

  .card-text{
    font-size:7px;
    margin-top:5px;
  }

  .bottom-note{
    margin-top:14px;
    font-size:7px;
  }

  .sound{
    left:max(15px,env(safe-area-inset-left));
    bottom:max(15px,env(safe-area-inset-bottom));
    width:38px;
    height:38px;
  }
}


@media(max-width:370px){

  .card-text{
    display:none;
  }

  .card{
    min-height:98px;
  }

  .card-title{
    font-size:12px;
  }

  h1{
    font-size:31px;
  }

  .subtitle{
    font-size:13px;
  }
}


@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<main class="page">

  <!-- ANIMATED BACKGROUND -->
  <div class="sky">

    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>

    <div class="warm-glow"></div>

    <div class="lavender"></div>

    <div class="night-sky"></div>

    <div class="moon"></div>

    <div class="stars"></div>

    <div class="shooting-star one"></div>
    <div class="shooting-star two"></div>

    <div class="rain"></div>

  </div>

  <div class="overlay"></div>


  <!-- TOP -->
  <header class="top">

    <a href="index.html" aria-label="AKSH">

      <img
        src="aksh-icon.PNG"
        alt="AKSH"
        class="icon"
      >

    </a>

    <a
      href="index.html"
      class="back"
      aria-label="Back to AKSH arrival"
    >
      ←
    </a>

  </header>


  <!-- MAIN -->
  <section class="content">

    <div class="eyebrow">
      A safe space for every mind
    </div>

    <h1>
      How are you feeling today?
    </h1>

    <p class="subtitle">
      You don't have to explain everything.
      Just start wherever you are.
    </p>


    <!-- FOUR EMOTIONS -->
    <div class="cards">

      <button class="card" type="button">
        <div class="card-symbol">◌</div>

        <div class="card-title">
          Anxious
        </div>

        <div class="card-text">
          When your thoughts feel a little too loud.
        </div>
      </button>


      <button class="card" type="button">
        <div class="card-symbol">≋</div>

        <div class="card-title">
          Overwhelmed
        </div>

        <div class="card-text">
          When everything feels like too much at once.
        </div>
      </button>


      <button class="card" type="button">
        <div class="card-symbol">♡</div>

        <div class="card-title">
          Need someone to talk
        </div>

        <div class="card-text">
          You don't have to carry everything alone.
        </div>
      </button>


      <button class="card" type="button">
        <div class="card-symbol">✦</div>

        <div class="card-title">
          Just exploring
        </div>

        <div class="card-text">
          Take your time. See what feels right.
        </div>
      </button>

    </div>


    <div class="bottom-note">
      Your space · Your pace · Your journey
    </div>

  </section>


  <!-- SOUND -->
  <button
    class="sound"
    id="sound"
    type="button"
    aria-label="Sound is off"
  >
    🔇
  </button>

</main>


<script>

/* =========================================================
   TIME-BASED ATMOSPHERE
========================================================= */

const sky = document.querySelector(".sky");
const sun = document.querySelector(".sun");
const warmGlow = document.querySelector(".warm-glow");
const lavender = document.querySelector(".lavender");
const nightSky = document.querySelector(".night-sky");
const moon = document.querySelector(".moon");
const stars = document.querySelector(".stars");
const rain = document.querySelector(".rain");


function updateAtmosphere(){

  const now = new Date();

  const hour = now.getHours();
  const minute = now.getMinutes();

  const total = hour * 60 + minute;


  /* RESET */

  warmGlow.style.opacity = ".55";
  lavender.style.opacity = "0";
  nightSky.style.opacity = "0";
  moon.style.opacity = "0";
  stars.style.opacity = "0";
  rain.style.opacity = "0";
  sun.style.opacity = "1";


  /* =======================================================
     MORNING
     5:00 AM — 11:59 AM
  ======================================================= */

  if(total >= 300 && total < 720){

    sky.style.background =
      "linear-gradient(180deg,#a9c4dc 0%,#c6d9e8 45%,#dbe4e9 100%)";

    sun.style.opacity = ".55";

  }


  /* =======================================================
     AFTERNOON
     12:00 PM — 4:59 PM
  ======================================================= */

  else if(total >= 720 && total < 1020){

    sky.style.background =
      "linear-gradient(180deg,#e7b47e 0%,#eac99b 45%,#d8b48f 100%)";

    sun.style.opacity = ".95";

    warmGlow.style.opacity = "1";

  }


  /* =======================================================
     EVENING
     5:00 PM — 6:59 PM
  ======================================================= */

  else if(total >= 1020 && total < 1140){

    sky.style.background =
      "linear-gradient(180deg,#71849d 0%,#7e8196 45%,#635b70 100%)";

    sun.style.opacity = ".3";

    rain.style.opacity = ".75";

  }


  /* =======================================================
     PURPLE / LAVENDER EVENING
     7:00 PM — 7:59 PM
  ======================================================= */

  else if(total >= 1140 && total < 1200){

    sky.style.background =
      "linear-gradient(180deg,#514a78 0%,#765d91 55%,#a27da4 100%)";

    sun.style.opacity = ".12";

    rain.style.opacity = ".35";

    lavender.style.opacity = "1";

  }


  /* =======================================================
     NIGHT
     8:00 PM — 4:59 AM
  ======================================================= */

  else{

    sky.style.background =
      "linear-gradient(180deg,#15162e 0%,#26234d 52%,#4b3563 100%)";

    sun.style.opacity = "0";

    warmGlow.style.opacity = "0";

    rain.style.opacity = "0";

    lavender.style.opacity = "0";

    nightSky.style.opacity = "1";

    moon.style.opacity = "1";

    stars.style.opacity = "1";

  }

}


/* =========================================================
   INITIALIZE
========================================================= */

updateAtmosphere();


/* =========================================================
   KEEP ATMOSPHERE SYNCHRONIZED
========================================================= */

setInterval(
  updateAtmosphere,
  30000
);


/* =========================================================
   SOUND BUTTON
========================================================= */

const sound = document.getElementById("sound");

let soundOn = false;

sound.addEventListener("click",()=>{

  soundOn = !soundOn;

  sound.textContent =
    soundOn ? "🔊" : "🔇";

  sound.setAttribute(
    "aria-label",
    soundOn
      ? "Sound is on"
      : "Sound is off"
  );

});

</script>

</body>
</html>
