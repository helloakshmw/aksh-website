<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#11131d">
<meta name="description" content="AKSH — How are you feeling today?">
<title>AKSH — How are you feeling today?</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#11131d;
  color:#fff;

  -webkit-font-smoothing:antialiased;
}

.page{
  position:relative;
  min-height:100svh;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;

  display:flex;
  align-items:center;
  justify-content:center;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
  position:fixed;
  inset:0;
  z-index:-10;

  background:
    radial-gradient(
      circle at 18% 20%,
      rgba(153,188,214,.28),
      transparent 32%
    ),
    radial-gradient(
      circle at 82% 30%,
      rgba(210,170,213,.20),
      transparent 34%
    ),
    radial-gradient(
      circle at 50% 90%,
      rgba(221,164,124,.13),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #1c2535 0%,
      #36384c 48%,
      #171925 100%
    );

  animation:
    backgroundMove 18s ease-in-out infinite alternate;
}

@keyframes backgroundMove{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.045);
  }
}


/* soft atmospheric glow */

.background::before{
  content:"";

  position:absolute;

  width:70vw;
  height:70vw;

  max-width:900px;
  max-height:900px;

  top:-32%;
  right:-20%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.12),
      transparent 68%
    );

  filter:blur(12px);

  animation:
    glowMove 12s ease-in-out infinite alternate;
}

@keyframes glowMove{
  from{
    transform:translate(0,0) scale(.94);
  }

  to{
    transform:translate(-45px,35px) scale(1.08);
  }
}


/* =========================================================
   ATMOSPHERIC LIGHT
========================================================= */

.light{
  position:fixed;
  z-index:-5;

  width:45vw;
  height:20vw;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(255,255,255,.10),
      transparent 70%
    );

  filter:blur(25px);

  pointer-events:none;
}

.light.one{
  left:-12%;
  bottom:5%;

  animation:
    lightOne 13s ease-in-out infinite alternate;
}

.light.two{
  right:-12%;
  bottom:18%;

  animation:
    lightTwo 16s ease-in-out infinite alternate;
}

@keyframes lightOne{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(90px);
  }
}

@keyframes lightTwo{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-90px);
  }
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:-2;

  background:
    linear-gradient(
      180deg,
      rgba(8,10,17,.15),
      transparent 35%,
      rgba(5,7,13,.62) 100%
    );

  pointer-events:none;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:fixed;

  z-index:50;

  top:max(18px,env(safe-area-inset-top));

  left:max(20px,env(safe-area-inset-left));

  right:max(20px,env(safe-area-inset-right));

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.logo img{
  width:50px;
  height:50px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 6px 20px rgba(0,0,0,.35)
    );
}

.back{
  width:42px;
  height:42px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  text-decoration:none;

  border:1px solid rgba(255,255,255,.25);

  background:
    rgba(0,0,0,.14);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  transition:
    transform .25s ease,
    background .25s ease;
}

.back:hover{
  transform:translateX(-3px);

  background:
    rgba(255,255,255,.12);
}


/* =========================================================
   MAIN
========================================================= */

.content{
  width:min(1100px,calc(100% - 34px));

  padding:
    105px 0
    max(35px,env(safe-area-inset-bottom));

  text-align:center;
}


/* =========================================================
   HEADING
========================================================= */

.eyebrow{
  margin-bottom:14px;

  font-size:9px;

  font-weight:800;

  letter-spacing:.32em;

  text-transform:uppercase;

  color:rgba(255,255,255,.58);
}

h1{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      42px,
      7vw,
      78px
    );

  font-weight:400;

  line-height:1.02;

  letter-spacing:-.055em;

  text-shadow:
    0 8px 35px rgba(0,0,0,.30);
}

.intro{
  max-width:620px;

  margin:
    17px auto 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      15px,
      2vw,
      19px
    );

  line-height:1.5;

  color:rgba(255,255,255,.76);
}


/* =========================================================
   EMOTION CARDS
========================================================= */

.cards{
  width:100%;

  max-width:1050px;

  margin:
    38px auto 0;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;
}

.card{
  position:relative;

  min-height:250px;

  padding:26px 22px;

  border-radius:27px;

  border:1px solid rgba(255,255,255,.20);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.15),
      rgba(255,255,255,.055)
    );

  color:#fff;

  text-align:left;

  cursor:pointer;

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.17);

  transition:
    transform .35s ease,
    background .35s ease,
    border-color .35s ease,
    box-shadow .35s ease;
}

.card:hover{
  transform:translateY(-9px);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.23),
      rgba(255,255,255,.08)
    );

  border-color:
    rgba(255,255,255,.42);

  box-shadow:
    0 35px 85px rgba(0,0,0,.27);
}

.card:active{
  transform:scale(.98);
}

.card:focus-visible{
  outline:
    2px solid rgba(255,255,255,.8);

  outline-offset:4px;
}


/* number */

.card-number{
  position:absolute;

  top:19px;
  right:20px;

  font-size:8px;

  font-weight:800;

  letter-spacing:.16em;

  color:rgba(255,255,255,.40);
}


/* icon */

.card-icon{
  width:55px;
  height:55px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:30px;

  border-radius:18px;

  background:
    rgba(255,255,255,.10);

  border:
    1px solid rgba(255,255,255,.18);

  font-size:23px;
}


/* title */

.card h2{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:23px;

  font-weight:400;

  line-height:1.12;
}


/* description */

.card p{
  margin-top:11px;

  font-size:10px;

  line-height:1.55;

  color:rgba(255,255,255,.62);
}


/* arrow */

.card-arrow{
  position:absolute;

  left:22px;
  bottom:20px;

  font-size:18px;

  color:rgba(255,255,255,.68);

  transition:
    transform .25s ease;
}

.card:hover .card-arrow{
  transform:translateX(6px);
}


/* =========================================================
   BOTTOM LINE
========================================================= */

.bottom-note{
  margin-top:23px;

  font-size:8px;

  font-weight:700;

  letter-spacing:.16em;

  text-transform:uppercase;

  color:rgba(255,255,255,.46);
}


/* =========================================================
   LOADING / TRANSITION
========================================================= */

.transition{
  position:fixed;
  inset:0;

  z-index:100;

  pointer-events:none;

  background:
    linear-gradient(
      135deg,
      #141724,
      #3b3c50
    );

  opacity:0;

  transition:
    opacity .45s ease;
}

.transition.active{
  opacity:1;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

  .cards{
    grid-template-columns:
      repeat(2,1fr);

    max-width:620px;
  }

  .card{
    min-height:210px;
  }
}


@media(max-width:600px){

  .topbar{
    top:max(13px,env(safe-area-inset-top));

    left:max(14px,env(safe-area-inset-left));

    right:max(14px,env(safe-area-inset-right));
  }

  .logo img{
    width:43px;
    height:43px;
  }

  .back{
    width:38px;
    height:38px;
  }

  .content{
    width:calc(100% - 24px);

    padding-top:76px;
  }

  .eyebrow{
    font-size:7px;
    margin-bottom:10px;
  }

  h1{
    font-size:
      clamp(
        35px,
        10vw,
        49px
      );
  }

  .intro{
    margin-top:11px;
    font-size:13px;
    max-width:350px;
  }

  .cards{
    margin-top:23px;

    gap:9px;

    grid-template-columns:
      repeat(2,1fr);
  }

  .card{
    min-height:185px;

    padding:18px 15px;

    border-radius:20px;
  }

  .card-number{
    top:13px;
    right:14px;
    font-size:6px;
  }

  .card-icon{
    width:40px;
    height:40px;

    margin-bottom:20px;

    border-radius:13px;

    font-size:18px;
  }

  .card h2{
    font-size:17px;
  }

  .card p{
    margin-top:7px;
    font-size:8px;
    line-height:1.4;
  }

  .card-arrow{
    left:15px;
    bottom:13px;
    font-size:15px;
  }

  .bottom-note{
    margin-top:15px;
    font-size:6px;
  }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px){

  .content{
    padding-top:68px;
  }

  .intro{
    font-size:11px;
  }

  .cards{
    margin-top:17px;
  }

  .card{
    min-height:158px;
    padding:14px 12px;
  }

  .card-icon{
    width:34px;
    height:34px;

    margin-bottom:14px;

    border-radius:11px;

    font-size:15px;
  }

  .card h2{
    font-size:14px;
  }

  .card p{
    font-size:7px;
  }

  .card-arrow{
    left:12px;
    bottom:10px;
  }
}


/* =========================================================
   LANDSCAPE MOBILE
========================================================= */

@media(
  orientation:landscape
) and (max-height:600px){

  .content{
    padding-top:62px;
  }

  .eyebrow{
    display:none;
  }

  h1{
    font-size:35px;
  }

  .intro{
    margin-top:6px;
    font-size:11px;
  }

  .cards{
    margin-top:13px;
  }

  .card{
    min-height:145px;
    padding:14px;
  }

  .card-icon{
    width:34px;
    height:34px;
    margin-bottom:10px;
  }

  .card h2{
    font-size:15px;
  }

  .card p{
    font-size:7px;
  }

  .bottom-note{
    display:none;
  }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>


<body>

<main class="page">


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <div class="background"></div>

  <div class="light one"></div>
  <div class="light two"></div>

  <div class="overlay"></div>


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="topbar">

    <a
      href="index.html"
      class="logo"
      aria-label="Back to AKSH welcome page"
    >

      <img
        src="aksh-icon.PNG"
        alt="AKSH"
      >

    </a>


    <a
      href="index.html"
      class="back"
      aria-label="Back"
    >
      ←
    </a>

  </header>


  <!-- =====================================================
       PAGE CONTENT
  ====================================================== -->

  <section class="content">

    <div class="eyebrow">
      AKSH · A safe space for every mind
    </div>


    <h1>
      How are you<br>
      feeling today?
    </h1>


    <p class="intro">
      There is no right answer here.
      Just choose what feels closest to you right now.
    </p>


    <!-- =================================================
         FOUR EMOTION CARDS
    ================================================== -->

    <div class="cards">


      <!-- 01 ANXIOUS -->

      <button
        class="card"
        type="button"
        data-emotion="anxious"
        aria-label="I feel anxious"
      >

        <span class="card-number">
          01
        </span>

        <div class="card-icon">
          ◌
        </div>

        <h2>
          Anxious
        </h2>

        <p>
          Your mind feels restless,
          worried or unable to slow down.
        </p>

        <span class="card-arrow">
          →
        </span>

      </button>


      <!-- 02 OVERWHELMED -->

      <button
        class="card"
        type="button"
        data-emotion="overwhelmed"
        aria-label="I feel overwhelmed"
      >

        <span class="card-number">
          02
        </span>

        <div class="card-icon">
          ≋
        </div>

        <h2>
          Overwhelmed
        </h2>

        <p>
          There is simply too much happening
          and you need some breathing room.
        </p>

        <span class="card-arrow">
          →
        </span>

      </button>


      <!-- 03 SOMEONE TO TALK -->

      <button
        class="card"
        type="button"
        data-emotion="talk"
        aria-label="I need someone to talk to"
      >

        <span class="card-number">
          03
        </span>

        <div class="card-icon">
          ◇
        </div>

        <h2>
          Need someone to talk
        </h2>

        <p>
          You don't want to carry the thought
          alone. You would like someone there.
        </p>

        <span class="card-arrow">
          →
        </span>

      </button>


      <!-- 04 EXPLORING -->

      <button
        class="card"
        type="button"
        data-emotion="exploring"
        aria-label="I am just exploring"
      >

        <span class="card-number">
          04
        </span>

        <div class="card-icon">
          ✦
        </div>

        <h2>
          Just exploring
        </h2>

        <p>
          You are curious about yourself,
          emotions, growth or what AKSH offers.
        </p>

        <span class="card-arrow">
          →
        </span>

      </button>


    </div>


    <div class="bottom-note">
      Take your time · You are welcome here
    </div>

  </section>


  <!-- =====================================================
       TRANSITION
  ====================================================== -->

  <div
    class="transition"
    id="transition"
    aria-hidden="true"
  ></div>


</main>


<script>

/* =========================================================
   PAGE 1 → PAGE 2
=========================================================

   Every emotion card goes to page2.html.

   The selected emotion is saved temporarily so that
   page2.html can later use the correct emotional
   experience.

========================================================= */

const cards =
  document.querySelectorAll(".card");

const transition =
  document.getElementById("transition");


cards.forEach(card => {

  card.addEventListener("click", function(){

    const emotion =
      this.dataset.emotion;

    /*
      Save the visitor's selection.

      This does NOT require a database.
      It stays in the visitor's browser.
    */

    try{

      sessionStorage.setItem(
        "akshEmotion",
        emotion
      );

    }catch(error){

      /*
        If browser storage is unavailable,
        navigation still continues.
      */

    }


    /*
      Premium transition before opening Page 2.
    */

    transition.classList.add("active");


    /*
      Small delay lets the transition appear
      before the new page loads.
    */

    setTimeout(function(){

      window.location.href =
        "page2.html";

    },420);

  });

});


/* =========================================================
   KEYBOARD ACCESSIBILITY
========================================================= */

cards.forEach(card => {

  card.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" ||
        event.key === " "
      ){

        event.preventDefault();

        this.click();

      }

    }
  );

});


/* =========================================================
   PREVENT BROKEN BACK/EMPTY NAVIGATION
========================================================= */

window.addEventListener(
  "pageshow",
  function(){

    transition.classList.remove(
      "active"
    );

  }
);

</script>

</body>
</html>
