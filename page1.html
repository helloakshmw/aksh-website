<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#172433">
<title>AKSH — How are you feeling today?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;
    background:#172433;
    -webkit-font-smoothing:antialiased;
}

.page{
    position:relative;
    min-height:100svh;
    min-height:100vh;
    overflow:hidden;
    isolation:isolate;
}


/* =========================================================
   ATMOSPHERIC BACKGROUND
========================================================= */

.sky{
    position:fixed;
    inset:0;
    z-index:-20;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 15% 15%,
            rgba(204,227,238,.65) 0%,
            rgba(204,227,238,.25) 22%,
            transparent 46%
        ),
        radial-gradient(
            ellipse at 85% 25%,
            rgba(224,201,224,.55) 0%,
            rgba(224,201,224,.20) 24%,
            transparent 50%
        ),
        radial-gradient(
            ellipse at 48% 80%,
            rgba(170,178,211,.30) 0%,
            transparent 48%
        ),
        linear-gradient(
            135deg,
            #30485a 0%,
            #657587 38%,
            #766d80 66%,
            #272d3d 100%
        );
}


/* moving light */

.light{
    position:absolute;
    border-radius:50%;
    filter:blur(65px);
    pointer-events:none;
}

.light.a{
    width:70vw;
    height:28vw;
    left:-20vw;
    top:5vh;
    background:rgba(221,239,246,.27);
    animation:floatA 17s ease-in-out infinite alternate;
}

.light.b{
    width:65vw;
    height:25vw;
    right:-18vw;
    top:18vh;
    background:rgba(238,210,235,.25);
    animation:floatB 20s ease-in-out infinite alternate;
}

.light.c{
    width:80vw;
    height:30vw;
    left:10vw;
    bottom:-15vw;
    background:rgba(173,173,209,.22);
    animation:floatC 22s ease-in-out infinite alternate;
}

@keyframes floatA{
    0%{
        transform:translate3d(0,0,0) scale(1);
    }
    100%{
        transform:translate3d(9vw,3vh,0) scale(1.12);
    }
}

@keyframes floatB{
    0%{
        transform:translate3d(0,0,0) scale(1);
    }
    100%{
        transform:translate3d(-8vw,5vh,0) scale(1.1);
    }
}

@keyframes floatC{
    0%{
        transform:translate3d(0,0,0);
    }
    100%{
        transform:translate3d(-5vw,-4vh,0);
    }
}


/* =========================================================
   CLOUD FORMS
========================================================= */

.cloud{
    position:absolute;
    display:flex;
    align-items:center;
    pointer-events:none;
    filter:blur(2px);
    opacity:.34;
}

.cloud span{
    display:block;
    position:relative;
    border-radius:50%;
    background:rgba(244,248,249,.52);
    box-shadow:
        0 12px 35px rgba(255,255,255,.07);
}

.cloud span:nth-child(1){
    width:120px;
    height:70px;
}

.cloud span:nth-child(2){
    width:170px;
    height:100px;
    margin-left:-30px;
}

.cloud span:nth-child(3){
    width:125px;
    height:72px;
    margin-left:-35px;
}

.cloud span:nth-child(4){
    width:90px;
    height:55px;
    margin-left:-25px;
}

.cloud.one{
    width:500px;
    height:120px;
    left:-130px;
    top:16%;
    animation:cloudOne 25s ease-in-out infinite alternate;
}

.cloud.two{
    width:520px;
    height:120px;
    right:-180px;
    top:31%;
    transform:scale(.82);
    opacity:.25;
    animation:cloudTwo 29s ease-in-out infinite alternate;
}

.cloud.three{
    width:600px;
    height:120px;
    left:18%;
    bottom:5%;
    transform:scale(.7);
    opacity:.16;
    animation:cloudThree 32s ease-in-out infinite alternate;
}

@keyframes cloudOne{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(170px) translateY(25px);
    }
}

@keyframes cloudTwo{
    from{
        transform:translateX(0) scale(.82);
    }
    to{
        transform:translateX(-160px) translateY(-18px) scale(.88);
    }
}

@keyframes cloudThree{
    from{
        transform:translateX(0) scale(.7);
    }
    to{
        transform:translateX(-130px) translateY(-25px) scale(.76);
    }
}


/* =========================================================
   ATMOSPHERIC GRAIN
========================================================= */

.grain{
    position:absolute;
    inset:-50%;
    z-index:2;
    pointer-events:none;
    opacity:.035;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");

    animation:grainMove .25s steps(2) infinite;
}

@keyframes grainMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(2%,1%)}
    50%{transform:translate(-1%,2%)}
    75%{transform:translate(1%,-2%)}
    100%{transform:translate(-2%,-1%)}
}


/* =========================================================
   DARK CINEMATIC EDGE
========================================================= */

.vignette{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(5,9,16,.12) 68%,
            rgba(5,8,15,.52) 100%
        );
}


/* =========================================================
   BRAND
========================================================= */

.brand{
    position:absolute;
    z-index:20;

    top:max(20px,env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);

    text-align:center;
}

.brand img{
    display:block;
    width:58px;
    height:58px;
    object-fit:contain;

    filter:
        drop-shadow(
            0 8px 24px rgba(0,0,0,.3)
        );
}

.brand-word{
    margin-top:3px;

    font-size:8px;
    font-weight:700;
    letter-spacing:.34em;

    color:rgba(255,255,255,.76);
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    position:relative;
    z-index:10;

    width:min(1160px,calc(100% - 30px));

    min-height:100svh;

    margin:auto;

    padding:
        130px 0
        max(35px,env(safe-area-inset-bottom));

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.eyebrow{
    margin-bottom:15px;

    font-size:9px;
    font-weight:800;
    letter-spacing:.34em;
    text-transform:uppercase;

    color:rgba(255,255,255,.62);

    text-shadow:
        0 4px 18px rgba(0,0,0,.3);
}

h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(43px,7vw,80px);

    font-weight:400;

    line-height:.99;

    letter-spacing:-.055em;

    text-shadow:
        0 9px 35px rgba(0,0,0,.32);
}

.intro{
    width:min(600px,100%);

    margin-top:17px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(14px,2vw,18px);

    line-height:1.55;

    color:rgba(255,255,255,.78);

    text-shadow:
        0 4px 18px rgba(0,0,0,.25);
}


/* =========================================================
   CARDS
========================================================= */

.cards{
    width:100%;
    margin-top:38px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:14px;
}

.card{
    position:relative;

    min-height:225px;

    padding:24px 21px;

    border:1px solid rgba(255,255,255,.23);
    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.17),
            rgba(255,255,255,.055)
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.20),
        inset 0 1px rgba(255,255,255,.10);

    color:#fff;

    text-align:left;

    cursor:pointer;

    font:inherit;

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}

.card:hover{
    transform:translateY(-9px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.075)
        );

    border-color:rgba(255,255,255,.42);

    box-shadow:
        0 35px 90px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.14);
}

.card:active{
    transform:scale(.985);
}

.card:focus-visible{
    outline:2px solid rgba(255,255,255,.9);
    outline-offset:4px;
}

.number{
    position:absolute;

    top:17px;
    right:18px;

    font-size:8px;
    font-weight:800;
    letter-spacing:.18em;

    color:rgba(255,255,255,.4);
}

.icon{
    width:52px;
    height:52px;

    margin-bottom:27px;

    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.18);

    font-size:22px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.08);
}

.card h2{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:21px;
    font-weight:400;

    line-height:1.12;
}

.card p{
    margin-top:10px;

    max-width:220px;

    font-size:10px;
    line-height:1.55;

    color:rgba(255,255,255,.64);
}

.arrow{
    position:absolute;

    left:21px;
    bottom:17px;

    font-size:18px;

    color:rgba(255,255,255,.7);

    transition:transform .25s ease;
}

.card:hover .arrow{
    transform:translateX(7px);
}


/* =========================================================
   FOOTER NOTE
========================================================= */

.bottom-note{
    margin-top:21px;

    font-size:8px;
    font-weight:700;
    letter-spacing:.17em;
    text-transform:uppercase;

    color:rgba(255,255,255,.48);
}


/* =========================================================
   TRANSITION
========================================================= */

.transition{
    position:fixed;
    inset:0;
    z-index:100;

    background:
        linear-gradient(
            135deg,
            #30485a,
            #766d80,
            #272d3d
        );

    opacity:0;
    pointer-events:none;

    transition:opacity .45s ease;
}

.transition.show{
    opacity:1;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:950px){

    .cards{
        max-width:720px;
        grid-template-columns:repeat(2,1fr);
    }

    .card{
        min-height:200px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .brand{
        top:max(13px,env(safe-area-inset-top));
    }

    .brand img{
        width:48px;
        height:48px;
    }

    .brand-word{
        font-size:6px;
    }

    .content{
        width:calc(100% - 20px);
        padding-top:95px;
    }

    .eyebrow{
        font-size:6px;
        margin-bottom:10px;
    }

    h1{
        font-size:clamp(36px,10.5vw,51px);
    }

    .intro{
        margin-top:11px;
        font-size:12px;
        max-width:350px;
    }

    .cards{
        margin-top:23px;
        gap:8px;
    }

    .card{
        min-height:182px;
        padding:17px 14px;
        border-radius:20px;
    }

    .number{
        top:12px;
        right:12px;
        font-size:6px;
    }

    .icon{
        width:39px;
        height:39px;
        margin-bottom:18px;
        border-radius:12px;
        font-size:16px;
    }

    .card h2{
        font-size:16px;
    }

    .card p{
        margin-top:7px;
        font-size:8px;
        line-height:1.4;
    }

    .arrow{
        left:14px;
        bottom:11px;
        font-size:15px;
    }

    .bottom-note{
        margin-top:13px;
        font-size:6px;
    }

    .cloud.one{
        transform:scale(.62);
        transform-origin:left center;
    }

    .cloud.two{
        transform:scale(.55);
        transform-origin:right center;
    }

    .cloud.three{
        transform:scale(.48);
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .content{
        padding-top:82px;
    }

    .intro{
        font-size:11px;
    }

    .cards{
        margin-top:17px;
    }

    .card{
        min-height:157px;
        padding:13px 11px;
    }

    .icon{
        width:33px;
        height:33px;
        margin-bottom:13px;
        border-radius:10px;
        font-size:14px;
    }

    .card h2{
        font-size:14px;
    }

    .card p{
        font-size:7px;
    }

    .arrow{
        left:11px;
        bottom:8px;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media(
    orientation:landscape
) and (max-height:600px){

    .brand{
        top:8px;
    }

    .brand img{
        width:37px;
        height:37px;
    }

    .brand-word{
        display:none;
    }

    .content{
        padding-top:50px;
    }

    .eyebrow{
        display:none;
    }

    h1{
        font-size:34px;
    }

    .intro{
        margin-top:5px;
        font-size:10px;
    }

    .cards{
        margin-top:11px;
    }

    .card{
        min-height:132px;
        padding:12px;
    }

    .icon{
        width:31px;
        height:31px;
        margin-bottom:8px;
    }

    .card h2{
        font-size:14px;
    }

    .card p{
        font-size:7px;
    }

    .bottom-note{
        display:none;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<main class="page">

    <!-- =================================================
         PAGE 1 BACKGROUND
         Completely independent from Page 0 videos.
    ================================================== -->

    <div class="sky">

        <div class="light a"></div>
        <div class="light b"></div>
        <div class="light c"></div>


        <div class="cloud one">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>


        <div class="cloud two">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>


        <div class="cloud three">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>


        <div class="grain"></div>
        <div class="vignette"></div>

    </div>


    <!-- =================================================
         AKSH
    ================================================== -->

    <div class="brand">

        <img
            src="aksh-icon.PNG"
            alt="AKSH"
        >

        <div class="brand-word">
            AKSH
        </div>

    </div>


    <!-- =================================================
         MAIN PAGE 1
    ================================================== -->

    <section class="content">

        <div class="eyebrow">
            A safe space for every mind
        </div>


        <h1>
            How are you<br>
            feeling today?
        </h1>


        <p class="intro">
            There is no right answer.
            Just choose what feels closest to you right now.
        </p>


        <div class="cards">


            <!-- 01 -->

            <button
                class="card"
                type="button"
                data-emotion="anxious"
                aria-label="Anxious"
            >

                <span class="number">01</span>

                <div class="icon">◌</div>

                <h2>
                    Anxious
                </h2>

                <p>
                    Your mind feels restless,
                    worried or unable to slow down.
                </p>

                <span class="arrow">→</span>

            </button>


            <!-- 02 -->

            <button
                class="card"
                type="button"
                data-emotion="overwhelmed"
                aria-label="Overwhelmed"
            >

                <span class="number">02</span>

                <div class="icon">≋</div>

                <h2>
                    Overwhelmed
                </h2>

                <p>
                    There is too much happening
                    and you need some breathing room.
                </p>

                <span class="arrow">→</span>

            </button>


            <!-- 03 -->

            <button
                class="card"
                type="button"
                data-emotion="talk"
                aria-label="Need someone to talk"
            >

                <span class="number">03</span>

                <div class="icon">◇</div>

                <h2>
                    Need someone to talk
                </h2>

                <p>
                    You don't want to carry the thought
                    alone. Someone can be here with you.
                </p>

                <span class="arrow">→</span>

            </button>


            <!-- 04 -->

            <button
                class="card"
                type="button"
                data-emotion="exploring"
                aria-label="Just exploring"
            >

                <span class="number">04</span>

                <div class="icon">✦</div>

                <h2>
                    Just exploring
                </h2>

                <p>
                    You are curious about yourself,
                    emotions, growth or AKSH.
                </p>

                <span class="arrow">→</span>

            </button>


        </div>


        <div class="bottom-note">
            Take your time · You are welcome here
        </div>

    </section>


    <div
        class="transition"
        id="transition"
    ></div>

</main>


<script>

/* =========================================================
   PAGE 1 → PAGE 2
========================================================= */

const cards =
    document.querySelectorAll(".card");

const transition =
    document.getElementById("transition");


cards.forEach(function(card){

    card.addEventListener("click",function(){

        const emotion =
            this.dataset.emotion;


        /*
         * Remember the visitor's choice.
         * Page 2 can use this later.
         */

        try{

            sessionStorage.setItem(
                "akshEmotion",
                emotion
            );

        }catch(error){

            /*
             * Navigation still works even if
             * browser storage is unavailable.
             */

        }


        /*
         * Premium transition.
         */

        transition.classList.add("show");


        /*
         * Open Page 2.
         */

        setTimeout(function(){

            window.location.href =
                "page2.html";

        },450);

    });

});


/* Keyboard accessibility */

cards.forEach(function(card){

    card.addEventListener("keydown",function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            this.click();

        }

    });

});

</script>

</body>
</html>
