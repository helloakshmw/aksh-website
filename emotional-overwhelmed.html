<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH — I Feel Overwhelmed</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  color:#4a3425;
  background:#fbf0df;
  overflow-x:hidden;
}

.page{
  min-height:100svh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;

  background:
    radial-gradient(
      circle at 82% 15%,
      rgba(255,216,153,.8),
      transparent 24%
    ),
    radial-gradient(
      ellipse at 15% 80%,
      rgba(225,157,92,.2),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #fff8ed,
      #f7dfbd 55%,
      #efcda9
    );
}

.page::before{
  content:"";
  position:absolute;
  width:55vw;
  height:18vw;
  left:-15vw;
  top:17%;
  border-radius:50%;
  background:rgba(255,255,255,.38);
  filter:blur(25px);
  animation:floatCloud 12s ease-in-out infinite alternate;
}

.page::after{
  content:"";
  position:absolute;
  width:38vw;
  height:15vw;
  right:-8vw;
  bottom:10%;
  border-radius:50%;
  background:rgba(211,139,70,.14);
  filter:blur(28px);
}

.top{
  position:absolute;
  z-index:5;
  top:25px;
  left:25px;
  right:25px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  letter-spacing:.18em;
}

.back{
  padding:10px 15px;
  border-radius:100px;

  color:#4a3425;
  text-decoration:none;

  font-size:10px;

  border:1px solid rgba(74,52,37,.13);
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(15px);
}

.content{
  position:relative;
  z-index:3;

  width:min(720px,100%);
  text-align:center;
}

.eyebrow{
  margin-bottom:18px;

  color:#9a7554;

  font-size:8px;
  font-weight:700;
  letter-spacing:.27em;
  text-transform:uppercase;
}

h1{
  margin:0;

  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;

  font-size:clamp(48px,8vw,78px);
  line-height:.95;
  letter-spacing:-.055em;
}

h1 em{
  color:#bd7840;
  font-style:italic;
}

.message{
  width:min(500px,100%);
  margin:25px auto 0;

  color:#806a59;

  font-size:13px;
  line-height:1.75;
}

/* =========================================================
   PAUSE ORB
========================================================= */

.pause{
  position:relative;

  width:150px;
  height:150px;

  margin:38px auto 35px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.92) 0 20%,
      rgba(244,186,117,.38) 40%,
      rgba(214,135,61,.17) 67%,
      transparent 72%
    );

  box-shadow:
    0 0 65px rgba(211,139,70,.23);

  animation:
    pausePulse 5s ease-in-out infinite;
}

.pause::before,
.pause::after{
  content:"";

  position:absolute;

  border:1px solid rgba(190,121,60,.22);

  border-radius:50%;
}

.pause::before{
  inset:15%;
  animation:ring 5s ease-in-out infinite;
}

.pause::after{
  inset:5%;
  animation:ring 5s ease-in-out infinite reverse;
}

.pause span{
  position:relative;
  z-index:2;

  font-family:Georgia,"Times New Roman",serif;

  font-size:13px;
  color:#9b693f;
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.button{
  display:inline-flex;
  justify-content:center;
  align-items:center;

  min-height:43px;

  padding:13px 20px;

  border-radius:100px;

  font-size:10px;
  font-weight:650;

  text-decoration:none;

  transition:.3s ease;
}

.button:hover{
  transform:translateY(-3px);
}

.primary{
  color:#fff;

  background:#4a3425;

  box-shadow:
    0 14px 30px rgba(74,52,37,.17);
}

.secondary{
  color:#6e513c;

  border:1px solid rgba(110,81,60,.18);

  background:rgba(255,255,255,.42);
}

.bottom{
  position:absolute;
  z-index:5;

  left:25px;
  right:25px;
  bottom:25px;

  text-align:center;

  color:#a18b78;

  font-size:8px;
  letter-spacing:.08em;
}

@keyframes pausePulse{

  0%,100%{
    transform:scale(.9);
    box-shadow:0 0 45px rgba(211,139,70,.15);
  }

  50%{
    transform:scale(1.07);
    box-shadow:0 0 90px rgba(211,139,70,.29);
  }

}

@keyframes ring{

  0%,100%{
    transform:scale(.92);
    opacity:.35;
  }

  50%{
    transform:scale(1.08);
    opacity:.8;
  }

}

@keyframes floatCloud{

  from{
    transform:translateX(-15px);
  }

  to{
    transform:translateX(35px) scale(1.07);
  }

}

@media(max-width:600px){

  .page{
    padding:35px 20px;
  }

  .top{
    top:18px;
    left:18px;
    right:18px;
  }

  .logo{
    font-size:18px;
  }

  h1{
    font-size:48px;
  }

  .message{
    font-size:12px;
  }

  .pause{
    width:125px;
    height:125px;
    margin:30px auto;
  }

  .actions{
    flex-direction:column;
    width:min(300px,100%);
    margin:auto;
  }

  .button{
    width:100%;
  }

}
</style>
</head>

<body>

<section class="page">

  <div class="top">

    <div class="logo">
      AKSH
    </div>

    <a
      href="homepage.html"
      class="back"
    >
      ← Back to AKSH
    </a>

  </div>


  <main class="content">

    <div class="eyebrow">
      You don't have to hold everything at once
    </div>

    <h1>
      I feel<br>
      <em>overwhelmed.</em>
    </h1>

    <p class="message">
      When everything arrives at the same time,
      even small things can feel enormous.
      You can pause here. Nothing needs to be solved
      all at once.
    </p>


    <div class="pause">

      <span>
        Pause
      </span>

    </div>


    <div class="actions">

      <a
        href="aksh-ai.html"
        class="button primary"
      >
        Talk to AKSH Intelligence
      </a>

      <a
        href="human-support.html"
        class="button secondary"
      >
        Talk to a human
      </a>

    </div>

  </main>


  <div class="bottom">
    A SAFE SPACE FOR EVERY MIND
  </div>

</section>

</body>
</html>
