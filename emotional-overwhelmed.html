<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AKSH — You Don't Have To Hold It All</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      color: #493d38;

      background: #eee2d8;
    }

    .page {
      position: relative;

      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255,255,255,.9),
          transparent 27%
        ),
        radial-gradient(
          circle at 87% 25%,
          rgba(221,177,144,.32),
          transparent 31%
        ),
        linear-gradient(
          145deg,
          #f7f0e9 0%,
          #eee1d8 50%,
          #e2cbbb 100%
        );
    }

    /* =====================================================
       WARM CLOUD ATMOSPHERE
    ===================================================== */

    .cloud {
      position: absolute;

      border-radius: 50%;

      filter: blur(38px);

      pointer-events: none;
    }

    .cloud-one {
      width: 55vw;
      height: 19vw;

      top: 17%;
      left: -14vw;

      background:
        rgba(255,255,255,.5);

      animation:
        cloudOne 16s ease-in-out infinite alternate;
    }

    .cloud-two {
      width: 46vw;
      height: 17vw;

      right: -14vw;
      bottom: 16%;

      background:
        rgba(201,143,105,.22);

      animation:
        cloudTwo 19s ease-in-out infinite alternate;
    }

    .cloud-three {
      width: 32vw;
      height: 12vw;

      top: 5%;
      left: 42%;

      background:
        rgba(255,244,234,.45);

      animation:
        cloudThree 14s ease-in-out infinite alternate;
    }

    /* =====================================================
       NAV
    ===================================================== */

    .top {
      position: absolute;

      z-index: 10;

      top: 24px;
      left: 27px;
      right: 27px;

      display: flex;

      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 18px;

      letter-spacing: .2em;

      color: #574941;

      text-decoration: none;
    }

    .back {
      padding: 9px 14px;

      border:
        1px solid
        rgba(75,59,52,.12);

      border-radius: 999px;

      color: #76665e;

      background:
        rgba(255,255,255,.38);

      backdrop-filter:
        blur(15px);

      font-size: 8px;

      text-decoration: none;

      transition: .25s ease;
    }

    .back:hover {
      background:
        rgba(255,255,255,.65);

      transform:
        translateY(-2px);
    }

    /* =====================================================
       MAIN
    ===================================================== */

    .content {
      position: relative;

      z-index: 5;

      width: min(850px, 92%);

      text-align: center;

      transform:
        translateY(1vh);
    }

    .symbol {
      width: 64px;
      height: 64px;

      margin:
        0 auto
        25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #ad7656;

      border:
        1px solid
        rgba(173,118,86,.16);

      background:
        rgba(255,255,255,.4);

      backdrop-filter:
        blur(15px);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 24px;

      box-shadow:
        0 18px 45px
        rgba(143,99,74,.09);

      animation:
        soften 5s ease-in-out infinite;
    }

    .eyebrow {
      margin-bottom: 14px;

      color: #9a7867;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: .3em;

      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          44px,
          6.5vw,
          70px
        );

      line-height: .98;

      font-weight: 400;

      letter-spacing: -.055em;

      color: #493d38;
    }

    h1 em {
      color: #a66f52;

      font-style: italic;
    }

    .intro {
      width: min(520px, 100%);

      margin:
        20px auto
        32px;

      color: #7d6e67;

      font-size: 11px;

      line-height: 1.75;
    }

    /* =====================================================
       ACTIONS
    ===================================================== */

    .actions {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .action {
      min-width: 155px;

      padding: 13px 18px;

      border-radius: 999px;

      text-decoration: none;

      font-size: 8px;

      letter-spacing: .1em;

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .action:hover {
      transform:
        translateY(-3px);
    }

    .primary {
      color: white;

      background:
        #9b7059;

      box-shadow:
        0 12px 30px
        rgba(143,99,74,.16);
    }

    .secondary {
      color: #755f54;

      border:
        1px solid
        rgba(143,99,74,.14);

      background:
        rgba(255,255,255,.42);

      backdrop-filter:
        blur(15px);
    }

    /* =====================================================
       FLOATING WARM ORB
    ===================================================== */

    .orb {
      width: min(250px, 52vw);
      height: min(250px, 52vw);

      position: absolute;

      left: 50%;
      bottom: -170px;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,235,218,.6),
          rgba(194,139,105,.13) 55%,
          transparent 71%
        );

      filter: blur(4px);

      animation:
        orb 8s ease-in-out infinite;

      pointer-events: none;
    }

    .bottom {
      position: absolute;

      z-index: 10;

      left: 25px;
      right: 25px;
      bottom: 20px;

      display: flex;

      justify-content: center;

      color: #9a8a81;

      font-size: 7px;

      letter-spacing: .12em;
    }

    /* =====================================================
       ANIMATION
    ===================================================== */

    @keyframes soften {

      0%,
      100% {
        transform: scale(.95);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @keyframes orb {

      0%,
      100% {
        transform:
          translateX(-50%)
          scale(.82);

        opacity: .42;
      }

      50% {
        transform:
          translateX(-50%)
          scale(1.18);

        opacity: .78;
      }
    }

    @keyframes cloudOne {

      from {
        transform:
          translateX(-20px);
      }

      to {
        transform:
          translateX(48px)
          translateY(-15px);
      }
    }

    @keyframes cloudTwo {

      from {
        transform:
          translateX(20px);
      }

      to {
        transform:
          translateX(-40px)
          translateY(-13px);
      }
    }

    @keyframes cloudThree {

      from {
        transform:
          translateX(-15px);
      }

      to {
        transform:
          translateX(28px);
      }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .top {
        top: 18px;
        left: 18px;
        right: 18px;
      }

      .logo {
        font-size: 16px;
      }

      .content {
        width: 90%;
      }

      .symbol {
        width: 56px;
        height: 56px;

        margin-bottom: 20px;

        font-size: 21px;
      }

      h1 {
        font-size: 45px;
      }

      .intro {
        font-size: 10px;

        margin:
          17px auto
          27px;
      }

      .action {
        min-width: 145px;

        padding:
          12px 15px;
      }

      .orb {
        bottom: -140px;
      }
    }

    @media (max-width: 380px) {

      h1 {
        font-size: 40px;
      }

      .action {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <section class="page">

    <!-- ATMOSPHERE -->

    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>
    <div class="cloud cloud-three"></div>


    <!-- NAVIGATION -->

    <header class="top">

      <a
        href="homepage.html"
        class="logo"
      >
        AKSH
      </a>

      <a
        href="homepage.html"
        class="back"
      >
        ← How I'm Feeling
      </a>

    </header>


    <!-- EXPERIENCE -->

    <main class="content">

      <div class="symbol">
        ◌
      </div>


      <div class="eyebrow">
        You can put it down for a moment
      </div>


      <h1>
        You don't have to<br>
        <em>hold it all.</em>
      </h1>


      <p class="intro">
        When everything arrives at once, even small things
        can feel enormous. Let's slow the noise down,
        choose one thing, and take it from there.
      </p>


      <div class="actions">

        <a
          href="breathing.html"
          class="action primary"
        >
          Help me slow down
        </a>


        <a
          href="human-support.html"
          class="action secondary"
        >
          I want someone with me
        </a>

      </div>

    </main>


    <div class="orb"></div>


    <footer class="bottom">
      A SAFE SPACE FOR EVERY MIND
    </footer>

  </section>

</body>
</html>
