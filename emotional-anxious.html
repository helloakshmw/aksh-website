<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH — I Feel Anxious</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  color:#17324a;
  background:#eaf5fc;
  overflow-x:hidden;
}

.page{
  min-height:100svh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.95),transparent 27%),
    radial-gradient(circle at 85% 18%,rgba(135,196,232,.28),transparent 30%),
    linear-gradient(145deg,#eaf7ff,#d7ebf7 55%,#c5e0ef);
}

.page::before{
  content:"";
  position:absolute;
  width:55vw;
  height:20vw;
  left:-12vw;
  top:14%;
  border-radius:50%;
  background:rgba(255,255,255,.46);
  filter:blur(25px);
  animation:cloud 10s ease-in-out infinite alternate;
}

.page::after{
  content:"";
  position:absolute;
  width:42vw;
  height:16vw;
  right:-10vw;
  bottom:15%;
  border-radius:50%;
  background:rgba(105,174,214,.18);
  filter:blur(30px);
  animation:cloud 13s ease-in-out infinite alternate-reverse;
}

.top{
  position:absolute;
  top:25px;
  left:25px;
  right:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:5;
}

.logo{
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  letter-spacing:.18em;
}

.back{
  border:1px solid rgba(23,50,74,.13);
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(15px);
  padding:10px 15px;
  border-radius:100px;
  color:#17324a;
  font-size:10px;
  text-decoration:none;
}

.content{
  position:relative;
  z-index:3;
  width:min(720px,100%);
  text-align:center;
}

.eyebrow{
  font-size:8px;
  letter-spacing:.27em;
  text-transform:uppercase;
  color:#61839a;
  margin-bottom:18px;
}

h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:clamp(48px,8vw,78px);
  line-height:.95;
  letter-spacing:-.055em;
}

h1 em{
  color:#5b9bc4;
  font-style:italic;
}

.message{
  width:min(500px,100%);
  margin:25px auto 0;
  color:#607c8e;
  font-size:13px;
  line-height:1.75;
}

.breath{
  width:150px;
  height:150px;
  margin:38px auto 35px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.92) 0 22%,
      rgba(163,215,242,.52) 48%,
      rgba(107,174,214,.18) 70%,
      transparent 72%
    );
  box-shadow:
    0 0 70px rgba(87,166,212,.22);
  animation:breathe 6s ease-in-out infinite;
}

.breath span{
  font-family:Georgia,"Times New Roman",serif;
  font-size:13px;
  color:#4c7e9d;
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.button{
  padding:13px 20px;
  border-radius:100px;
  text-decoration:none;
  font-size:10px;
  font-weight:650;
  transition:.3s ease;
}

.primary{
  background:#17324a;
  color:white;
  box-shadow:0 14px 30px rgba(23,50,74,.16);
}

.secondary{
  color:#31566d;
  border:1px solid rgba(49,86,109,.18);
  background:rgba(255,255,255,.38);
}

.button:hover{
  transform:translateY(-3px);
}

.bottom{
  position:absolute;
  bottom:25px;
  left:25px;
  right:25px;
  display:flex;
  justify-content:center;
  z-index:5;
  color:#7892a2;
  font-size:8px;
  letter-spacing:.08em;
}

@keyframes breathe{
  0%,100%{
    transform:scale(.88);
    box-shadow:0 0 45px rgba(87,166,212,.16);
  }

  50%{
    transform:scale(1.08);
    box-shadow:0 0 90px rgba(87,166,212,.28);
  }
}

@keyframes cloud{
  from{
    transform:translateX(-15px) scale(1);
  }

  to{
    transform:translateX(35px) scale(1.08);
  }
}

@media(max-width:600px){

  .page{
    padding:35px 20px;
  }

  .top{
    top:18px;
    left:18px;
    right:18px;
  }

  .logo{
    font-size:18px;
  }

  h1{
    font-size:48px;
  }

  .message{
    font-size:12px;
  }

  .breath{
    width:125px;
    height:125px;
    margin:30px auto;
  }

  .actions{
    flex-direction:column;
    width:min(300px,100%);
    margin:auto;
  }

  .button{
    width:100%;
  }

}
</style>
</head>

<body>

<section class="page">

  <div class="top">

    <div class="logo">
      AKSH
    </div>

    <a href="homepage.html" class="back">
      ← Back to AKSH
    </a>

  </div>


  <main class="content">

    <div class="eyebrow">
      You are allowed to slow down
    </div>

    <h1>
      I feel<br>
      <em>anxious.</em>
    </h1>

    <p class="message">
      You don't have to solve everything right now.
      Let's create a little space between you
      and everything that feels too much.
    </p>


    <div class="breath">
      <span>
        Breathe
      </span>
    </div>


    <div class="actions">

      <a
        href="aksh-ai.html"
        class="button primary"
      >
        Talk to AKSH Intelligence
      </a>

      <a
        href="human-support.html"
        class="button secondary"
      >
        Talk to a human
      </a>

    </div>

  </main>


  <div class="bottom">
    A SAFE SPACE FOR EVERY MIND
  </div>

</section>

</body>
</html>
