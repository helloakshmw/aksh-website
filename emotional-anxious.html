<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AKSH — A Little More Calm</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      color: #31404a;

      background: #dce8ee;
    }

    .page {
      position: relative;

      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 18% 20%,
          rgba(255,255,255,.92),
          transparent 28%
        ),
        radial-gradient(
          circle at 82% 26%,
          rgba(170,201,218,.38),
          transparent 31%
        ),
        linear-gradient(
          145deg,
          #edf5f7 0%,
          #dce9ef 52%,
          #cbdde6 100%
        );
    }

    /* =====================================================
       ATMOSPHERE
    ===================================================== */

    .cloud {
      position: absolute;

      border-radius: 50%;

      filter: blur(35px);

      pointer-events: none;
    }

    .cloud-one {
      width: 55vw;
      height: 18vw;

      top: 20%;
      left: -15vw;

      background:
        rgba(255,255,255,.58);

      animation:
        cloud-one 15s ease-in-out infinite alternate;
    }

    .cloud-two {
      width: 45vw;
      height: 15vw;

      right: -13vw;
      bottom: 18%;

      background:
        rgba(157,190,208,.25);

      animation:
        cloud-two 18s ease-in-out infinite alternate;
    }

    .cloud-three {
      width: 28vw;
      height: 11vw;

      left: 42%;
      top: 5%;

      background:
        rgba(255,255,255,.4);

      animation:
        cloud-three 13s ease-in-out infinite alternate;
    }

    /* =====================================================
       NAV
    ===================================================== */

    .top {
      position: absolute;

      z-index: 10;

      top: 24px;
      left: 27px;
      right: 27px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 18px;

      letter-spacing: .2em;

      color: #344954;
    }

    .back {
      padding: 9px 14px;

      border:
        1px solid
        rgba(49,64,74,.12);

      border-radius: 999px;

      color: #526873;

      background:
        rgba(255,255,255,.38);

      backdrop-filter: blur(15px);

      font-size: 8px;

      text-decoration: none;

      transition: .25s ease;
    }

    .back:hover {
      background:
        rgba(255,255,255,.65);

      transform:
        translateY(-2px);
    }

    /* =====================================================
       CONTENT
    ===================================================== */

    .content {
      position: relative;

      z-index: 5;

      width: min(850px, 92%);

      text-align: center;

      transform:
        translateY(1vh);
    }

    .symbol {
      width: 64px;
      height: 64px;

      margin:
        0 auto
        25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #62859a;

      border:
        1px solid
        rgba(82,120,141,.15);

      background:
        rgba(255,255,255,.38);

      backdrop-filter:
        blur(15px);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 23px;

      box-shadow:
        0 18px 45px
        rgba(77,111,127,.09);

      animation:
        breathe 5s ease-in-out infinite;
    }

    .eyebrow {
      margin-bottom: 14px;

      color: #75909d;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: .3em;

      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          44px,
          6.5vw,
          70px
        );

      line-height: .98;

      font-weight: 400;

      letter-spacing: -.055em;

      color: #31404a;
    }

    h1 em {
      color: #668b9e;

      font-style: italic;
    }

    .intro {
      width: min(510px, 100%);

      margin:
        20px auto
        32px;

      color: #6f8088;

      font-size: 11px;

      line-height: 1.75;
    }

    /* =====================================================
       ACTIONS
    ===================================================== */

    .actions {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .action {
      min-width: 155px;

      padding: 13px 18px;

      border-radius: 999px;

      text-decoration: none;

      font-size: 8px;

      letter-spacing: .1em;

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .action:hover {
      transform:
        translateY(-3px);
    }

    .primary {
      color: white;

      background:
        #617f8c;

      box-shadow:
        0 12px 30px
        rgba(77,111,127,.16);
    }

    .secondary {
      color: #526c78;

      border:
        1px solid
        rgba(77,111,127,.14);

      background:
        rgba(255,255,255,.42);

      backdrop-filter:
        blur(15px);
    }

    /* =====================================================
       BREATHING ORB
    ===================================================== */

    .breathing {
      width: min(230px, 50vw);
      height: min(230px, 50vw);

      position: absolute;

      left: 50%;
      bottom: -150px;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,.5),
          rgba(158,190,207,.12) 55%,
          transparent 70%
        );

      filter: blur(3px);

      animation:
        breathing 7s ease-in-out infinite;

      pointer-events: none;
    }

    .bottom {
      position: absolute;

      z-index: 10;

      left: 25px;
      right: 25px;
      bottom: 20px;

      display: flex;

      justify-content: center;

      color: #8a9ca4;

      font-size: 7px;

      letter-spacing: .12em;
    }

    /* =====================================================
       ANIMATIONS
    ===================================================== */

    @keyframes breathe {

      0%,
      100% {
        transform:
          scale(.94);
      }

      50% {
        transform:
          scale(1.07);
      }
    }

    @keyframes breathing {

      0%,
      100% {
        transform:
          translateX(-50%)
          scale(.82);

        opacity: .45;
      }

      50% {
        transform:
          translateX(-50%)
          scale(1.18);

        opacity: .8;
      }
    }

    @keyframes cloud-one {

      from {
        transform:
          translateX(-20px)
          translateY(0);
      }

      to {
        transform:
          translateX(45px)
          translateY(-14px);
      }
    }

    @keyframes cloud-two {

      from {
        transform:
          translateX(20px);
      }

      to {
        transform:
          translateX(-35px)
          translateY(-12px);
      }
    }

    @keyframes cloud-three {

      from {
        transform:
          translateX(-15px);
      }

      to {
        transform:
          translateX(25px);
      }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .top {
        top: 18px;
        left: 18px;
        right: 18px;
      }

      .logo {
        font-size: 16px;
      }

      .content {
        width: 90%;
      }

      .symbol {
        width: 56px;
        height: 56px;

        margin-bottom: 20px;

        font-size: 20px;
      }

      h1 {
        font-size: 45px;
      }

      .intro {
        font-size: 10px;

        margin:
          17px auto
          27px;
      }

      .actions {
        gap: 8px;
      }

      .action {
        min-width: 145px;

        padding:
          12px
          15px;
      }

      .breathing {
        bottom: -130px;
      }
    }

    @media (max-width: 380px) {

      h1 {
        font-size: 40px;
      }

      .action {
        width: 100%;
      }
    }

  </style>
</head>

<body>

  <section class="page">

    <!-- ATMOSPHERE -->

    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>
    <div class="cloud cloud-three"></div>


    <!-- NAVIGATION -->

    <header class="top">

      <a
        href="homepage.html"
        class="logo"
      >
        AKSH
      </a>

      <a
        href="homepage.html"
        class="back"
      >
        ← How I'm Feeling
      </a>

    </header>


    <!-- MAIN EXPERIENCE -->

    <main class="content">

      <div class="symbol">
        ≋
      </div>


      <div class="eyebrow">
        Take one moment
      </div>


      <h1>
        It's okay to<br>
        <em>slow down.</em>
      </h1>


      <p class="intro">
        Anxiety can make everything feel urgent.
        Nothing needs to be solved in this exact moment.
        Let's make a little room to breathe first.
      </p>


      <div class="actions">

        <a
          href="breathing.html"
          class="action primary"
        >
          Take a quiet moment
        </a>


        <a
          href="human-support.html"
          class="action secondary"
        >
          Talk to someone
        </a>

      </div>

    </main>


    <!-- ATMOSPHERIC BREATHING ELEMENT -->

    <div class="breathing"></div>


    <footer class="bottom">
      A SAFE SPACE FOR EVERY MIND
    </footer>

  </section>

</body>
</html>
