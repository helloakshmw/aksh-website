<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#10151a">
<meta name="description" content="AKSH — A quiet space to put your thoughts into words.">
<title>AKSH — Text & Chat</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
  background:#10151a;
  -webkit-font-smoothing:antialiased;
}

.page{
  position:relative;
  width:100%;
  height:100svh;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
  position:absolute;
  inset:0;
  z-index:-10;

  background:
    radial-gradient(
      ellipse at 20% 20%,
      rgba(165,198,190,.28),
      transparent 34%
    ),
    radial-gradient(
      ellipse at 82% 72%,
      rgba(164,145,194,.22),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #18242a 0%,
      #26383b 48%,
      #171c27 100%
    );
}

.background::before{
  content:"";
  position:absolute;
  width:60vw;
  height:60vw;
  max-width:800px;
  max-height:800px;
  top:-30%;
  right:-18%;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.10),
      transparent 68%
    );

  filter:blur(10px);

  animation:glow 12s ease-in-out infinite alternate;
}

@keyframes glow{
  from{
    transform:scale(.94);
    opacity:.6;
  }

  to{
    transform:scale(1.08);
    opacity:1;
  }
}

.mist{
  position:absolute;
  width:80%;
  height:35%;
  left:-20%;
  bottom:-8%;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(210,225,221,.13),
      transparent 70%
    );

  filter:blur(22px);

  animation:mistMove 14s ease-in-out infinite alternate;
}

@keyframes mistMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(25%);
  }
}

.overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(8,11,15,.20),
      transparent 38%,
      rgba(7,10,14,.55) 100%
    );

  pointer-events:none;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:absolute;
  z-index:20;

  top:max(16px,env(safe-area-inset-top));
  left:max(18px,env(safe-area-inset-left));
  right:max(18px,env(safe-area-inset-right));

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand img{
  width:46px;
  height:46px;
  object-fit:contain;

  filter:drop-shadow(0 5px 18px rgba(0,0,0,.3));
}

.back{
  width:40px;
  height:40px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  text-decoration:none;

  border:1px solid rgba(255,255,255,.23);

  background:rgba(0,0,0,.14);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  transition:.25s ease;
}

.back:hover{
  transform:translateX(-3px);
}


/* =========================================================
   CHAT AREA
========================================================= */

.chat-shell{
  position:relative;
  z-index:10;

  width:min(920px,calc(100% - 28px));
  height:100%;

  margin:auto;

  display:flex;
  flex-direction:column;

  padding:
    74px 0
    max(15px,env(safe-area-inset-bottom));
}


/* HEADER */

.chat-header{
  text-align:center;

  padding:5px 0 15px;

  flex-shrink:0;
}

.eyebrow{
  font-size:8px;
  font-weight:800;
  letter-spacing:.28em;
  text-transform:uppercase;

  color:rgba(255,255,255,.57);
}

h1{
  margin-top:8px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:clamp(30px,4vw,48px);

  font-weight:400;

  letter-spacing:-.04em;
}

.subtitle{
  margin:7px auto 0;

  max-width:530px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:13px;

  line-height:1.45;

  color:rgba(255,255,255,.70);
}


/* =========================================================
   CHAT WINDOW
========================================================= */

.chat-window{
  flex:1;

  min-height:0;

  width:100%;

  margin-top:8px;

  border:1px solid rgba(255,255,255,.18);

  border-radius:27px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.045)
    );

  box-shadow:
    0 25px 80px rgba(0,0,0,.20);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  overflow:hidden;

  display:flex;
  flex-direction:column;
}


/* STATUS */

.chat-status{
  height:48px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  border-bottom:1px solid rgba(255,255,255,.10);

  background:rgba(255,255,255,.035);

  font-size:8px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;

  color:rgba(255,255,255,.55);
}

.status-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#b8dfc4;

  box-shadow:
    0 0 12px rgba(184,223,196,.8);
}


/* MESSAGES */

.messages{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:22px;

  display:flex;
  flex-direction:column;

  gap:15px;

  scrollbar-width:thin;
}

.message{
  max-width:min(72%,540px);

  padding:13px 16px;

  border-radius:18px;

  font-size:12px;

  line-height:1.5;

  animation:messageIn .35s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.aksh{
  align-self:flex-start;

  border-bottom-left-radius:5px;

  background:rgba(255,255,255,.10);

  border:1px solid rgba(255,255,255,.10);

  color:rgba(255,255,255,.86);
}

.message.user{
  align-self:flex-end;

  border-bottom-right-radius:5px;

  background:rgba(255,255,255,.91);

  color:#24252d;
}

.message .small{
  display:block;

  margin-bottom:5px;

  font-size:7px;

  font-weight:800;

  letter-spacing:.14em;

  text-transform:uppercase;

  opacity:.48;
}


/* =========================================================
   COMPOSER
========================================================= */

.composer{
  flex-shrink:0;

  padding:12px;

  border-top:1px solid rgba(255,255,255,.10);

  background:rgba(0,0,0,.08);

  display:flex;
  align-items:flex-end;

  gap:8px;
}

textarea{
  flex:1;

  min-width:0;

  max-height:110px;

  resize:none;

  border:1px solid rgba(255,255,255,.16);

  border-radius:18px;

  outline:none;

  padding:12px 14px;

  background:rgba(255,255,255,.08);

  color:#fff;

  font-family:inherit;

  font-size:12px;

  line-height:1.4;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

textarea::placeholder{
  color:rgba(255,255,255,.42);
}

textarea:focus{
  border-color:rgba(255,255,255,.35);
}

.send{
  width:43px;
  height:43px;

  flex-shrink:0;

  border:0;

  border-radius:50%;

  background:#fff;

  color:#24252d;

  cursor:pointer;

  font-size:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.25s ease;
}

.send:hover{
  transform:translateY(-2px) scale(1.03);
}

.send:active{
  transform:scale(.95);
}


/* =========================================================
   SUPPORT SWITCH
========================================================= */

.support-row{
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:10px 8px 0;

  font-size:7px;

  font-weight:700;

  letter-spacing:.13em;

  text-transform:uppercase;

  color:rgba(255,255,255,.48);

  text-align:center;
}

.support-row button{
  border:0;
  background:none;
  color:rgba(255,255,255,.85);

  font:inherit;

  letter-spacing:inherit;

  text-transform:inherit;

  cursor:pointer;

  text-decoration:underline;
  text-underline-offset:3px;
}


/* =========================================================
   SOUND
========================================================= */

.sound{
  position:absolute;
  z-index:30;

  left:max(18px,env(safe-area-inset-left));
  bottom:max(18px,env(safe-area-inset-bottom));

  width:40px;
  height:40px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.23);

  background:rgba(0,0,0,.14);

  color:#fff;

  cursor:pointer;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .topbar{
    top:max(12px,env(safe-area-inset-top));
    left:max(14px,env(safe-area-inset-left));
    right:max(14px,env(safe-area-inset-right));
  }

  .brand img{
    width:41px;
    height:41px;
  }

  .back{
    width:36px;
    height:36px;
  }

  .chat-shell{
    width:calc(100% - 20px);

    padding-top:63px;
  }

  .chat-header{
    padding-bottom:10px;
  }

  .eyebrow{
    font-size:6px;
  }

  h1{
    margin-top:5px;
    font-size:29px;
  }

  .subtitle{
    font-size:11px;
    max-width:320px;
  }

  .chat-window{
    border-radius:21px;
    margin-top:4px;
  }

  .chat-status{
    height:42px;
    font-size:7px;
  }

  .messages{
    padding:15px 12px;
    gap:10px;
  }

  .message{
    max-width:86%;
    padding:11px 13px;
    font-size:11px;
    border-radius:15px;
  }

  .message .small{
    font-size:6px;
  }

  .composer{
    padding:9px;
  }

  textarea{
    padding:10px 12px;
    font-size:11px;
    border-radius:15px;
  }

  .send{
    width:40px;
    height:40px;
  }

  .support-row{
    font-size:6px;
    padding-top:8px;
  }

  .sound{
    left:max(13px,env(safe-area-inset-left));
    bottom:max(13px,env(safe-area-inset-bottom));
    width:36px;
    height:36px;
  }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:370px){

  .subtitle{
    display:none;
  }

  .chat-header{
    padding-bottom:6px;
  }

  h1{
    font-size:26px;
  }

  .messages{
    padding:11px 9px;
  }

  .message{
    font-size:10px;
  }

  .support-row{
    display:none;
  }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media(
  orientation:landscape
) and (max-height:600px){

  .chat-shell{
    padding-top:53px;
  }

  .chat-header{
    padding-bottom:7px;
  }

  .eyebrow{
    display:none;
  }

  h1{
    font-size:28px;
  }

  .subtitle{
    margin-top:3px;
    font-size:10px;
  }

  .chat-window{
    margin-top:4px;
  }

  .chat-status{
    height:36px;
  }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>


<body>

<main class="page">


  <!-- BACKGROUND -->

  <div class="background">
    <div class="mist"></div>
  </div>

  <div class="overlay"></div>


  <!-- TOP BAR -->

  <header class="topbar">

    <a
      href="page3.html"
      class="brand"
      aria-label="AKSH"
    >

      <img
        src="aksh-icon.PNG"
        alt="AKSH"
      >

    </a>

    <a
      href="page3.html"
      class="back"
      aria-label="Back"
    >
      ←
    </a>

  </header>


  <!-- CHAT -->

  <section class="chat-shell">

    <header class="chat-header">

      <div class="eyebrow">
        Text / Chat
      </div>

      <h1>
        You can start anywhere.
      </h1>

      <p class="subtitle">
        There is no perfect way to say how you feel.
        Write whatever comes to mind.
      </p>

    </header>


    <div class="chat-window">


      <!-- STATUS -->

      <div class="chat-status">

        <span class="status-dot"></span>

        AKSH space is ready

      </div>


      <!-- MESSAGES -->

      <div
        class="messages"
        id="messages"
        aria-live="polite"
      >

        <div class="message aksh">

          <span class="small">
            AKSH
          </span>

          Hi. I'm here.

          You don't need to make your thoughts
          sound perfect. What would you like
          to talk about?

        </div>


      </div>


      <!-- COMPOSER -->

      <form
        class="composer"
        id="composer"
      >

        <textarea
          id="messageInput"
          rows="1"
          maxlength="1000"
          placeholder="Write what's on your mind…"
          aria-label="Your message"
        ></textarea>

        <button
          class="send"
          type="submit"
          aria-label="Send message"
        >
          ↑
        </button>

      </form>

    </div>


    <!-- SUPPORT SWITCH -->

    <div class="support-row">

      Prefer a person?

      <button
        type="button"
        id="humanSupport"
      >
        Explore human support
      </button>

    </div>

  </section>


  <!-- SOUND -->

  <button
    class="sound"
    id="sound"
    type="button"
    aria-label="Sound is off"
  >
    🔇
  </button>

</main>


<script>

/* =========================================================
   CHAT UI
   Front-end experience only.
   Real AI / human connection can be connected later.
========================================================= */

const composer =
  document.getElementById("composer");

const input =
  document.getElementById("messageInput");

const messages =
  document.getElementById("messages");


/* AUTO RESIZE */

input.addEventListener("input",function(){

  this.style.height="auto";

  this.style.height =
    Math.min(this.scrollHeight,110) + "px";

});


/* ADD MESSAGE */

function addMessage(text,type){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  if(type === "user"){

    message.textContent = text;

  }else{

    message.innerHTML =
      '<span class="small">AKSH</span>' +
      text;

  }

  messages.appendChild(message);

  messages.scrollTop =
    messages.scrollHeight;
}


/* DEMO RESPONSE */

function gentleResponse(){

  const responses = [

    "Thank you for putting that into words. You can take your time here.",

    "I hear you. You don't have to solve everything right now.",

    "That sounds like something worth giving yourself space to understand.",

    "You can keep going, or simply pause here for a moment. Both are okay."

  ];

  const response =
    responses[
      Math.floor(
        Math.random()*responses.length
      )
    ];

  setTimeout(()=>{

    addMessage(
      response,
      "aksh"
    );

  },650);

}


/* SEND */

composer.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    const text =
      input.value.trim();

    if(!text){
      return;
    }

    addMessage(
      text,
      "user"
    );

    input.value="";
    input.style.height="auto";

    gentleResponse();

  }
);


/* ENTER TO SEND
   SHIFT + ENTER = NEW LINE
*/

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      composer.requestSubmit();

    }

  }
);


/* =========================================================
   HUMAN SUPPORT
========================================================= */

document
  .getElementById("humanSupport")
  .addEventListener(
    "click",
    function(){

      window.location.href =
        "page3.html";

    }
  );


/* =========================================================
   SOUND BUTTON
========================================================= */

const sound =
  document.getElementById("sound");

let soundOn=false;

sound.addEventListener(
  "click",
  function(){

    soundOn=!soundOn;

    sound.textContent =
      soundOn ? "🔊" : "🔇";

    sound.setAttribute(
      "aria-label",
      soundOn
        ? "Sound is on"
        : "Sound is off"
    );

  }
);

</script>

</body>
</html>
