<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7ca9d8">
<title>AKSH — A Safe Space For Every Mind</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:#11131d;
}

/* =========================================================
   PAGE
========================================================= */

#aksh-page{
  position:relative;
  min-height:100svh;
  width:100%;
  overflow:hidden;
  isolation:isolate;
}

/* =========================================================
   TIME SKY
========================================================= */

.sky{
  position:absolute;
  inset:0;
  z-index:-10;
  overflow:hidden;
  transition:
    background 2.5s ease,
    filter 2.5s ease;
}

/* Morning */
.sky.morning{
  background:
    linear-gradient(
      180deg,
      #77aee2 0%,
      #a9d4f0 42%,
      #dcebf4 72%,
      #f4d9c4 100%
    );
}

/* Afternoon */
.sky.afternoon{
  background:
    linear-gradient(
      180deg,
      #7eb3dc 0%,
      #f1b36f 58%,
      #ed9863 78%,
      #df805d 100%
    );
}

/* Evening */
.sky.evening{
  background:
    linear-gradient(
      180deg,
      #5e608e 0%,
      #8b709b 35%,
      #c18ba4 65%,
      #e7a98f 100%
    );
}

/* Night */
.sky.night{
  background:
    radial-gradient(
      circle at 75% 18%,
      rgba(176,178,255,.24),
      transparent 18%
    ),
    linear-gradient(
      180deg,
      #080c25 0%,
      #11133a 45%,
      #24183f 72%,
      #3d2350 100%
    );
}

/* =========================================================
   SUN
========================================================= */

.sun{
  position:absolute;
  width:clamp(90px,13vw,170px);
  height:clamp(90px,13vw,170px);
  border-radius:50%;
  right:11%;
  top:13%;
  background:
    radial-gradient(
      circle,
      #fffbe2 0%,
      #ffe9a5 45%,
      rgba(255,213,119,.3) 68%,
      transparent 72%
    );
  filter:blur(.2px);
  opacity:.9;
  transition:opacity 2s ease;
}

.night .sun{
  opacity:0;
}

/* =========================================================
   MOON
========================================================= */

.moon{
  position:absolute;
  width:92px;
  height:92px;
  right:12%;
  top:12%;
  border-radius:50%;
  background:#fffde9;
  box-shadow:
    0 0 20px rgba(255,255,220,.75),
    0 0 60px rgba(194,205,255,.35),
    0 0 120px rgba(170,184,255,.18);
  opacity:0;
  transition:opacity 2s ease;
}

.moon:after{
  content:"";
  position:absolute;
  width:92px;
  height:92px;
  border-radius:50%;
  background:#11133a;
  left:-28px;
  top:-12px;
}

.night .moon{
  opacity:1;
}

/* =========================================================
   STARS
========================================================= */

.stars,
.shooting-stars{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.9);
  opacity:0;
  animation:twinkle 3s ease-in-out infinite;
}

.night .star{
  opacity:.8;
}

.star:nth-child(1){left:7%;top:14%;animation-delay:.4s}
.star:nth-child(2){left:18%;top:28%;animation-delay:1.4s}
.star:nth-child(3){left:29%;top:10%;animation-delay:2s}
.star:nth-child(4){left:42%;top:22%;animation-delay:.8s}
.star:nth-child(5){left:52%;top:11%;animation-delay:1.8s}
.star:nth-child(6){left:61%;top:31%;animation-delay:.2s}
.star:nth-child(7){left:72%;top:8%;animation-delay:2.5s}
.star:nth-child(8){left:84%;top:28%;animation-delay:1.1s}
.star:nth-child(9){left:91%;top:15%;animation-delay:2.1s}
.star:nth-child(10){left:12%;top:45%;animation-delay:1.7s}
.star:nth-child(11){left:38%;top:38%;animation-delay:.9s}
.star:nth-child(12){left:67%;top:43%;animation-delay:2.7s}

@keyframes twinkle{
  0%,100%{transform:scale(.5);opacity:.25}
  50%{transform:scale(1.5);opacity:1}
}

/* =========================================================
   SHOOTING STARS
========================================================= */

.shooting{
  position:absolute;
  width:120px;
  height:2px;
  background:linear-gradient(90deg,transparent,#fff);
  transform:rotate(-28deg);
  opacity:0;
}

.shooting.one{
  top:22%;
  left:55%;
}

.shooting.two{
  top:35%;
  left:78%;
  animation-delay:5s;
}

.night .shooting{
  animation:shoot 7s linear infinite;
}

@keyframes shoot{
  0%,72%{
    transform:translate(0,0) rotate(-28deg);
    opacity:0;
  }

  75%{
    opacity:1;
  }

  84%{
    transform:translate(-240px,130px) rotate(-28deg);
    opacity:0;
  }

  100%{
    opacity:0;
  }
}

/* =========================================================
   CLOUDS
========================================================= */

.cloud{
  position:absolute;
  width:270px;
  height:70px;
  border-radius:100px;
  background:rgba(255,255,255,.55);
  filter:blur(3px);
  opacity:.65;
  animation:cloudMove 65s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:inherit;
}

.cloud:before{
  width:100px;
  height:100px;
  left:38px;
  bottom:18px;
}

.cloud:after{
  width:130px;
  height:130px;
  right:34px;
  bottom:10px;
}

.cloud.one{
  top:19%;
  left:-300px;
}

.cloud.two{
  top:38%;
  left:-400px;
  transform:scale(.72);
  animation-duration:82s;
  animation-delay:-28s;
}

.cloud.three{
  top:57%;
  left:-350px;
  transform:scale(.55);
  animation-duration:95s;
  animation-delay:-50s;
}

@keyframes cloudMove{
  from{
    transform:translateX(0) scale(var(--scale,1));
  }

  to{
    transform:translateX(calc(100vw + 700px)) scale(var(--scale,1));
  }
}

.afternoon .cloud{
  background:rgba(255,238,217,.72);
}

.evening .cloud{
  background:rgba(224,211,235,.52);
}

.night .cloud{
  background:rgba(75,76,117,.6);
}

/* =========================================================
   RAIN
========================================================= */

.rain{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity 1.5s ease;
}

.evening .rain{
  opacity:.5;
}

.drop{
  position:absolute;
  top:-100px;
  width:1px;
  height:70px;
  background:linear-gradient(
    transparent,
    rgba(255,255,255,.75)
  );
  transform:rotate(12deg);
  animation:rainFall .8s linear infinite;
}

@keyframes rainFall{
  to{
    transform:translate(-100px,110vh) rotate(12deg);
  }
}

/* =========================================================
   RAINBOW
========================================================= */

.rainbow{
  position:absolute;
  width:min(700px,90vw);
  height:min(350px,45vw);
  left:50%;
  bottom:14%;
  transform:translateX(-50%);
  border-radius:700px 700px 0 0;
  border:22px solid rgba(255,70,70,.15);
  border-bottom:0;
  opacity:0;
  transition:opacity 2s ease;
  filter:blur(1px);
}

.evening .rainbow{
  opacity:.75;
  box-shadow:
    0 -20px 0 -1px rgba(255,180,80,.13),
    0 -42px 0 -1px rgba(255,240,90,.12),
    0 -64px 0 -1px rgba(90,220,150,.12),
    0 -86px 0 -1px rgba(80,190,255,.12),
    0 -108px 0 -1px rgba(120,120,255,.12),
    0 -130px 0 -1px rgba(210,100,255,.12);
}

/* =========================================================
   DARK OVERLAY
========================================================= */

.dark-overlay{
  position:absolute;
  inset:0;
  background:rgba(10,8,20,.16);
  transition:background 2s ease;
}

.night .dark-overlay{
  background:rgba(5,6,18,.2);
}

/* =========================================================
   CONTENT
========================================================= */

.content{
  position:relative;
  z-index:5;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

.topbar{
  width:100%;
  padding:
    max(22px,env(safe-area-inset-top))
    max(22px,env(safe-area-inset-right))
    0
    max(22px,env(safe-area-inset-left));
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:18px;
  font-weight:800;
  letter-spacing:.38em;
}

.time-info{
  text-align:right;
}

.day{
  font-size:10px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.date{
  font-size:9px;
  opacity:.72;
  margin-top:4px;
}

.hero-content{
  width:min(1000px,calc(100% - 44px));
  margin:auto auto 0;
  padding-bottom:
    max(46px,env(safe-area-inset-bottom));
}

.time-greeting{
  font-size:10px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-bottom:14px;
  opacity:.82;
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(48px,8vw,94px);
  line-height:.91;
  font-weight:400;
  max-width:850px;
  margin:0;
  letter-spacing:-.045em;
}

.subtitle{
  max-width:510px;
  margin-top:20px;
  font-size:13px;
  line-height:1.7;
  color:rgba(255,255,255,.88);
}

.checkin{
  margin-top:27px;
  display:inline-flex;
  align-items:center;
  gap:12px;
  padding:15px 21px;
  border:0;
  border-radius:999px;
  background:#fff;
  color:#43265d;
  font-weight:700;
  font-size:10px;
  box-shadow:0 12px 35px rgba(20,10,30,.2);
  transition:.25s;
}

.checkin:hover{
  transform:translateY(-3px);
}

.status{
  position:absolute;
  right:24px;
  bottom:24px;
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  opacity:.65;
}

/* =========================================================
   EMOTION PANEL
========================================================= */

.emotion-panel{
  position:relative;
  z-index:10;
  margin-top:40px;
  padding:0 22px 40px;
}

.panel-inner{
  width:min(1000px,100%);
  margin:auto;
}

.panel-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(28px,4vw,42px);
  font-weight:400;
  margin-bottom:18px;
}

.emotions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.emotion{
  min-height:145px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  background:rgba(20,15,29,.22);
  color:#fff;
  padding:18px;
  text-align:left;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  transition:.25s;
}

.emotion:hover,
.emotion:focus-visible{
  transform:translateY(-5px);
  background:rgba(255,255,255,.17);
  outline:none;
}

.emotion-icon{
  font-size:23px;
  margin-bottom:17px;
}

.emotion-name{
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
}

.emotion-desc{
  font-size:9px;
  line-height:1.45;
  opacity:.7;
  margin-top:6px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .topbar{
    padding-left:17px;
    padding-right:17px;
  }

  .logo{
    font-size:16px;
  }

  .hero-content{
    width:calc(100% - 34px);
    padding-bottom:32px;
  }

  h1{
    font-size:clamp(45px,13vw,66px);
  }

  .subtitle{
    font-size:12px;
  }

  .status{
    display:none;
  }

  .emotion-panel{
    padding-left:17px;
    padding-right:17px;
  }

  .emotions{
    grid-template-columns:repeat(2,1fr);
  }

  .emotion{
    min-height:125px;
    padding:15px;
  }

  .emotion-icon{
    margin-bottom:11px;
  }

  .emotion-name{
    font-size:17px;
  }
}

@media(max-width:380px){

  .emotions{
    gap:7px;
  }

  .emotion{
    padding:13px;
  }

  .emotion-name{
    font-size:15px;
  }

  .emotion-desc{
    font-size:8px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<div id="aksh-page">

  <!-- TIME-BASED SKY -->
  <div class="sky morning" id="sky">

    <div class="sun"></div>
    <div class="moon"></div>

    <div class="stars">
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
    </div>

    <div class="shooting-stars">
      <span class="shooting one"></span>
      <span class="shooting two"></span>
    </div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>

    <div class="rain" id="rain"></div>

    <div class="rainbow"></div>

    <div class="dark-overlay"></div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="topbar">

      <div class="nav">

        <div class="logo">
          AKSH
        </div>

        <div class="time-info">
          <div class="day" id="day"></div>
          <div class="date" id="date"></div>
        </div>

      </div>

    </div>

    <main class="hero-content">

      <div class="time-greeting" id="greeting">
        GOOD MORNING
      </div>

      <h1 id="headline">
        A softer place<br>
        to land.
      </h1>

      <p class="subtitle">
        Whatever today feels like, there is room for you here.
        Pause. Breathe. Check in with yourself.
      </p>

      <button
        class="checkin"
        onclick="document.getElementById('emotion-panel').scrollIntoView({behavior:'smooth'})"
      >
        How are you feeling?
        <span>↓</span>
      </button>

    </main>

    <section class="emotion-panel" id="emotion-panel">

      <div class="panel-inner">

        <div class="panel-title">
          How are you feeling today?
        </div>

        <div class="emotions">

          <button
            class="emotion"
            onclick="selectEmotion('Anxious','Take a slow breath. You do not have to solve everything at once.')"
          >
            <div class="emotion-icon">◌</div>
            <div class="emotion-name">Anxious</div>
            <div class="emotion-desc">
              When your thoughts feel louder than everything else.
            </div>
          </button>

          <button
            class="emotion"
            onclick="selectEmotion('Overwhelmed','You are allowed to pause. You do not have to carry everything at the same time.')"
          >
            <div class="emotion-icon">⌁</div>
            <div class="emotion-name">Overwhelmed</div>
            <div class="emotion-desc">
              When everything feels like too much at once.
            </div>
          </button>

          <button
            class="emotion"
            onclick="selectEmotion('Need Someone To Talk','You do not need perfect words. Sometimes being heard is the first step.')"
          >
            <div class="emotion-icon">♡</div>
            <div class="emotion-name">
              Need someone to talk
            </div>
            <div class="emotion-desc">
              When you simply want another person to listen.
            </div>
          </button>

          <button
            class="emotion"
            onclick="selectEmotion('Just Exploring','You do not have to be struggling to belong here. Curiosity is a beautiful reason to begin.')"
          >
            <div class="emotion-icon">✦</div>
            <div class="emotion-name">
              Just exploring
            </div>
            <div class="emotion-desc">
              When you are curious about yourself and wellbeing.
            </div>
          </button>

        </div>

      </div>

    </section>

  </div>

</div>

<script>

/* =========================================================
   TIME SYSTEM
========================================================= */

const sky = document.getElementById("sky");
const greeting = document.getElementById("greeting");
const headline = document.getElementById("headline");
const day = document.getElementById("day");
const date = document.getElementById("date");

function updateTimeEnvironment(){

  const now = new Date();
  const hour = now.getHours();
  const minute = now.getMinutes();

  sky.classList.remove(
    "morning",
    "afternoon",
    "evening",
    "night"
  );

  /*
    MORNING
    05:00 - 11:59
  */

  if(hour >= 5 && hour < 12){

    sky.classList.add("morning");

    greeting.textContent = "GOOD MORNING";

    headline.innerHTML =
      "A softer place<br>to start.";

  }

  /*
    AFTERNOON
    12:00 - 16:59
  */

  else if(hour >= 12 && hour < 17){

    sky.classList.add("afternoon");

    greeting.textContent = "GOOD AFTERNOON";

    headline.innerHTML =
      "Take a moment<br>for yourself.";

  }

  /*
    EVENING
    17:00 - 19:29
  */

  else if(
    hour === 17 ||
    hour === 18 ||
    (hour === 19 && minute < 30)
  ){

    sky.classList.add("evening");

    greeting.textContent = "GOOD EVENING";

    headline.innerHTML =
      "Let the day<br>slow down.";

  }

  /*
    NIGHT
    19:30 onward
  */

  else{

    sky.classList.add("night");

    greeting.textContent = "GOOD NIGHT";

    headline.innerHTML =
      "It's okay to<br>slow down.";

  }

  day.textContent =
    now.toLocaleDateString(
      undefined,
      {weekday:"long"}
    ).toUpperCase();

  date.textContent =
    now.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

}

/* =========================================================
   RAIN GENERATOR
========================================================= */

const rain = document.getElementById("rain");

for(let i = 0; i < 100; i++){

  const drop = document.createElement("span");

  drop.className = "drop";

  drop.style.left =
    Math.random() * 110 + "%";

  drop.style.animationDelay =
    Math.random() * 1.5 + "s";

  drop.style.animationDuration =
    (0.5 + Math.random() * 0.7) + "s";

  drop.style.height =
    (35 + Math.random() * 60) + "px";

  rain.appendChild(drop);

}

/* =========================================================
   EMOTION INTERACTION
========================================================= */

function selectEmotion(title,text){

  alert(
    title +
    "\\n\\n" +
    text
  );

}

/* =========================================================
   START
========================================================= */

updateTimeEnvironment();

/*
  Check the time every minute so the
  background changes automatically.
*/

setInterval(
  updateTimeEnvironment,
  60000
);

</script>

</body>
</html>
