<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <meta name="description" content="AKSH — A Safe Space For Every Mind.">
  <title>AKSH — A Safe Space For Every Mind</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11110f;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .entry {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background: #11110f;
    }

    .video-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -4;
      opacity: 0;
      transition: opacity 1.4s ease;
      background: #11110f;
    }

    .video-background.visible {
      opacity: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.42) 0%,
          rgba(0, 0, 0, 0.10) 35%,
          rgba(0, 0, 0, 0.18) 60%,
          rgba(0, 0, 0, 0.58) 100%
        );
    }

    .soft-vignette {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(
          circle at center,
          transparent 25%,
          rgba(0, 0, 0, 0.12) 60%,
          rgba(0, 0, 0, 0.42) 100%
        );
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding:
        max(22px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        0
        max(22px, env(safe-area-inset-left));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 5;
    }

    .date {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1.6;
      opacity: 0.88;
      max-width: 160px;
    }

    .top-control {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.14);
      color: white;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .top-control:active {
      transform: scale(0.94);
    }

    .brand {
      position: absolute;
      top: max(21px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 4;
      pointer-events: none;
    }

    .brand-watermark {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(52px, 15vw, 120px);
      font-weight: 800;
      letter-spacing: 0.12em;
      white-space: nowrap;
      opacity: 0.09;
    }

    .brand-mark {
      position: relative;
      margin-top: 6px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.52em;
      padding-left: 0.52em;
    }

    .brand-tagline {
      position: relative;
      margin-top: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.88;
    }

    .center-content {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .greeting {
      font-size: clamp(42px, 12vw, 88px);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: -0.035em;
      text-shadow: 0 3px 25px rgba(0, 0, 0, 0.25);
      animation: rise 1.4s ease both;
    }

    .quote {
      max-width: 560px;
      margin-top: 25px;
      font-size: clamp(15px, 4vw, 21px);
      line-height: 1.65;
      font-weight: 400;
      letter-spacing: 0.01em;
      opacity: 0.94;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.4);
      animation: rise 1.4s 0.15s ease both;
    }

    .bottom-area {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: max(28px, env(safe-area-inset-bottom));
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .begin-button {
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      padding: 15px 28px;
      min-width: 190px;
      color: #fff;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition:
        background 0.35s ease,
        transform 0.35s ease,
        border-color 0.35s ease;
    }

    .begin-button:active {
      transform: scale(0.96);
    }

    .skip-button {
      margin-top: 15px;
      border: 0;
      background: transparent;
      color: white;
      opacity: 0.72;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 8px 14px;
    }

    .skip-button:active {
      opacity: 1;
    }

    .fade-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #11110f;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }

    .fade-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .message {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 30;
      width: min(88%, 420px);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .message.show {
      opacity: 1;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 700px) {
      .top-bar {
        padding-left: 42px;
        padding-right: 42px;
      }

      .center-content {
        left: 40px;
        right: 40px;
      }

      .bottom-area {
        bottom: 42px;
      }

      .begin-button:hover {
        background: rgba(255, 255, 255, 0.20);
        border-color: rgba(255, 255, 255, 0.9);
        transform: translateY(-2px);
      }

      .skip-button:hover {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="entry" id="entry">

    <video
      class="video-background"
      id="backgroundVideo"
      autoplay
      muted
      playsinline
      preload="auto"
    ></video>

    <div class="overlay"></div>
    <div class="soft-vignette"></div>

    <header class="top-bar">
      <div class="date" id="dateDisplay"></div>

      <button
        class="top-control"
        id="soundButton"
        type="button"
        aria-label="Sound is muted"
      >
        ♪
      </button>
    </header>

    <div class="brand">
      <div class="brand-watermark">AKSH</div>
      <div class="brand-mark">AKSH</div>
      <div class="brand-tagline">A Safe Space For Every Mind</div>
    </div>

    <section class="center-content">
      <h1 class="greeting" id="greeting"></h1>

      <p class="quote" id="quote"></p>
    </section>

    <div class="bottom-area">
      <button class="begin-button" id="beginButton" type="button">
        Begin Your Journey
      </button>

      <button class="skip-button" id="skipButton" type="button">
        Skip
      </button>
    </div>

  </main>

  <div class="fade-screen" id="fadeScreen"></div>

  <div class="message" id="message"></div>

  <script>
    /*
      AKSH — STAGE 0
      Time-based cinematic entry experience.

      Video files already uploaded to the GitHub repository:
      Morning:
        aksh-morning.1.mov
        aksh-morning.2.mov
        aksh-morning.3.mov
        aksh-morning.4.mov

      Afternoon:
        aksh-afternoon.1.mov
        aksh-afternoon.2.mov
        aksh-afternoon.3.mov
        aksh-afternoon.4.mov

      Evening:
        aksh-evening.1.mov
        aksh-evening.2.mov
        aksh-evening.3.mov

      Night:
        aksh-night.1.mov
        aksh-night.2.mov
    */

    const video = document.getElementById("backgroundVideo");
    const greetingElement = document.getElementById("greeting");
    const quoteElement = document.getElementById("quote");
    const dateElement = document.getElementById("dateDisplay");
    const soundButton = document.getElementById("soundButton");
    const beginButton = document.getElementById("beginButton");
    const skipButton = document.getElementById("skipButton");
    const fadeScreen = document.getElementById("fadeScreen");
    const messageElement = document.getElementById("message");

    const videos = {
      morning1: "aksh-morning.1.mov",
      morning2: "aksh-morning.2.mov",
      morning3: "aksh-morning.3.mov",
      morning4: "aksh-morning.4.mov",

      afternoon1: "aksh-afternoon.1.mov",
      afternoon2: "aksh-afternoon.2.mov",
      afternoon3: "aksh-afternoon.3.mov",
      afternoon4: "aksh-afternoon.4.mov",

      evening1: "aksh-evening.1.mov",
      evening2: "aksh-evening.2.mov",
      evening3: "aksh-evening.3.mov",

      night1: "aksh-night.1.mov",
      night2: "aksh-night.2.mov"
    };

    const quotes = {
      morning: [
        "You don't have to rush into the day. Take a breath. Begin gently.",
        "There is nowhere you need to be before you are ready.",
        "Let the morning arrive softly. You can do the same.",
        "A new day does not ask you to have everything figured out."
      ],

      afternoon: [
        "Pause for a moment. You are allowed to breathe between everything you do.",
        "Not every moment needs to be productive. Some moments are simply yours.",
        "Let yourself slow down. There is still beauty in the middle of the day.",
        "Whatever today has brought you, you don't have to carry it alone."
      ],

      evening: [
        "The day can become quiet now. You can let yourself breathe.",
        "Some journeys are meant to be taken slowly.",
        "It is okay to leave some things unfinished until tomorrow.",
        "For a little while, let the world become still."
      ],

      night: [
        "The world is quiet now. You can be quiet too.",
        "You have made it through another day. That is enough for tonight.",
        "Rest is not something you have to earn.",
        "Whatever is on your mind, you don't have to solve everything tonight."
      ]
    };

    function getCurrentTime() {
      const now = new Date();

      return {
        hour: now.getHours(),
        minutes: now.getMinutes(),
        totalMinutes: now.getHours() * 60 + now.getMinutes()
      };
    }

    function getExperience() {
      const { totalMinutes } = getCurrentTime();

      /*
        Morning:
        05:00–06:00
        06:00–08:00
        08:00–10:00
        10:00–11:59

        Afternoon:
        12:00–13:00
        13:00–14:30
        14:30–16:00
        16:00–16:59

        Evening:
        17:00–17:45
        17:45–19:00
        19:00–19:59

        Night:
        20:00–23:59
        00:00–04:59
      */

      if (totalMinutes >= 300 && totalMinutes < 360) {
        return {
          greeting: "Good Morning",
          quoteGroup: "morning",
          video: videos.morning1
        };
      }

      if (totalMinutes >= 360 && totalMinutes < 480) {
        return {
          greeting: "Good Morning",
          quoteGroup: "morning",
          video: videos.morning2
        };
      }

      if (totalMinutes >= 480 && totalMinutes < 600) {
        return {
          greeting: "Good Morning",
          quoteGroup: "morning",
          video: videos.morning3
        };
      }

      if (totalMinutes >= 600 && totalMinutes < 720) {
        return {
          greeting: "Good Morning",
          quoteGroup: "morning",
          video: videos.morning4
        };
      }

      if (totalMinutes >= 720 && totalMinutes < 780) {
        return {
          greeting: "Good Afternoon",
          quoteGroup: "afternoon",
          video: videos.afternoon1
        };
      }

      if (totalMinutes >= 780 && totalMinutes < 870) {
        return {
          greeting: "Good Afternoon",
          quoteGroup: "afternoon",
          video: videos.afternoon2
        };
      }

      if (totalMinutes >= 870 && totalMinutes < 960) {
        return {
          greeting: "Good Afternoon",
          quoteGroup: "afternoon",
          video: videos.afternoon3
        };
      }

      if (totalMinutes >= 960 && totalMinutes < 1020) {
        return {
          greeting: "Good Afternoon",
          quoteGroup: "afternoon",
          video: videos.afternoon4
        };
      }

      if (totalMinutes >= 1020 && totalMinutes < 1065) {
        return {
          greeting: "Good Evening",
          quoteGroup: "evening",
          video: videos.evening1
        };
      }

      if (totalMinutes >= 1065 && totalMinutes < 1140) {
        return {
          greeting: "Good Evening",
          quoteGroup: "evening",
          video: videos.evening2
        };
      }

      if (totalMinutes >= 1140 && totalMinutes < 1200) {
        return {
          greeting: "Good Evening",
          quoteGroup: "evening",
          video: videos.morning4
        };
      }

      if (totalMinutes >= 1200) {
        return {
          greeting: "Good Night",
          quoteGroup: "night",
          video: videos.night1
        };
      }

      return {
        greeting: "Good Night",
        quoteGroup: "night",
        video: videos.night2
      };
    }

    function updateDate() {
      const now = new Date();

      const formatted = new Intl.DateTimeFormat(
        undefined,
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      ).format(now);

      dateElement.textContent = formatted;
    }

    function chooseQuote(group) {
      const options = quotes[group];
      const index = Math.floor(Math.random() * options.length);
      return options[index];
    }

    function showMessage(text) {
      messageElement.textContent = text;
      messageElement.classList.add("show");

      setTimeout(() => {
        messageElement.classList.remove("show");
      }, 3000);
    }

    function loadExperience() {
      const experience = getExperience();

      greetingElement.textContent = experience.greeting;
      quoteElement.textContent = chooseQuote(experience.quoteGroup);

      video.classList.remove("visible");

      video.src = experience.video;
      video.load();

      video.addEventListener(
        "canplay",
        () => {
          video.classList.add("visible");

          const playPromise = video.play();

          if (playPromise !== undefined) {
            playPromise.catch(() => {
              showMessage("Tap the sound button if you would like audio.");
            });
          }
        },
        { once: true }
      );
    }

    function enterWebsite() {
      fadeScreen.classList.add("active");

      /*
        Stage 1 will eventually be connected here.
        For now, the transition prepares the entry point
        without inventing a homepage that we have not built yet.
      */

      setTimeout(() => {
        fadeScreen.classList.remove("active");

        showMessage("AKSH is preparing your space.");

      }, 900);
    }

    function toggleSound() {
      if (video.muted) {
        video.muted = false;
        soundButton.textContent = "♫";
        soundButton.setAttribute("aria-label", "Sound is on");

        video.play().catch(() => {
          video.muted = true;
          soundButton.textContent = "♪";
          showMessage("Sound could not be enabled.");
        });
      } else {
        video.muted = true;
        soundButton.textContent = "♪";
        soundButton.setAttribute("aria-label", "Sound is muted");
      }
    }

    soundButton.addEventListener("click", toggleSound);

    beginButton.addEventListener("click", enterWebsite);

    skipButton.addEventListener("click", enterWebsite);

    video.addEventListener("error", () => {
      video.classList.remove("visible");

      showMessage("Your experience is still here. Please continue.");

      setTimeout(() => {
        video.classList.add("visible");
      }, 500);
    });

    updateDate();
    loadExperience();

    /*
      Keep the date and experience accurate if the page remains
      open across a time boundary.
    */
    setInterval(() => {
      updateDate();

      const currentExperience = getExperience();
      const currentVideoName = video.src.split("/").pop();

      if (currentVideoName !== currentExperience.video) {
        loadExperience();
      }
    }, 30000);
  </script>

</body>
</html>
