<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#11110f"
  >

  <meta
    name="description"
    content="AKSH — A Safe Space For Every Mind."
  >

  <title>AKSH — A Safe Space For Every Mind</title>


  <style>

    /* =====================================================
       AKSH — 0TH PAGE
       PREMIUM ENTRY EXPERIENCE
    ===================================================== */

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --side-space: clamp(20px, 4vw, 60px);
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #11110f;
    }


    body {
      color: #ffffff;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================
       MAIN EXPERIENCE
    ===================================================== */

    .entry {
      position: relative;

      width: 100%;
      height: 100dvh;
      min-height: 100svh;

      overflow: hidden;

      isolation: isolate;

      background: #11110f;
    }


    /* =====================================================
       BACKGROUND VIDEO
    ===================================================== */

    .video-background {
      position: absolute;

      inset: 0;

      z-index: -5;

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center center;

      background: #11110f;

      opacity: 0;

      transform: scale(1.015);

      transition:
        opacity 1.25s ease,
        transform 8s ease;
    }


    .video-background.visible {
      opacity: 1;
      transform: scale(1);
    }


    /* =====================================================
       CINEMATIC OVERLAYS
    ===================================================== */

    .dark-overlay {
      position: absolute;

      inset: 0;

      z-index: -4;

      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.46) 0%,
          rgba(0, 0, 0, 0.10) 32%,
          rgba(0, 0, 0, 0.08) 56%,
          rgba(0, 0, 0, 0.52) 100%
        );
    }


    .cinematic-overlay {
      position: absolute;

      inset: 0;

      z-index: -3;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 20%,
          rgba(0, 0, 0, 0.08) 62%,
          rgba(0, 0, 0, 0.38) 100%
        );
    }


    /* =====================================================
       TOP BAR
    ===================================================== */

    .top-bar {
      position: absolute;

      z-index: 5;

      top: 0;
      left: 0;
      right: 0;

      padding-top:
        calc(
          var(--safe-top) +
          clamp(20px, 4vw, 36px)
        );

      padding-left: var(--side-space);
      padding-right: var(--side-space);

      display: grid;

      grid-template-columns:
        1fr
        auto
        1fr;

      align-items: start;
    }


    /* =====================================================
       DATE + DAY
    ===================================================== */

    .date-block {
      grid-column: 1;

      justify-self: start;

      display: flex;

      flex-direction: column;

      align-items: flex-start;

      gap: 3px;

      color: rgba(255, 255, 255, 0.94);

      text-shadow:
        0 2px 15px rgba(0, 0, 0, 0.48);
    }


    .day {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(
          10px,
          1.8vw,
          13px
        );

      line-height: 1.3;

      font-weight: 500;

      letter-spacing:
        0.16em;

      text-transform:
        uppercase;
    }


    .date {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(
          8px,
          1.5vw,
          11px
        );

      line-height: 1.4;

      font-weight: 400;

      letter-spacing:
        0.08em;

      opacity: 0.84;
    }


    /* =====================================================
       SOUND BUTTON
    ===================================================== */

    .sound-button {
      grid-column: 3;

      justify-self: end;

      width:
        clamp(
          40px,
          7vw,
          50px
        );

      height:
        clamp(
          40px,
          7vw,
          50px
        );

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255, 255, 255, 0.42);

      border-radius: 50%;

      color: #ffffff;

      background:
        rgba(0, 0, 0, 0.14);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(
          15px,
          3vw,
          19px
        );

      cursor: pointer;

      transition:
        background 0.3s ease,
        transform 0.25s ease;
    }


    .sound-button:active {
      transform: scale(0.94);
    }


    /* =====================================================
       AKSH ICON
    ===================================================== */

    .brand {
      position: absolute;

      z-index: 6;

      top:
        calc(
          var(--safe-top) +
          clamp(18px, 3vw, 32px)
        );

      left: 50%;

      transform:
        translateX(-50%);

      display: flex;

      flex-direction: column;

      align-items: center;

      text-align: center;

      pointer-events: none;
    }


    .aksh-icon {
      display: block;

      width:
        clamp(
          52px,
          10vw,
          92px
        );

      height:
        clamp(
          52px,
          10vw,
          92px
        );

      object-fit: contain;

      object-position: center;

      filter:
        drop-shadow(
          0 4px 18px
          rgba(0, 0, 0, 0.28)
        );
    }


    .brand-tagline {
      margin-top:
        clamp(
          7px,
          1.5vw,
          11px
        );

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(
          7px,
          1.4vw,
          10px
        );

      line-height: 1.4;

      letter-spacing:
        clamp(
          0.12em,
          0.45vw,
          0.19em
        );

      text-transform:
        uppercase;

      white-space:
        nowrap;

      color:
        rgba(255, 255, 255, 0.90);

      text-shadow:
        0 2px 13px
        rgba(0, 0, 0, 0.42);
    }


    /* =====================================================
       CENTER CONTENT
    ===================================================== */

    .center-content {
      position: absolute;

      z-index: 3;

      top: 50%;

      left: var(--side-space);
      right: var(--side-space);

      transform:
        translateY(-50%);

      display: flex;

      flex-direction: column;

      align-items: center;

      text-align: center;
    }


    .greeting {
      max-width: 100%;

      font-size:
        clamp(
          43px,
          10.5vw,
          100px
        );

      line-height: 0.98;

      font-weight: 400;

      letter-spacing:
        -0.045em;

      text-wrap: balance;

      color: #ffffff;

      text-shadow:
        0 4px 30px
        rgba(0, 0, 0, 0.34);

      animation:
        textIn
        1.15s
        ease
        both;
    }


    .quote {
      width:
        min(
          100%,
          650px
        );

      margin-top:
        clamp(
          18px,
          3vw,
          30px
        );

      font-size:
        clamp(
          15px,
          2.4vw,
          22px
        );

      line-height:
        1.55;

      font-weight: 400;

      letter-spacing:
        0.005em;

      text-wrap: balance;

      color:
        rgba(255, 255, 255, 0.95);

      text-shadow:
        0 3px 20px
        rgba(0, 0, 0, 0.48);

      animation:
        textIn
        1.15s
        0.12s
        ease
        both;
    }


    /* =====================================================
       BOTTOM
    ===================================================== */

    .bottom-area {
      position: absolute;

      z-index: 5;

      left: var(--side-space);
      right: var(--side-space);

      bottom: 0;

      padding-bottom:
        calc(
          var(--safe-bottom) +
          clamp(24px, 5vh, 48px)
        );

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    .begin-button {
      width:
        min(
          82vw,
          260px
        );

      min-height: 52px;

      padding:
        15px 24px;

      border:
        1px solid
        rgba(255, 255, 255, 0.72);

      border-radius: 999px;

      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.11);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(
          9px,
          1.8vw,
          12px
        );

      line-height: 1;

      font-weight: 400;

      letter-spacing:
        0.17em;

      text-transform:
        uppercase;

      cursor: pointer;

      box-shadow:
        0 8px 35px
        rgba(0, 0, 0, 0.16);

      transition:
        background 0.3s ease,
        transform 0.3s ease,
        border-color 0.3s ease;
    }


    .begin-button:active {
      transform: scale(0.96);
    }


    .skip-button {
      margin-top: 10px;

      border: 0;

      padding:
        8px 16px;

      color:
        rgba(255, 255, 255, 0.78);

      background:
        transparent;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(
          8px,
          1.6vw,
          10px
        );

      line-height: 1;

      letter-spacing:
        0.16em;

      text-transform:
        uppercase;

      cursor: pointer;
    }


    .skip-button:active {
      color: #ffffff;
    }


    /* =====================================================
       TRANSITION
    ===================================================== */

    .fade-screen {
      position: fixed;

      inset: 0;

      z-index: 20;

      background: #11110f;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.9s ease;
    }


    .fade-screen.active {
      opacity: 1;

      pointer-events: auto;
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {
      position: fixed;

      z-index: 30;

      left: 50%;

      bottom:
        calc(
          var(--safe-bottom) +
          18px
        );

      width:
        min(
          88vw,
          430px
        );

      transform:
        translateX(-50%);

      padding:
        12px 18px;

      border-radius: 999px;

      color: #ffffff;

      background:
        rgba(0, 0, 0, 0.52);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 10px;

      line-height: 1.4;

      letter-spacing:
        0.07em;

      text-align: center;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.35s ease;
    }


    .message.show {
      opacity: 1;
    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    @keyframes textIn {

      from {
        opacity: 0;

        transform:
          translateY(18px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =====================================================
       SMALL PHONES
    ===================================================== */

    @media
      (max-height: 680px)
      and (orientation: portrait) {

      .top-bar {
        padding-top:
          calc(
            var(--safe-top) +
            13px
          );
      }


      .brand {
        top:
          calc(
            var(--safe-top) +
            13px
          );
      }


      .aksh-icon {
        width: 52px;
        height: 52px;
      }


      .brand-tagline {
        margin-top: 5px;
      }


      .center-content {
        top: 53%;
      }


      .greeting {
        font-size:
          clamp(
            35px,
            10vw,
            60px
          );
      }


      .quote {
        margin-top: 14px;

        font-size: 13px;

        line-height: 1.45;
      }


      .bottom-area {
        padding-bottom:
          calc(
            var(--safe-bottom) +
            13px
          );
      }


      .begin-button {
        min-height: 46px;

        padding:
          12px 20px;
      }


      .skip-button {
        margin-top: 5px;
      }

    }


    /* =====================================================
       LANDSCAPE PHONES
    ===================================================== */

    @media
      (orientation: landscape)
      and (max-height: 600px) {

      .top-bar {
        padding-top:
          calc(
            var(--safe-top) +
            10px
          );
      }


      .brand {
        top:
          calc(
            var(--safe-top) +
            10px
          );
      }


      .aksh-icon {
        width: 44px;
        height: 44px;
      }


      .brand-tagline {
        margin-top: 3px;

        font-size: 6px;
      }


      .center-content {
        top: 55%;
      }


      .greeting {
        font-size:
          clamp(
            34px,
            8vw,
            68px
          );
      }


      .quote {
        width:
          min(
            75vw,
            600px
          );

        margin-top: 12px;

        font-size: 13px;

        line-height: 1.35;
      }


      .bottom-area {
        padding-bottom:
          calc(
            var(--safe-bottom) +
            8px
          );
      }


      .begin-button {
        min-height: 42px;

        padding:
          11px 22px;
      }


      .skip-button {
        margin-top: 4px;
      }

    }


    /* =====================================================
       TABLETS
    ===================================================== */

    @media
      (min-width: 600px)
      and (max-width: 1024px) {

      .center-content {
        left: 7vw;
        right: 7vw;
      }


      .greeting {
        font-size:
          clamp(
            62px,
            10vw,
            90px
          );
      }


      .quote {
        font-size: 19px;

        max-width: 620px;
      }

    }


    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 1025px) {

      .sound-button:hover {
        background:
          rgba(255, 255, 255, 0.18);
      }


      .begin-button:hover {
        background:
          rgba(255, 255, 255, 0.21);

        border-color:
          rgba(255, 255, 255, 0.95);

        transform:
          translateY(-2px);
      }


      .skip-button:hover {
        color: #ffffff;
      }

    }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }


      .video-background {
        transition: none;

        transform: none;
      }

    }

  </style>

</head>


<body>


  <!-- ===================================================
       AKSH 0TH PAGE
  ==================================================== -->

  <main class="entry">


    <!-- Background video -->

    <video
      id="backgroundVideo"
      class="video-background"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>


    <!-- Cinematic layers -->

    <div class="dark-overlay"></div>

    <div class="cinematic-overlay"></div>


    <!-- =================================================
         TOP BAR
    ================================================== -->

    <header class="top-bar">


      <!-- Date + Day -->

      <div class="date-block">

        <div
          id="dayDisplay"
          class="day"
        ></div>

        <div
          id="dateDisplay"
          class="date"
        ></div>

      </div>


      <!-- Sound -->

      <button
        id="soundButton"
        class="sound-button"
        type="button"
        aria-label="Turn sound on"
      >
        ♪
      </button>


    </header>


    <!-- =================================================
         AKSH ICON
    ================================================== -->

    <div class="brand">


      <img
        src="aksh-icon.PNG"
        class="aksh-icon"
        alt="AKSH"
      >


      <div class="brand-tagline">
        A Safe Space For Every Mind
      </div>


    </div>


    <!-- =================================================
         CENTER
    ================================================== -->

    <section class="center-content">


      <h1
        id="greeting"
        class="greeting"
      ></h1>


      <p
        id="quote"
        class="quote"
      ></p>


    </section>


    <!-- =================================================
         BOTTOM
    ================================================== -->

    <div class="bottom-area">


      <button
        id="beginButton"
        class="begin-button"
        type="button"
      >
        Begin Your Journey
      </button>


      <button
        id="skipButton"
        class="skip-button"
        type="button"
      >
        Skip
      </button>


    </div>


  </main>


  <!-- Transition -->

  <div
    id="fadeScreen"
    class="fade-screen"
  ></div>


  <!-- System message -->

  <div
    id="message"
    class="message"
    role="status"
    aria-live="polite"
  ></div>


  <script>


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const video =
      document.getElementById(
        "backgroundVideo"
      );


    const greeting =
      document.getElementById(
        "greeting"
      );


    const quote =
      document.getElementById(
        "quote"
      );


    const dayDisplay =
      document.getElementById(
        "dayDisplay"
      );


    const dateDisplay =
      document.getElementById(
        "dateDisplay"
      );


    const soundButton =
      document.getElementById(
        "soundButton"
      );


    const beginButton =
      document.getElementById(
        "beginButton"
      );


    const skipButton =
      document.getElementById(
        "skipButton"
      );


    const fadeScreen =
      document.getElementById(
        "fadeScreen"
      );


    const message =
      document.getElementById(
        "message"
      );


    /* =====================================================
       VIDEO FILES
    ===================================================== */

    const videos = {

      morning1:
        "aksh-morning.1.mov",

      morning2:
        "aksh-morning.2.mov",

      morning3:
        "aksh-morning.3.mov",

      morning4:
        "aksh-morning.4.mov",


      afternoon1:
        "aksh-afternoon.1.mov",

      afternoon2:
        "aksh-afternoon.2.mov",

      afternoon3:
        "aksh-afternoon.3.mov",

      afternoon4:
        "aksh-afternoon.4.mov",


      evening1:
        "aksh-evening.1.mov",

      evening2:
        "aksh-evening.2.mov",

      evening3:
        "aksh-evening.3.mov",


      night1:
        "aksh-night.1.mov",

      night2:
        "aksh-night.2.mov"

    };


    /* =====================================================
       QUOTES
    ===================================================== */

    const quotes = {


      morning: [

        "You don't have to rush into the day. Take a breath. Begin gently.",

        "There is nowhere you need to be before you are ready.",

        "Let the morning arrive softly. You can do the same.",

        "A new day does not ask you to have everything figured out."

      ],


      afternoon: [

        "Pause for a moment. You are allowed to breathe between everything you do.",

        "Not every moment needs to be productive. Some moments are simply yours.",

        "Let yourself slow down. There is still beauty in the middle of the day.",

        "Whatever today has brought you, you don't have to carry it alone."

      ],


      evening: [

        "The day can become quiet now. You can let yourself breathe.",

        "Some journeys are meant to be taken slowly.",

        "It is okay to leave some things unfinished until tomorrow.",

        "For a little while, let the world become still."

      ],


      night: [

        "The world is quiet now. You can be quiet too.",

        "You have made it through another day. That is enough for tonight.",

        "Rest is not something you have to earn.",

        "Whatever is on your mind, you don't have to solve everything tonight."

      ]

    };


    /* =====================================================
       TIME
    ===================================================== */

    function getCurrentMinutes() {

      const now =
        new Date();

      return (
        now.getHours() * 60 +
        now.getMinutes()
      );

    }


    /* =====================================================
       TIME EXPERIENCE
    ===================================================== */

    function getExperience() {

      const time =
        getCurrentMinutes();


      /* -----------------------------------------------
         MORNING
      ------------------------------------------------ */

      if (
        time >= 300 &&
        time < 360
      ) {

        return {
          greeting:
            "Good Morning",

          group:
            "morning",

          video:
            videos.morning1
        };

      }


      if (
        time >= 360 &&
        time < 480
      ) {

        return {
          greeting:
            "Good Morning",

          group:
            "morning",

          video:
            videos.morning2
        };

      }


      if (
        time >= 480 &&
        time < 600
      ) {

        return {
          greeting:
            "Good Morning",

          group:
            "morning",

          video:
            videos.morning3
        };

      }


      if (
        time >= 600 &&
        time < 720
      ) {

        return {
          greeting:
            "Good Morning",

          group:
            "morning",

          video:
            videos.morning4
        };

      }


      /* -----------------------------------------------
         AFTERNOON
      ------------------------------------------------ */

      if (
        time >= 720 &&
        time < 780
      ) {

        return {
          greeting:
            "Good Afternoon",

          group:
            "afternoon",

          video:
            videos.afternoon1
        };

      }


      if (
        time >= 780 &&
        time < 870
      ) {

        return {
          greeting:
            "Good Afternoon",

          group:
            "afternoon",

          video:
            videos.afternoon2
        };

      }


      if (
        time >= 870 &&
        time < 960
      ) {

        return {
          greeting:
            "Good Afternoon",

          group:
            "afternoon",

          video:
            videos.afternoon3
        };

      }


      if (
        time >= 960 &&
        time < 1020
      ) {

        return {
          greeting:
            "Good Afternoon",

          group:
            "afternoon",

          video:
            videos.afternoon4
        };

      }


      /* -----------------------------------------------
         EVENING
      ------------------------------------------------ */

      if (
        time >= 1020 &&
        time < 1065
      ) {

        return {
          greeting:
            "Good Evening",

          group:
            "evening",

          video:
            videos.evening1
        };

      }


      if (
        time >= 1065 &&
        time < 1140
      ) {

        return {
          greeting:
            "Good Evening",

          group:
            "evening",

          video:
            videos.evening2
        };

      }


      if (
        time >= 1140 &&
        time < 1200
      ) {

        return {
          greeting:
            "Good Evening",

          group:
            "evening",

          video:
            videos.evening3
        };

      }


      /* -----------------------------------------------
         NIGHT
      ------------------------------------------------ */

      if (
        time >= 1200
      ) {

        return {
          greeting:
            "Good Night",

          group:
            "night",

          video:
            videos.night1
        };

      }


      return {
        greeting:
          "Good Night",

        group:
          "night",

        video:
          videos.night2
      };

    }


    /* =====================================================
       DATE + DAY
    ===================================================== */

    function updateDate() {

      const now =
        new Date();


      const day =
        new Intl.DateTimeFormat(
          undefined,
          {
            weekday:
              "long"
          }
        ).format(now);


      const date =
        new Intl.DateTimeFormat(
          undefined,
          {
            day:
              "numeric",

            month:
              "long",

            year:
              "numeric"
          }
        ).format(now);


      dayDisplay.textContent =
        day;


      dateDisplay.textContent =
        date;

    }


    /* =====================================================
       RANDOM QUOTE
    ===================================================== */

    function getRandomQuote(group) {

      const options =
        quotes[group];


      const index =
        Math.floor(
          Math.random() *
          options.length
        );


      return options[index];

    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    let messageTimer;


    function showMessage(text) {

      clearTimeout(
        messageTimer
      );


      message.textContent =
        text;


      message.classList.add(
        "show"
      );


      messageTimer =
        setTimeout(
          () => {

            message.classList.remove(
              "show"
            );

          },
          3000
        );

    }


    /* =====================================================
       ACTIVE VIDEO
    ===================================================== */

    let activeVideo = "";


    /* =====================================================
       LOAD EXPERIENCE
    ===================================================== */

    function loadExperience() {

      const experience =
        getExperience();


      greeting.textContent =
        experience.greeting;


      quote.textContent =
        getRandomQuote(
          experience.group
        );


      if (
        activeVideo ===
        experience.video
      ) {

        return;

      }


      activeVideo =
        experience.video;


      video.classList.remove(
        "visible"
      );


      video.src =
        experience.video;


      video.load();


      video.addEventListener(
        "canplay",
        () => {

          video.classList.add(
            "visible"
          );


          const playPromise =
            video.play();


          if (
            playPromise
          ) {

            playPromise.catch(
              () => {

                showMessage(
                  "Tap ♪ if you would like to hear the experience."
                );

              }
            );

          }

        },
        {
          once: true
        }
      );

    }


    /* =====================================================
       SOUND
    ===================================================== */

    function toggleSound() {

      if (
        video.muted
      ) {

        video.muted =
          false;


        soundButton.textContent =
          "♫";


        soundButton.setAttribute(
          "aria-label",
          "Turn sound off"
        );


        video.play().catch(
          () => {

            video.muted =
              true;


            soundButton.textContent =
              "♪";


            showMessage(
              "Sound could not be enabled."
            );

          }
        );

      }

      else {

        video.muted =
          true;


        soundButton.textContent =
          "♪";


        soundButton.setAttribute(
          "aria-label",
          "Turn sound on"
        );

      }

    }


    soundButton.addEventListener(
      "click",
      toggleSound
    );


    /* =====================================================
       ENTER
    ===================================================== */

    function enterWebsite() {

      fadeScreen.classList.add(
        "active"
      );


      /*
        The homepage will be connected
        when Stage 1 is built.
      */

      setTimeout(
        () => {

          fadeScreen.classList.remove(
            "active"
          );


          showMessage(
            "AKSH is preparing your space."
          );

        },
        900
      );

    }


    beginButton.addEventListener(
      "click",
      enterWebsite
    );


    skipButton.addEventListener(
      "click",
      enterWebsite
    );


    /* =====================================================
       VIDEO ERROR
    ===================================================== */

    video.addEventListener(
      "error",
      () => {

        video.classList.remove(
          "visible"
        );


        showMessage(
          "Your AKSH experience is still here."
        );

      }
    );


    /* =====================================================
       START
    ===================================================== */

    updateDate();

    loadExperience();


    /* =====================================================
       KEEP TIME + DATE UPDATED
    ===================================================== */

    setInterval(
      () => {

        updateDate();

        loadExperience();

      },
      30000
    );

  </script>


</body>
</html>
