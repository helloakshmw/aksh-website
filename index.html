<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AKSH — A Safe Space For Every Mind</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow: hidden;
      background: #071019;
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
    }

    .entrance {
      position: relative;

      width: 100%;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(5, 12, 20, 0.08),
          rgba(5, 12, 20, 0.42)
        );
    }

    /* -------------------------------------------------------
       BACKGROUND
    ------------------------------------------------------- */

    .background {
      position: absolute;
      inset: 0;
      z-index: 0;

      overflow: hidden;
      background: #071019;
    }

    .background-video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;

      transition:
        opacity 1.4s ease,
        transform 8s ease;

      transform: scale(1.04);
    }

    .background-video.active {
      opacity: 1;
      transform: scale(1);
    }

    .background-overlay {
      position: absolute;
      inset: 0;

      z-index: 2;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.18) 0%,
          rgba(0, 0, 0, 0.08) 35%,
          rgba(0, 0, 0, 0.32) 100%
        );
    }

    .background-vignette {
      position: absolute;
      inset: 0;

      z-index: 3;

      box-shadow:
        inset 0 0 180px rgba(0, 0, 0, 0.24);
    }

    /* -------------------------------------------------------
       TOP
    ------------------------------------------------------- */

    .top {
      position: absolute;

      top: 28px;
      left: 30px;
      right: 30px;

      z-index: 10;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .date-block {
      text-align: left;

      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.35);
    }

    .date {
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.12em;
      font-weight: 500;
    }

    .day {
      margin-top: 2px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 12px;
      letter-spacing: 0.08em;
      opacity: 0.82;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control {
      min-width: 38px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 11px;

      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.09);

      color: #ffffff;

      backdrop-filter: blur(18px);

      font-size: 9px;
      letter-spacing: 0.08em;

      cursor: pointer;

      transition:
        background 0.25s ease,
        transform 0.25s ease;
    }

    .control:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    /* -------------------------------------------------------
       BRAND
    ------------------------------------------------------- */

    .brand {
      position: absolute;

      top: 27px;
      left: 50%;

      z-index: 10;

      transform: translateX(-50%);

      text-align: center;

      text-shadow:
        0 3px 20px rgba(0, 0, 0, 0.32);

      white-space: nowrap;
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      margin: 0 auto 8px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 18px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(12px);
    }

    .brand-name {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 18px;
      letter-spacing: 0.25em;
    }

    .tagline {
      margin-top: 4px;

      font-size: 7px;
      letter-spacing: 0.19em;

      opacity: 0.82;
    }

    /* -------------------------------------------------------
       CENTER
    ------------------------------------------------------- */

    .center {
      position: relative;

      z-index: 8;

      width: min(720px, 88%);

      text-align: center;

      transform: translateY(2vh);
    }

    .greeting {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(46px, 7vw, 76px);

      font-weight: 400;

      line-height: 0.98;

      letter-spacing: -0.045em;

      text-shadow:
        0 5px 25px rgba(0, 0, 0, 0.3);
    }

    .quote {
      width: min(470px, 90%);

      margin: 22px auto 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(13px, 1.5vw, 17px);

      line-height: 1.65;

      opacity: 0.91;

      text-shadow:
        0 3px 18px rgba(0, 0, 0, 0.32);
    }

    /* -------------------------------------------------------
       BOTTOM
    ------------------------------------------------------- */

    .bottom {
      position: absolute;

      left: 30px;
      right: 30px;
      bottom: 27px;

      z-index: 10;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .begin {
      border: 1px solid rgba(255, 255, 255, 0.42);

      border-radius: 999px;

      padding: 13px 20px;

      color: #ffffff;

      background: rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(18px);

      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;

      cursor: pointer;

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .begin:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .founder {
      display: flex;
      align-items: center;
      gap: 9px;

      text-align: right;
    }

    .founder-photo {
      width: 36px;
      height: 36px;

      object-fit: cover;

      border-radius: 50%;

      border: 1px solid rgba(255, 255, 255, 0.5);

      background: rgba(255, 255, 255, 0.15);
    }

    .signature {
      font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size: 17px;
      line-height: 1;
    }

    .founder-name {
      margin-top: 3px;

      font-size: 6px;
      letter-spacing: 0.14em;

      opacity: 0.78;
    }

    /* -------------------------------------------------------
       SKIP
    ------------------------------------------------------- */

    .skip {
      position: absolute;

      left: 50%;
      bottom: 34px;

      z-index: 11;

      transform: translateX(-50%);

      border: 0;

      background: transparent;

      color: rgba(255, 255, 255, 0.72);

      font-size: 7px;
      letter-spacing: 0.12em;

      cursor: pointer;
    }

    /* -------------------------------------------------------
       TRANSITION
    ------------------------------------------------------- */

    .transition {
      position: fixed;
      inset: 0;

      z-index: 100;

      pointer-events: none;

      background: #ffffff;

      opacity: 0;

      transition: opacity 1s ease;
    }

    .transition.show {
      opacity: 1;
    }

    /* -------------------------------------------------------
       MOBILE
    ------------------------------------------------------- */

    @media (max-width: 700px) {

      .top {
        top: 18px;
        left: 18px;
        right: 18px;
      }

      .brand {
        top: 20px;
      }

      .brand-icon {
        width: 35px;
        height: 35px;
        font-size: 15px;
      }

      .brand-name {
        font-size: 15px;
      }

      .tagline {
        font-size: 6px;
      }

      .date {
        font-size: 9px;
      }

      .day {
        font-size: 10px;
      }

      .top-right .control:nth-child(n+2) {
        display: none;
      }

      .center {
        width: 90%;
      }

      .greeting {
        font-size: clamp(43px, 13vw, 61px);
      }

      .quote {
        font-size: 12px;
        margin-top: 17px;
      }

      .bottom {
        left: 18px;
        right: 18px;
        bottom: 18px;
      }

      .begin {
        padding: 11px 15px;
        font-size: 8px;
      }

      .founder-photo {
        width: 32px;
        height: 32px;
      }

      .signature {
        font-size: 14px;
      }

      .founder-name {
        font-size: 5px;
      }

      .skip {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="entrance">

    <!-- BACKGROUND -->
    <div class="background">

      <video
        id="morningVideo"
        class="background-video"
        muted
        playsinline
        preload="auto"
      >
        <source
          src="assets/videos/morning.mp4"
          type="video/mp4"
        >
      </video>

      <video
        id="afternoonVideo"
        class="background-video"
        muted
        playsinline
        preload="auto"
      >
        <source
          src="assets/videos/afternoon.mp4"
          type="video/mp4"
        >
      </video>

      <video
        id="eveningVideo"
        class="background-video"
        muted
        playsinline
        preload="auto"
      >
        <source
          src="assets/videos/evening.mp4"
          type="video/mp4"
        >
      </video>

      <video
        id="nightVideo"
        class="background-video"
        muted
        playsinline
        preload="auto"
      >
        <source
          src="assets/videos/night.mp4"
          type="video/mp4"
        >
      </video>

      <div class="background-overlay"></div>
      <div class="background-vignette"></div>

    </div>


    <!-- TOP -->
    <div class="top">

      <div class="date-block">
        <div
          id="date"
          class="date"
        >
          Date
        </div>

        <div
          id="day"
          class="day"
        >
          Day
        </div>
      </div>


      <div class="top-right">

        <button
          class="control"
          type="button"
          onclick="toggleSound()"
          id="soundButton"
        >
          Sound Off
        </button>

        <button
          class="control"
          type="button"
          onclick="skipEntrance()"
        >
          Skip
        </button>

      </div>

    </div>


    <!-- BRAND -->
    <div class="brand">

      <div class="brand-icon">
        A
      </div>

      <div class="brand-name">
        AKSH
      </div>

      <div class="tagline">
        A SAFE SPACE FOR EVERY MIND
      </div>

    </div>


    <!-- CENTER -->
    <section class="center">

      <h1
        id="greeting"
        class="greeting"
      >
        Welcome
      </h1>

      <p
        id="quote"
        class="quote"
      >
        Take a moment. You don't have to rush.
      </p>

    </section>


    <!-- BOTTOM -->
    <div class="bottom">

      <button
        class="begin"
        type="button"
        onclick="beginJourney()"
      >
        Begin Your Journey
      </button>


      <div class="founder">

        <div>

          <div class="signature">
            Meghana Kaverappa
          </div>

          <div class="founder-name">
            FOUNDER · AKSH
          </div>

        </div>

        <img
          class="founder-photo"
          src="assets/images/meghana-kaverappa.jpg"
          alt="Meghana Kaverappa"
        >

      </div>

    </div>


    <button
      class="skip"
      type="button"
      onclick="skipEntrance()"
    >
      SKIP INTRO
    </button>

  </main>


  <div
    id="transition"
    class="transition"
  ></div>


  <script>

    /* -------------------------------------------------------
       TIME
    ------------------------------------------------------- */

    const now = new Date();

    const hour = now.getHours();


    let greeting = "";
    let quote = "";
    let video = null;


    if (hour >= 5 && hour < 12) {

      greeting = "Good Morning";
      quote = "A new morning. A little space to simply be.";

      video =
        document.getElementById("morningVideo");

    } else if (hour >= 12 && hour < 17) {

      greeting = "Good Afternoon";
      quote = "You don't have to carry the whole day at once.";

      video =
        document.getElementById("afternoonVideo");

    } else if (hour >= 17 && hour < 20) {

      greeting = "Good Evening";
      quote = "Let the day soften around you.";

      video =
        document.getElementById("eveningVideo");

    } else {

      greeting = "Good Night";
      quote = "The world can wait. You deserve a quiet moment.";

      video =
        document.getElementById("nightVideo");

    }


    document.getElementById("greeting").textContent =
      greeting;

    document.getElementById("quote").textContent =
      quote;


    /* -------------------------------------------------------
       DATE + DAY
    ------------------------------------------------------- */

    const dateText =
      now.toLocaleDateString(
        undefined,
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    const dayText =
      now.toLocaleDateString(
        undefined,
        {
          weekday: "long"
        }
      );


    document.getElementById("date").textContent =
      dateText;

    document.getElementById("day").textContent =
      dayText;


    /* -------------------------------------------------------
       VIDEO
    ------------------------------------------------------- */

    if (video) {

      video.classList.add("active");

      video.play().catch(() => {});

      video.addEventListener(
        "ended",
        () => {
          video.currentTime = 0;
          video.play().catch(() => {});
        }
      );

    }


    /* -------------------------------------------------------
       SOUND
    ------------------------------------------------------- */

    let soundOn = false;


    function toggleSound() {

      soundOn = !soundOn;

      const button =
        document.getElementById("soundButton");

      const videos =
        document.querySelectorAll(
          ".background-video"
        );


      videos.forEach(
        currentVideo => {
          currentVideo.muted = !soundOn;
        }
      );


      button.textContent =
        soundOn
          ? "Sound On"
          : "Sound Off";


      if (video) {
        video.play().catch(() => {});
      }

    }


    /* -------------------------------------------------------
       ENTER
    ------------------------------------------------------- */

    function beginJourney() {

      const transition =
        document.getElementById("transition");

      transition.classList.add("show");


      setTimeout(
        () => {

          window.location.href =
            "homepage.html";

        },
        900
      );

    }


    function skipEntrance() {
      beginJourney();
    }

  </script>

</body>
</html>
