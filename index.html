<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#101a24">

<title>AKSH — A Safe Space For Every Mind</title>

<style>

/* =========================================================
   AKSH — 0TH PAGE
   CINEMATIC ENTRY EXPERIENCE

   IMPORTANT:
   The real .mov files are used as the background.
   No generated/AI background image is used here.
========================================================= */

:root{
  --white:#ffffff;
  --soft-white:rgba(255,255,255,.88);
  --faint-white:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.25);
  --glass:rgba(255,255,255,.09);
  --gold:#e6c986;
  --shadow:rgba(0,0,0,.30);
  --serif:Georgia,"Times New Roman",serif;
  --sans:Arial,Helvetica,sans-serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#111b25;
  color:var(--white);
  font-family:var(--sans);
}

/* =========================================================
   FULL SCREEN EXPERIENCE
========================================================= */

.entry{
  position:relative;

  width:100%;
  height:100svh;
  min-height:100vh;

  overflow:hidden;

  isolation:isolate;

  background:#111b25;
}

/* =========================================================
   REAL VIDEO LAYERS
========================================================= */

.video-layer{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center;

  opacity:0;

  z-index:-5;

  transition:
    opacity 1.6s cubic-bezier(.22,.61,.36,1);

  pointer-events:none;

  background:#111b25;
}

.video-layer.active{
  opacity:1;
}

/*
   Very subtle cinematic movement.

   The video itself remains real.
   This only gives a tiny camera-like presentation
   effect without making the scene look artificial.
*/

.video-layer.active{
  animation:
    cinematicScale 12s
    ease-in-out
    infinite
    alternate;
}

@keyframes cinematicScale{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.035);
  }

}

/* =========================================================
   REALITY-PRESERVING OVERLAY

   Very soft.
   It should NEVER look like a coloured AI filter.
========================================================= */

.scene-overlay{
  position:absolute;

  inset:0;

  z-index:-3;

  pointer-events:none;

  background:

    linear-gradient(
      180deg,
      rgba(0,0,0,.28) 0%,
      rgba(0,0,0,.03) 28%,
      rgba(0,0,0,.08) 55%,
      rgba(0,0,0,.43) 100%
    ),

    linear-gradient(
      90deg,
      rgba(0,0,0,.17),
      transparent 35%,
      transparent 68%,
      rgba(0,0,0,.14)
    );
}

/* =========================================================
   SOFT GLASS VIGNETTE
========================================================= */

.vignette{
  position:absolute;

  inset:0;

  z-index:-2;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(0,0,0,.12) 72%,
      rgba(0,0,0,.34) 100%
    );
}

/* =========================================================
   TOP AREA
========================================================= */

.top{
  position:absolute;

  top:0;
  left:0;
  right:0;

  z-index:5;

  padding:
    clamp(20px,4vw,42px)
    clamp(20px,5vw,62px);

  display:grid;

  grid-template-columns:
    1fr
    auto
    1fr;

  align-items:start;

  pointer-events:none;
}

/* =========================================================
   DATE / DAY

   Deliberately separated.
========================================================= */

.date-block{
  pointer-events:auto;

  display:flex;
  flex-direction:column;

  align-items:flex-start;

  gap:4px;
}

.date{
  font-size:
    clamp(9px,1vw,12px);

  font-weight:500;

  letter-spacing:
    .18em;

  line-height:1.2;

  color:var(--soft-white);

  text-transform:uppercase;

  text-shadow:
    0 3px 14px var(--shadow);
}

.day{
  font-size:
    clamp(8px,.9vw,11px);

  font-weight:700;

  letter-spacing:
    .30em;

  line-height:1.2;

  color:rgba(255,255,255,.66);

  text-transform:uppercase;

  text-shadow:
    0 3px 14px var(--shadow);
}

/* =========================================================
   CENTER BRAND
========================================================= */

.brand{
  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:flex-start;

  text-align:center;

  pointer-events:auto;
}

.brand-icon{
  width:
    clamp(39px,4vw,52px);

  height:
    clamp(39px,4vw,52px);

  object-fit:contain;

  filter:
    drop-shadow(
      0 5px 16px
      rgba(0,0,0,.30)
    );
}

.brand-name{
  margin-top:6px;

  font-family:var(--sans);

  font-size:
    clamp(15px,1.5vw,21px);

  font-weight:500;

  letter-spacing:
    .30em;

  text-indent:.30em;

  line-height:1;
}

.brand-tagline{
  margin-top:6px;

  font-family:var(--sans);

  font-size:
    clamp(7px,.72vw,9px);

  font-weight:400;

  letter-spacing:
    .22em;

  line-height:1.3;

  color:
    rgba(255,255,255,.72);

  text-transform:none;
}

/* =========================================================
   TOP RIGHT
========================================================= */

.top-right{
  display:flex;

  justify-content:flex-end;

  align-items:flex-start;

  gap:9px;

  pointer-events:auto;
}

.top-control{
  width:
    clamp(35px,3.5vw,43px);

  height:
    clamp(35px,3.5vw,43px);

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(255,255,255,.24);

  border-radius:50%;

  background:
    rgba(255,255,255,.07);

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

  color:#fff;

  cursor:pointer;

  transition:
    background .25s ease,
    transform .25s ease,
    border-color .25s ease;
}

.top-control:hover{
  transform:translateY(-2px);

  background:
    rgba(255,255,255,.14);

  border-color:
    rgba(255,255,255,.42);
}

/* =========================================================
   CENTER MESSAGE
========================================================= */

.center{
  position:absolute;

  top:50%;
  left:50%;

  z-index:4;

  width:
    min(90%,850px);

  transform:
    translate(-50%,-50%);

  text-align:center;
}

.greeting{
  margin:0;

  font-family:var(--serif);

  font-size:
    clamp(48px,7vw,92px);

  font-weight:400;

  letter-spacing:
    -.045em;

  line-height:.98;

  text-shadow:
    0 7px 35px
    rgba(0,0,0,.28);

  transition:
    opacity .7s ease,
    transform .7s ease;
}

.quote-divider{
  width:
    clamp(70px,8vw,105px);

  height:1px;

  margin:
    clamp(18px,2.5vw,28px)
    auto
    clamp(16px,2vw,22px);

  position:relative;

  background:
    rgba(255,255,255,.48);
}

.quote-divider::after{
  content:"✦";

  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  padding:0 9px;

  background:
    transparent;

  color:
    rgba(255,255,255,.82);

  font-size:8px;
}

.quote{
  max-width:
    610px;

  margin:0 auto;

  font-family:var(--serif);

  font-size:
    clamp(15px,1.7vw,21px);

  font-weight:400;

  line-height:1.55;

  color:
    rgba(255,255,255,.91);

  text-shadow:
    0 4px 18px
    rgba(0,0,0,.28);
}

.quote-author{
  margin-top:13px;

  font-size:8px;

  font-weight:600;

  letter-spacing:.23em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.60);
}

/* =========================================================
   BOTTOM
========================================================= */

.bottom{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  z-index:5;

  padding:
    0
    clamp(20px,5vw,62px)
    clamp(22px,4vw,42px);

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  pointer-events:none;
}

/* =========================================================
   BEGIN + SOUND
========================================================= */

.bottom-left{
  display:flex;

  align-items:center;

  gap:10px;

  pointer-events:auto;
}

.begin{
  min-height:
    clamp(45px,5vw,55px);

  padding:
    0
    clamp(21px,2.8vw,32px);

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(255,255,255,.48);

  border-radius:999px;

  background:
    rgba(255,255,255,.10);

  backdrop-filter:
    blur(16px);

  -webkit-backdrop-filter:
    blur(16px);

  color:#fff;

  font-family:var(--sans);

  font-size:
    clamp(9px,1vw,11px);

  font-weight:700;

  letter-spacing:
    .18em;

  text-transform:uppercase;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.14);

  cursor:pointer;

  transition:
    background .3s ease,
    transform .3s ease,
    border-color .3s ease;
}

.begin:hover{
  transform:translateY(-3px);

  background:
    rgba(255,255,255,.18);

  border-color:
    rgba(255,255,255,.72);
}

.sound{
  width:
    clamp(43px,4.5vw,53px);

  height:
    clamp(43px,4.5vw,53px);

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(255,255,255,.28);

  border-radius:50%;

  background:
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

  color:#fff;

  font-size:14px;

  cursor:pointer;

  transition:
    transform .25s ease,
    background .25s ease;
}

.sound:hover{
  transform:translateY(-3px);

  background:
    rgba(255,255,255,.15);
}

.sound-label{
  position:absolute;

  bottom:-18px;

  left:0;

  font-size:7px;

  letter-spacing:.15em;

  color:
    rgba(255,255,255,.58);

  white-space:nowrap;
}

/* =========================================================
   FOUNDER
========================================================= */

.founder{
  display:flex;

  align-items:center;

  gap:12px;

  pointer-events:auto;

  text-align:right;
}

.founder-photo{
  width:
    clamp(48px,5vw,64px);

  height:
    clamp(48px,5vw,64px);

  flex:none;

  border-radius:50%;

  object-fit:cover;

  object-position:center;

  border:
    1px solid
    rgba(255,255,255,.55);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);
}

.founder-copy{
  display:flex;

  flex-direction:column;

  align-items:flex-end;
}

.founder-role{
  margin-bottom:3px;

  font-size:7px;

  font-weight:700;

  letter-spacing:.20em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.58);
}

.signature{
  font-family:
    "Brush Script MT",
    "Segoe Script",
    cursive;

  font-size:
    clamp(21px,2.5vw,30px);

  font-weight:400;

  line-height:1;

  color:#fff;

  text-shadow:
    0 4px 13px
    rgba(0,0,0,.25);

  white-space:nowrap;
}

.founder-name{
  margin-top:4px;

  font-family:var(--sans);

  font-size:7px;

  letter-spacing:.18em;

  color:
    rgba(255,255,255,.68);

  text-transform:uppercase;
}

/* =========================================================
   SKIP / AUTO TRANSITION INDICATOR
========================================================= */

.transition-line{
  position:absolute;

  left:50%;

  bottom:
    clamp(18px,3vw,30px);

  transform:
    translateX(-50%);

  z-index:6;

  font-size:7px;

  letter-spacing:.20em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.42);

  pointer-events:none;

  transition:
    opacity .5s ease;
}

/* =========================================================
   ENTRY TRANSITION
========================================================= */

.transition-cover{
  position:fixed;

  inset:0;

  z-index:100;

  pointer-events:none;

  background:#11151c;

  opacity:0;

  transition:
    opacity 1.1s
    cubic-bezier(.77,0,.18,1);
}

.transition-cover.show{
  opacity:1;
}

/* =========================================================
   LOADING FALLBACK
========================================================= */

.loading{
  position:absolute;

  inset:0;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

  pointer-events:none;

  opacity:0;

  transition:opacity .5s ease;
}

.loading.show{
  opacity:1;
}

.loading-dot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 18px rgba(255,255,255,.7);

  animation:
    pulse 1.4s ease-in-out infinite;
}

@keyframes pulse{

  0%,100%{
    opacity:.25;
    transform:scale(.8);
  }

  50%{
    opacity:1;
    transform:scale(1.2);
  }

}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:850px){

  .top{
    grid-template-columns:
      1fr
      auto
      1fr;

    padding:
      18px
      22px;
  }

  .nav-detail{
    display:none;
  }

  .center{
    width:calc(100% - 40px);
  }

  .bottom{
    padding:
      0
      22px
      24px;
  }

}

/* =========================================================
   PHONE
========================================================= */

@media(max-width:600px){

  .top{
    padding:
      18px
      17px;
  }

  .date{
    font-size:8px;
    letter-spacing:.15em;
  }

  .day{
    font-size:7px;
    letter-spacing:.23em;
  }

  .brand-icon{
    width:38px;
    height:38px;
  }

  .brand-name{
    font-size:14px;
    letter-spacing:.24em;
  }

  .brand-tagline{
    max-width:150px;

    font-size:6px;

    line-height:1.45;

    letter-spacing:.14em;
  }

  .top-right{
    gap:5px;
  }

  .top-control{
    width:34px;
    height:34px;
  }

  .center{
    width:
      calc(100% - 30px);
  }

  .greeting{
    font-size:
      clamp(43px,14vw,64px);
  }

  .quote{
    padding:0 10px;

    font-size:14px;

    line-height:1.55;
  }

  .bottom{
    padding:
      0
      17px
      20px;

    align-items:flex-end;
  }

  .bottom-left{
    gap:7px;
  }

  .begin{
    min-height:43px;

    padding:
      0 15px;

    font-size:7px;

    letter-spacing:.14em;
  }

  .sound{
    width:41px;
    height:41px;
  }

  .founder{
    gap:7px;
  }

  .founder-photo{
    width:46px;
    height:46px;
  }

  .founder-role{
    font-size:5px;
    letter-spacing:.12em;
  }

  .signature{
    font-size:18px;
  }

  .founder-name{
    font-size:5px;
    letter-spacing:.10em;
  }

  .transition-line{
    display:none;
  }

}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  .video-layer.active{
    animation:none;
  }

  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
  }

}

</style>
</head>

<script>

/* =========================================================
   AKSH — 0TH PAGE LOGIC

   TIME WINDOWS:

   05:00–11:59  Morning
   12:00–16:59  Afternoon
   17:00–19:59  Evening
   20:00–04:59  Night
========================================================= */

const VIDEO_GROUPS = {

  morning:[
    "aksh-morning.1.mov",
    "aksh-morning.2.mov",
    "aksh-morning.3.mov",
    "aksh-morning.4.mov"
  ],

  afternoon:[
    "aksh-afternoon.1.mov",
    "aksh-afternoon.2.mov",
    "aksh-afternoon.3.mov",
    "aksh-afternoon.4.mov"
  ],

  evening:[
    "aksh-evening.1.mov",
    "aksh-evening.2.mov",
    "aksh-evening.3.mov"
  ],

  night:[
    "aksh-night.1.mov",
    "aksh-night.2.mov"
  ]

};


/* =========================================================
   TIME-BASED COPY
========================================================= */

const TIME_CONTENT = {

  morning:{
    greeting:"Good Morning",

    quotes:[
      "Whatever today has brought you, you don't have to carry it alone.",
      "Let the morning arrive gently. You can take today one moment at a time.",
      "A new morning does not ask you to have everything figured out.",
      "Begin softly. There is enough time for one small step."
    ]
  },

  afternoon:{
    greeting:"Good Afternoon",

    quotes:[
      "Whatever today has brought you, you don't have to carry it alone.",
      "Pause for a moment. You are allowed to breathe in the middle of your day.",
      "You do not have to rush through every feeling.",
      "Take this moment as it is. You are still allowed to begin again."
    ]
  },

  evening:{
    greeting:"Good Evening",

    quotes:[
      "Let the evening remind you that not everything needs to be solved tonight.",
      "You made it this far today. Give yourself a moment to simply be.",
      "Some days ask more from us than others. Be gentle with yourself tonight.",
      "Let the rain, the quiet and the evening slow everything down."
    ]
  },

  night:{
    greeting:"Good Night",

    quotes:[
      "You can put down what today asked you to carry.",
      "The night does not ask you to solve tomorrow.",
      "Rest. Tomorrow can wait.",
      "You have done enough for today. Let yourself be still."
    ]
  }

};


/* =========================================================
   DOM
========================================================= */

const videoA =
  document.getElementById("videoA");

const videoB =
  document.getElementById("videoB");

const greeting =
  document.getElementById("greeting");

const quote =
  document.getElementById("quote");

const date =
  document.getElementById("date");

const day =
  document.getElementById("day");

const soundButton =
  document.getElementById("soundButton");

const soundIcon =
  document.getElementById("soundIcon");

const soundLabel =
  document.getElementById("soundLabel");

const beginJourney =
  document.getElementById("beginJourney");

const transitionCover =
  document.getElementById("transitionCover");

const loading =
  document.getElementById("loading");

const transitionLine =
  document.getElementById("transitionLine");


/* =========================================================
   STATE
========================================================= */

let activeVideo = videoA;
let standbyVideo = videoB;

let currentPeriod = "";
let currentVideoIndex = -1;

let soundOn = false;

let transitionStarted = false;

let fallbackTimer = null;


/* =========================================================
   PERIOD
========================================================= */

function getPeriod(hour){

  if(hour >= 5 && hour < 12){
    return "morning";
  }

  if(hour >= 12 && hour < 17){
    return "afternoon";
  }

  if(hour >= 17 && hour < 20){
    return "evening";
  }

  return "night";
}


/* =========================================================
   DATE / DAY
========================================================= */

function updateDate(){

  const now = new Date();

  const dayNumber =
    String(now.getDate()).padStart(2,"0");

  const month =
    now.toLocaleString(
      "en-IN",
      {month:"long"}
    ).toUpperCase();

  const year =
    now.getFullYear();

  const weekday =
    now.toLocaleString(
      "en-IN",
      {weekday:"long"}
    ).toUpperCase();

  /*
    Separate lines:
    DATE
    DAY
  */

  date.textContent =
    `${dayNumber} ${month} ${year}`;

  day.textContent =
    weekday;
}


/* =========================================================
   TIME CONTENT
========================================================= */

function updateTimeContent(){

  const now =
    new Date();

  const period =
    getPeriod(now.getHours());

  const content =
    TIME_CONTENT[period];

  currentPeriod =
    period;

  greeting.textContent =
    content.greeting;

  /*
    Stable quote for the current time block.
    Changes with the time, not randomly every second.
  */

  const dayOfYear =
    Math.floor(
      (Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      ) -
      Date.UTC(
        now.getFullYear(),
        0,
        0
      )) /
      86400000
    );

  const quoteIndex =
    dayOfYear %
    content.quotes.length;

  quote.textContent =
    content.quotes[quoteIndex];
}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(video, source){

  video.src = source;

  video.load();

}


/* =========================================================
   SAFE PLAY

   iPhone browsers can block autoplay with sound.
   Therefore the background begins muted.
========================================================= */

function safePlay(video){

  const promise =
    video.play();

  if(
    promise &&
    typeof promise.catch === "function"
  ){

    promise.catch(()=>{
      loading.classList.remove("show");
    });

  }

}


/* =========================================================
   RANDOM VIDEO
========================================================= */

function nextVideoIndex(){

  const group =
    VIDEO_GROUPS[currentPeriod];

  if(group.length <= 1){
    return 0;
  }

  let index;

  do{

    index =
      Math.floor(
        Math.random() *
        group.length
      );

  }while(
    index === currentVideoIndex
  );

  return index;
}


/* =========================================================
   START ATMOSPHERE
========================================================= */

function startAtmosphere(){

  const group =
    VIDEO_GROUPS[currentPeriod];

  currentVideoIndex =
    Math.floor(
      Math.random() *
      group.length
    );

  const source =
    group[currentVideoIndex];

  loadVideo(
    activeVideo,
    source
  );

  activeVideo.classList.add("active");

  loading.classList.add("show");

  activeVideo.oncanplay = ()=>{
    loading.classList.remove("show");
    safePlay(activeVideo);
  };

  scheduleFallback();

}


/* =========================================================
   CROSSFADE
========================================================= */

function crossfadeNext(){

  if(transitionStarted){
    return;
  }

  const group =
    VIDEO_GROUPS[currentPeriod];

  currentVideoIndex =
    nextVideoIndex();

  const source =
    group[currentVideoIndex];

  loadVideo(
    standbyVideo,
    source
  );

  standbyVideo.currentTime = 0;

  standbyVideo.muted =
    !soundOn;

  standbyVideo.oncanplay = ()=>{

    safePlay(standbyVideo);

    standbyVideo.classList.add("active");

    activeVideo.classList.remove("active");

    const old =
      activeVideo;

    activeVideo =
      standbyVideo;

    standbyVideo =
      old;

    scheduleFallback();

  };

}


/* =========================================================
   FALLBACK TIMER

   Prevents the visitor from getting stuck if
   video metadata behaves differently on a device.
========================================================= */

function scheduleFallback(){

  clearTimeout(
    fallbackTimer
  );

  const duration =
    activeVideo.duration;

  let wait =
    9000;

  if(
    Number.isFinite(duration) &&
    duration > 2
  ){

    wait =
      Math.max(
        4500,
        duration * 1000 - 800
      );

  }

  fallbackTimer =
    setTimeout(
      crossfadeNext,
      wait
    );

}


/* =========================================================
   VIDEO ENDED
========================================================= */

videoA.addEventListener(
  "ended",
  crossfadeNext
);

videoB.addEventListener(
  "ended",
  crossfadeNext
);


/* =========================================================
   SOUND

   Starts OFF.

   User can intentionally turn it ON.
========================================================= */

function updateSoundUI(){

  if(soundOn){

    soundIcon.textContent =
      "♫";

    soundLabel.textContent =
      "SOUND ON";

    soundButton.setAttribute(
      "aria-label",
      "Sound on"
    );

    soundButton.title =
      "Sound on";

  }else{

    soundIcon.textContent =
      "♫";

    soundLabel.textContent =
      "SOUND OFF";

    soundButton.setAttribute(
      "aria-label",
      "Sound off"
    );

    soundButton.title =
      "Sound off";

  }

}


function toggleSound(){

  soundOn =
    !soundOn;

  videoA.muted =
    !soundOn;

  videoB.muted =
    !soundOn;

  if(soundOn){

    safePlay(activeVideo);

  }

  updateSoundUI();

}


soundButton.addEventListener(
  "click",
  toggleSound
);


/* =========================================================
   BEGIN JOURNEY

   Automatic transition is ALSO supported.
   This button simply allows the visitor to enter
   immediately.
========================================================= */

function goToPage1(){

  if(transitionStarted){
    return;
  }

  transitionStarted =
    true;

  clearTimeout(
    fallbackTimer
  );

  transitionLine.style.opacity =
    "0";

  transitionCover.classList.add(
    "show"
  );

  setTimeout(()=>{

    window.location.href =
      "page1.html";

  },1100);

}


beginJourney.addEventListener(
  "click",
  goToPage1
);


/* =========================================================
   AUTOMATIC TRANSITION

   The entrance page automatically proceeds
   after the cinematic opening has played.

   This is intentionally independent of Page 1.
========================================================= */

function automaticEntry(){

  /*
    Give the visitor enough time to experience
    the opening scene.

    The video itself continues underneath.
  */

  setTimeout(
    goToPage1,
    12000
  );

}


/* =========================================================
   INITIALISE
========================================================= */

function initialise(){

  updateDate();

  updateTimeContent();

  updateSoundUI();

  startAtmosphere();

  automaticEntry();

}


/* =========================================================
   KEEP DATE/DAY CURRENT

   Midnight changes the displayed date/day.
========================================================= */

setInterval(
  updateDate,
  30000
);


/* =========================================================
   IF TIME PERIOD CHANGES WHILE PAGE IS OPEN,
   SWITCH TO THE CORRECT ATMOSPHERE.
========================================================= */

setInterval(()=>{

  const newPeriod =
    getPeriod(
      new Date().getHours()
    );

  if(
    newPeriod !== currentPeriod
  ){

    currentPeriod =
      newPeriod;

    updateTimeContent();

    currentVideoIndex =
      -1;

    startAtmosphere();

  }

},60000);


/* =========================================================
   START
========================================================= */

initialise();

</script>

</body>
</html>
