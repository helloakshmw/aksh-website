<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10100e">
<meta name="description" content="AKSH — A Safe Space For Every Mind">
<title>AKSH — A Safe Space For Every Mind</title>

<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --side:clamp(22px,5vw,64px);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#10100e;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  color:#fff;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.entry{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100svh;
  overflow:hidden;
  isolation:isolate;
  background:#10100e;
}

/* VIDEO */

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  background:#10100e;
  opacity:0;
  transform:scale(1.025);
  transition:opacity 1.3s ease,transform 8s ease;
  z-index:-5;
}

.video.show{
  opacity:1;
  transform:scale(1);
}

.overlay{
  position:absolute;
  inset:0;
  z-index:-4;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.48) 0%,
      rgba(0,0,0,.10) 30%,
      rgba(0,0,0,.08) 55%,
      rgba(0,0,0,.56) 100%
    );
}

.vignette{
  position:absolute;
  inset:0;
  z-index:-3;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 25%,
      rgba(0,0,0,.10) 62%,
      rgba(0,0,0,.40) 100%
    );
}

/* TOP */

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:5;
  padding:
    calc(var(--safe-top) + 24px)
    var(--side)
    0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}

.date{
  display:flex;
  flex-direction:column;
  gap:4px;
  text-shadow:0 2px 16px rgba(0,0,0,.5);
}

.day{
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(10px,1.8vw,13px);
  font-weight:500;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.date-text{
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(9px,1.6vw,11px);
  letter-spacing:.08em;
  opacity:.82;
}

/* ICON */

.logo{
  position:absolute;
  top:calc(var(--safe-top) + 20px);
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  pointer-events:none;
}

.logo img{
  width:clamp(58px,10vw,88px);
  height:clamp(58px,10vw,88px);
  object-fit:contain;
  filter:drop-shadow(0 5px 18px rgba(0,0,0,.35));
}

.tagline{
  margin-top:7px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(7px,1.35vw,10px);
  letter-spacing:.17em;
  text-transform:uppercase;
  white-space:nowrap;
  text-shadow:0 2px 14px rgba(0,0,0,.55);
  opacity:.9;
}

/* SOUND */

.sound{
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.42);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:rgba(0,0,0,.14);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  cursor:pointer;
  font-family:Arial,Helvetica,sans-serif;
  font-size:17px;
  transition:.3s ease;
}

.sound:active{
  transform:scale(.94);
}

/* CENTER */

.center{
  position:absolute;
  z-index:3;
  top:50%;
  left:var(--side);
  right:var(--side);
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.greeting{
  font-size:clamp(46px,10vw,100px);
  line-height:.98;
  font-weight:400;
  letter-spacing:-.045em;
  text-shadow:0 5px 30px rgba(0,0,0,.38);
  animation:appear 1.1s ease both;
}

.quote{
  max-width:680px;
  margin-top:24px;
  font-size:clamp(15px,2.3vw,22px);
  line-height:1.55;
  color:rgba(255,255,255,.95);
  text-shadow:0 3px 20px rgba(0,0,0,.5);
  animation:appear 1.1s .12s ease both;
}

/* BOTTOM */

.bottom{
  position:absolute;
  left:var(--side);
  right:var(--side);
  bottom:0;
  z-index:5;
  padding-bottom:
    calc(var(--safe-bottom) + clamp(25px,5vh,48px));
  display:flex;
  flex-direction:column;
  align-items:center;
}

.begin{
  width:min(82vw,270px);
  min-height:54px;
  padding:15px 24px;
  border:1px solid rgba(255,255,255,.72);
  border-radius:999px;
  color:#fff;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(9px,1.7vw,12px);
  letter-spacing:.18em;
  text-transform:uppercase;
  cursor:pointer;
  transition:.3s ease;
}

.begin:active{
  transform:scale(.96);
}

.skip{
  margin-top:10px;
  padding:8px 15px;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.78);
  font-family:Arial,Helvetica,sans-serif;
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
  cursor:pointer;
}

/* FADE */

.fade{
  position:fixed;
  inset:0;
  z-index:20;
  background:#10100e;
  opacity:0;
  pointer-events:none;
  transition:opacity .9s ease;
}

.fade.active{
  opacity:1;
  pointer-events:auto;
}

/* MESSAGE */

.message{
  position:fixed;
  left:50%;
  bottom:calc(var(--safe-bottom) + 20px);
  transform:translateX(-50%);
  width:min(88vw,430px);
  padding:12px 18px;
  border-radius:999px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  font-family:Arial,Helvetica,sans-serif;
  font-size:10px;
  text-align:center;
  letter-spacing:.06em;
  opacity:0;
  pointer-events:none;
  transition:.35s ease;
}

.message.show{
  opacity:1;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* SMALL PHONES */

@media(max-height:680px) and (orientation:portrait){

  .top{
    padding-top:calc(var(--safe-top) + 14px);
  }

  .logo{
    top:calc(var(--safe-top) + 12px);
  }

  .logo img{
    width:52px;
    height:52px;
  }

  .tagline{
    margin-top:4px;
    font-size:6px;
  }

  .center{
    top:53%;
  }

  .greeting{
    font-size:clamp(36px,10vw,60px);
  }

  .quote{
    margin-top:15px;
    font-size:13px;
    line-height:1.45;
  }

  .bottom{
    padding-bottom:calc(var(--safe-bottom) + 13px);
  }

  .begin{
    min-height:47px;
  }

  .skip{
    margin-top:5px;
  }
}

/* LANDSCAPE */

@media(orientation:landscape) and (max-height:600px){

  .logo img{
    width:45px;
    height:45px;
  }

  .tagline{
    font-size:6px;
    margin-top:3px;
  }

  .center{
    top:55%;
  }

  .greeting{
    font-size:clamp(35px,8vw,68px);
  }

  .quote{
    margin-top:12px;
    font-size:13px;
  }

  .bottom{
    padding-bottom:calc(var(--safe-bottom) + 8px);
  }

  .begin{
    min-height:42px;
    padding:11px 22px;
  }
}

/* DESKTOP */

@media(min-width:1025px){

  .sound:hover{
    background:rgba(255,255,255,.18);
  }

  .begin:hover{
    background:rgba(255,255,255,.21);
    border-color:rgba(255,255,255,.95);
    transform:translateY(-2px);
  }

  .skip:hover{
    color:#fff;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }

  .video{
    transform:none;
  }
}
</style>
</head>

<body>

<main class="entry">

  <video
    id="video"
    class="video"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

  <div class="overlay"></div>
  <div class="vignette"></div>

  <header class="top">

    <div class="date">
      <div id="day" class="day"></div>
      <div id="date" class="date-text"></div>
    </div>

    <button
      id="sound"
      class="sound"
      type="button"
      aria-label="Turn sound on">
      ♪
    </button>

  </header>

  <div class="logo">

    <img
      src="aksh-icon.PNG"
      alt="AKSH">

    <div class="tagline">
      A Safe Space For Every Mind
    </div>

  </div>

  <section class="center">

    <h1
      id="greeting"
      class="greeting">
    </h1>

    <p
      id="quote"
      class="quote">
    </p>

  </section>

  <div class="bottom">

    <button
      id="begin"
      class="begin"
      type="button">
      Begin Your Journey
    </button>

    <button
      id="skip"
      class="skip"
      type="button">
      Skip
    </button>

  </div>

</main>

<div id="fade" class="fade"></div>

<div
  id="message"
  class="message"
  role="status">
</div>

<script>

/* =====================================================
   AKSH 0TH PAGE — TIME-BASED EXPERIENCE
===================================================== */

const video = document.getElementById("video");
const greeting = document.getElementById("greeting");
const quote = document.getElementById("quote");
const day = document.getElementById("day");
const date = document.getElementById("date");
const sound = document.getElementById("sound");
const begin = document.getElementById("begin");
const skip = document.getElementById("skip");
const fade = document.getElementById("fade");
const message = document.getElementById("message");


/* VIDEO LIBRARY */

const videos = {

  morning1:"aksh-morning.1.mov",
  morning2:"aksh-morning.2.mov",
  morning3:"aksh-morning.3.mov",
  morning4:"aksh-morning.4.mov",

  afternoon1:"aksh-afternoon.1.mov",
  afternoon2:"aksh-afternoon.2.mov",
  afternoon3:"aksh-afternoon.3.mov",
  afternoon4:"aksh-afternoon.4.mov",

  evening1:"aksh-evening.1.mov",
  evening2:"aksh-evening.2.mov",
  evening3:"aksh-evening.3.mov",

  night1:"aksh-night.1.mov",
  night2:"aksh-night.2.mov"

};


/* QUOTES */

const quotes = {

  morning:[
    "You don't have to rush into the day. Begin gently.",
    "There is nowhere you need to be before you are ready.",
    "Let the morning arrive softly. You can do the same.",
    "A new day does not ask you to have everything figured out."
  ],

  afternoon:[
    "Pause for a moment. You are allowed to breathe.",
    "Not every moment needs to be productive.",
    "Let yourself slow down. There is still beauty here.",
    "Whatever today has brought you, you don't have to carry it alone."
  ],

  evening:[
    "The day can become quiet now. You can let yourself breathe.",
    "Some journeys are meant to be taken slowly.",
    "It is okay to leave some things unfinished until tomorrow.",
    "For a little while, let the world become still."
  ],

  night:[
    "The world is quiet now. You can be quiet too.",
    "You have made it through another day. That is enough for tonight.",
    "Rest is not something you have to earn.",
    "You don't have to solve everything tonight."
  ]

};


/* TIME */

function minutes(){

  const now = new Date();

  return now.getHours()*60 + now.getMinutes();

}


/* EXPERIENCE */

function experience(){

  const t = minutes();

  if(t>=300 && t<360)
    return ["Good Morning","morning",videos.morning1];

  if(t>=360 && t<480)
    return ["Good Morning","morning",videos.morning2];

  if(t>=480 && t<600)
    return ["Good Morning","morning",videos.morning3];

  if(t>=600 && t<720)
    return ["Good Morning","morning",videos.morning4];

  if(t>=720 && t<780)
    return ["Good Afternoon","afternoon",videos.afternoon1];

  if(t>=780 && t<870)
    return ["Good Afternoon","afternoon",videos.afternoon2];

  if(t>=870 && t<960)
    return ["Good Afternoon","afternoon",videos.afternoon3];

  if(t>=960 && t<1020)
    return ["Good Afternoon","afternoon",videos.afternoon4];

  if(t>=1020 && t<1065)
    return ["Good Evening","evening",videos.evening1];

  if(t>=1065 && t<1140)
    return ["Good Evening","evening",videos.evening2];

  if(t>=1140 && t<1200)
    return ["Good Evening","evening",videos.evening3];

  if(t>=1200)
    return ["Good Night","night",videos.night1];

  return ["Good Night","night",videos.night2];

}


/* DATE */

function updateDate(){

  const now = new Date();

  day.textContent =
    new Intl.DateTimeFormat(undefined,{
      weekday:"long"
    }).format(now);

  date.textContent =
    new Intl.DateTimeFormat(undefined,{
      day:"numeric",
      month:"long",
      year:"numeric"
    }).format(now);

}


/* RANDOM QUOTE */

function randomQuote(group){

  const list = quotes[group];

  return list[
    Math.floor(Math.random()*list.length)
  ];

}


/* LOAD EXPERIENCE */

let activeVideo = "";

function load(){

  const data = experience();

  greeting.textContent = data[0];

  quote.textContent = randomQuote(data[1]);

  if(activeVideo === data[2])
    return;

  activeVideo = data[2];

  video.classList.remove("show");

  video.src = data[2];

  video.load();

  video.addEventListener(
    "canplay",
    function(){

      video.classList.add("show");

      video.play().catch(()=>{});

    },
    {once:true}
  );

}


/* SOUND */

sound.addEventListener("click",()=>{

  if(video.muted){

    video.muted = false;

    sound.textContent = "♫";

    sound.setAttribute(
      "aria-label",
      "Turn sound off"
    );

  }else{

    video.muted = true;

    sound.textContent = "♪";

    sound.setAttribute(
      "aria-label",
      "Turn sound on"
    );

  }

});


/* ENTER */

function enter(){

  fade.classList.add("active");

  setTimeout(()=>{

    /*
      Stage 1 homepage will be connected here.
    */

    fade.classList.remove("active");

  },900);

}


begin.addEventListener("click",enter);
skip.addEventListener("click",enter);


/* START */

updateDate();
load();


/* KEEP TIME UPDATED */

setInterval(()=>{

  updateDate();
  load();

},30000);

</script>

</body>
</html>
