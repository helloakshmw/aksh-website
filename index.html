<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#10131d">
  <meta name="description" content="AKSH — A Safe Space For Every Mind">

  <title>AKSH</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #10131d;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .arrival {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100vh;
      overflow: hidden;
      background: #10131d;
      isolation: isolate;
    }

    /* =====================================================
       ONE VIDEO ELEMENT ONLY
    ===================================================== */

    .video-background {
      position: absolute;
      inset: 0;
      z-index: -5;
      overflow: hidden;
      background: #10131d;
    }

    #backgroundVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      display: block;

      opacity: 0;

      transition: opacity 0.8s ease;
    }

    #backgroundVideo.ready {
      opacity: 1;
    }

    /* =====================================================
       CINEMATIC READABILITY
    ===================================================== */

    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.25) 0%,
          rgba(0, 0, 0, 0.02) 38%,
          rgba(0, 0, 0, 0.10) 62%,
          rgba(0, 0, 0, 0.48) 100%
        );
    }

    .soft-atmosphere {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 255, 255, 0.08),
          transparent 46%
        );
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .top {
      position: absolute;
      z-index: 10;

      top: 0;
      left: 0;
      right: 0;

      padding:
        max(20px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        0
        max(22px, env(safe-area-inset-left));
    }

    .top-inner {
      width: min(1180px, 100%);
      margin: 0 auto;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    /* =====================================================
       AKSH ICON
    ===================================================== */

    .aksh-icon {
      width: 52px;
      height: 52px;

      object-fit: contain;
      display: block;

      filter:
        drop-shadow(0 3px 12px rgba(0, 0, 0, 0.30));
    }

    /* =====================================================
       DATE + DAY
    ===================================================== */

    .date-box {
      text-align: right;

      color: #fff;

      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.35);
    }

    .day {
      font-size: 10px;
      font-weight: 800;

      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .date {
      margin-top: 5px;

      font-size: 9px;
      letter-spacing: 0.05em;

      opacity: 0.82;
    }

    /* =====================================================
       CENTER ARRIVAL
    ===================================================== */

    .center {
      position: relative;
      z-index: 10;

      width: min(900px, calc(100% - 36px));
      height: 100svh;

      margin: auto;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        100px 0
        max(40px, env(safe-area-inset-bottom));
    }

    .welcome {
      margin-bottom: 18px;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: 0.28em;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.90);

      text-shadow:
        0 2px 15px rgba(0, 0, 0, 0.40);
    }

    .wish {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(55px, 9vw, 110px);

      line-height: 0.88;

      font-weight: 400;

      letter-spacing: -0.055em;

      color: #fff;

      text-shadow:
        0 4px 30px rgba(0, 0, 0, 0.30);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    .wish.changing {
      opacity: 0;
      transform: translateY(8px);
    }

    .message {
      max-width: 500px;

      margin-top: 21px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(17px, 2.5vw, 24px);

      line-height: 1.35;

      color: rgba(255, 255, 255, 0.95);

      text-shadow:
        0 3px 20px rgba(0, 0, 0, 0.35);
    }

    .sub-message {
      max-width: 430px;

      margin-top: 14px;

      font-size: 11px;
      line-height: 1.7;

      color: rgba(255, 255, 255, 0.82);

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.40);
    }

    /* =====================================================
       ENTER BUTTON
    ===================================================== */

    .enter {
      margin-top: 28px;

      display: inline-flex;

      align-items: center;
      gap: 12px;

      padding: 14px 17px 14px 21px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.94);

      color: #34283c;

      text-decoration: none;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: 0.10em;
      text-transform: uppercase;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.22);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .enter:hover {
      transform: translateY(-3px);
      background: #fff;
    }

    .arrow {
      width: 29px;
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(70, 45, 82, 0.10);

      font-size: 14px;
    }

    /* =====================================================
       SOUND BUTTON
    ===================================================== */

    .sound-button {
      position: absolute;

      z-index: 20;

      left: 24px;
      bottom: 24px;

      width: 44px;
      height: 44px;

      border: 1px solid rgba(255,255,255,0.30);

      border-radius: 50%;

      background: rgba(0,0,0,0.22);

      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      font-size: 17px;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 8px 25px rgba(0,0,0,0.18);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .sound-button:hover {
      transform: scale(1.06);
      background: rgba(0,0,0,0.35);
    }

    .sound-label {
      position: absolute;

      left: 52px;
      bottom: 0;

      height: 44px;

      display: flex;
      align-items: center;

      white-space: nowrap;

      font-size: 8px;
      font-weight: 700;

      letter-spacing: 0.12em;
      text-transform: uppercase;

      color: rgba(255,255,255,0.72);

      opacity: 0;

      pointer-events: none;

      transform: translateX(-5px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .sound-control:hover .sound-label {
      opacity: 1;
      transform: translateX(0);
    }

    /* =====================================================
       CURRENT TIME PERIOD
    ===================================================== */

    .time-label {
      position: absolute;

      z-index: 10;

      right: 24px;
      bottom: 24px;

      font-size: 8px;
      font-weight: 700;

      letter-spacing: 0.16em;
      text-transform: uppercase;

      color: rgba(255,255,255,0.62);

      text-shadow:
        0 2px 10px rgba(0,0,0,0.40);
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      position: absolute;

      z-index: 30;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #10131d;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-text {
      font-family: Georgia, serif;

      font-size: 21px;

      letter-spacing: 0.38em;

      margin-left: 0.38em;

      color: rgba(255,255,255,0.90);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .top {
        padding-left: 16px;
        padding-right: 16px;
      }

      .aksh-icon {
        width: 43px;
        height: 43px;
      }

      .day {
        font-size: 8px;
      }

      .date {
        font-size: 8px;
      }

      .center {
        width: calc(100% - 30px);
      }

      .wish {
        font-size: clamp(48px, 14vw, 70px);
      }

      .message {
        max-width: 330px;
        font-size: 18px;
      }

      .sub-message {
        max-width: 320px;
        font-size: 10px;
      }

      .sound-button {
        left: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
      }

      .sound-label {
        display: none;
      }

      .time-label {
        display: none;
      }
    }

    @media (max-width: 360px) {

      .wish {
        font-size: 44px;
      }

      .message {
        font-size: 16px;
      }

      .enter {
        margin-top: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #backgroundVideo,
      .wish {
        transition: none;
      }
    }
  </style>
</head>

<body>

<section class="arrival">

  <!-- ===================================================
       ONE VIDEO ELEMENT ONLY
  ==================================================== -->

  <div class="video-background">

    <video
      id="backgroundVideo"
      muted
      playsinline
      preload="auto"
    ></video>

    <div class="video-overlay"></div>

    <div class="soft-atmosphere"></div>

  </div>


  <!-- ===================================================
       LOADING
  ==================================================== -->

  <div
    class="loading"
    id="loading"
  >
    <div class="loading-text">
      AKSH
    </div>
  </div>


  <!-- ===================================================
       TOP
  ==================================================== -->

  <header class="top">

    <div class="top-inner">

      <img
        src="aksh-icon.PNG"
        alt="AKSH"
        class="aksh-icon"
      >

      <div class="date-box">

        <div
          class="day"
          id="day"
        ></div>

        <div
          class="date"
          id="date"
        ></div>

      </div>

    </div>

  </header>


  <!-- ===================================================
       ARRIVAL MESSAGE
  ==================================================== -->

  <main class="center">

    <div class="welcome">
      Welcome to AKSH
    </div>

    <h1
      class="wish"
      id="wish"
    >
      Good Morning
    </h1>

    <div
      class="message"
      id="message"
    >
      May today feel a little lighter.
    </div>

    <p class="sub-message">
      Take a breath before you begin.
      There is no rush here.
      You can arrive exactly as you are.
    </p>

    <a
      href="page1.html"
      class="enter"
    >
      Enter AKSH

      <span class="arrow">
        →
      </span>
    </a>

  </main>


  <!-- ===================================================
       SOUND CONTROL
  ==================================================== -->

  <div class="sound-control">

    <button
      type="button"
      class="sound-button"
      id="soundButton"
      aria-label="Turn sound on"
      title="Turn sound on"
    >
      🔇
    </button>

    <span
      class="sound-label"
      id="soundLabel"
    >
      Sound Off
    </span>

  </div>


  <!-- ===================================================
       TIME PERIOD
  ==================================================== -->

  <div
    class="time-label"
    id="timeLabel"
  >
    MORNING
  </div>

</section>


<script>

/* =========================================================
   AKSH PAGE 0
   TIME-BASED VIDEO SYSTEM
========================================================= */


/* =========================================================
   VIDEO FILES
========================================================= */

const VIDEO_GROUPS = {

  morning: [
    "aksh-morning.1.mov",
    "aksh-morning.2.mov",
    "aksh-morning.3.mov",
    "aksh-morning.4.mov"
  ],

  afternoon: [
    "aksh-afternoon.1.mov",
    "aksh-afternoon.2.mov",
    "aksh-afternoon.3.mov",
    "aksh-afternoon.4.mov"
  ],

  evening: [
    "aksh-evening.1.mov",
    "aksh-evening.2.mov",
    "aksh-evening.3.mov"
  ],

  night: [
    "aksh-night.1.mov",
    "aksh-night.2.mov"
  ]

};


/* =========================================================
   TIME WINDOWS
=========================================================

   MORNING
   05:00 AM – 11:59 AM

   AFTERNOON
   12:00 PM – 04:59 PM

   EVENING
   05:00 PM – 07:59 PM

   NIGHT
   08:00 PM – 04:59 AM
========================================================= */

const PERIOD_WINDOWS = {

  morning: {
    start: 5 * 60,
    end: 12 * 60
  },

  afternoon: {
    start: 12 * 60,
    end: 17 * 60
  },

  evening: {
    start: 17 * 60,
    end: 20 * 60
  },

  night: {
    start: 20 * 60,
    end: 24 * 60
  }

};


/* =========================================================
   PAGE ELEMENTS
========================================================= */

const video =
  document.getElementById("backgroundVideo");

const loading =
  document.getElementById("loading");

const wish =
  document.getElementById("wish");

const message =
  document.getElementById("message");

const day =
  document.getElementById("day");

const date =
  document.getElementById("date");

const timeLabel =
  document.getElementById("timeLabel");

const soundButton =
  document.getElementById("soundButton");

const soundLabel =
  document.getElementById("soundLabel");


/* =========================================================
   STATE
========================================================= */

let activePeriod = null;

let activeVideoIndex = -1;

let activePlaylist = [];

let isSwitchingVideo = false;


/*
   Sound preference.

   Default = MUTED.

   The visitor can turn sound ON with the button.
*/

let soundEnabled = false;


/* =========================================================
   GET MINUTES SINCE MIDNIGHT
========================================================= */

function getMinutesNow() {

  const now = new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );

}


/* =========================================================
   GET TIME PERIOD
========================================================= */

function getCurrentPeriod() {

  const minutes =
    getMinutesNow();


  /*
    00:00 – 04:59
    = NIGHT
  */

  if (minutes < 5 * 60) {
    return "night";
  }


  /*
    05:00 – 11:59
    = MORNING
  */

  if (minutes < 12 * 60) {
    return "morning";
  }


  /*
    12:00 – 16:59
    = AFTERNOON
  */

  if (minutes < 17 * 60) {
    return "afternoon";
  }


  /*
    17:00 – 19:59
    = EVENING
  */

  if (minutes < 20 * 60) {
    return "evening";
  }


  /*
    20:00 – 23:59
    = NIGHT
  */

  return "night";

}


/* =========================================================
   GET VIDEO FOR CURRENT TIME
=========================================================

   IMPORTANT:

   Each video stays for the exact time window
   you specified.

   The video itself is only 4 seconds long,
   so it loops during its assigned time window.

========================================================= */

function getVideoForCurrentTime(period) {

  const minutes =
    getMinutesNow();


  if (period === "morning") {

    /*
      05:00 – 06:00
      Video 1
    */

    if (minutes < 6 * 60) {
      return 0;
    }


    /*
      06:00 – 08:00
      Video 2
    */

    if (minutes < 8 * 60) {
      return 1;
    }


    /*
      08:00 – 10:00
      Video 3
    */

    if (minutes < 10 * 60) {
      return 2;
    }


    /*
      10:00 – 11:59
      Video 4
    */

    return 3;

  }


  if (period === "afternoon") {

    /*
      12:00 – 01:00
      Video 1
    */

    if (minutes < 13 * 60) {
      return 0;
    }


    /*
      01:00 – 02:30
      Video 2
    */

    if (minutes < 14 * 60 + 30) {
      return 1;
    }


    /*
      02:30 – 04:00
      Video 3
    */

    if (minutes < 16 * 60) {
      return 2;
    }


    /*
      04:00 – 04:59
      Video 4
    */

    return 3;

  }


  if (period === "evening") {

    /*
      05:00 – 05:45
      Video 1
    */

    if (minutes < 17 * 60 + 45) {
      return 0;
    }


    /*
      05:45 – 07:00
      Video 2
    */

    if (minutes < 19 * 60) {
      return 1;
    }


    /*
      07:00 – 07:59
      Video 3
    */

    return 2;

  }


  /*
    NIGHT
  */

  /*
    08:00 PM – 11:59 PM
    Video 1
  */

  if (minutes >= 20 * 60) {
    return 0;
  }


  /*
    12:00 AM – 04:59 AM
    Video 2
  */

  return 1;

}


/* =========================================================
   GREETING TEXT
========================================================= */

function updateGreeting(period) {

  wish.classList.add("changing");


  setTimeout(() => {

    if (period === "morning") {

      wish.textContent =
        "Good Morning";

      message.textContent =
        "May today feel a little lighter.";

      timeLabel.textContent =
        "MORNING";

    }


    else if (period === "afternoon") {

      wish.textContent =
        "Good Afternoon";

      message.textContent =
        "Take a moment to breathe and be present.";

      timeLabel.textContent =
        "AFTERNOON";

    }


    else if (period === "evening") {

      wish.textContent =
        "Good Evening";

      message.textContent =
        "Let the day slow down around you.";

      timeLabel.textContent =
        "EVENING";

    }


    else {

      wish.textContent =
        "Good Night";

      message.textContent =
        "May tonight bring you some peace.";

      timeLabel.textContent =
        "NIGHT";

    }


    wish.classList.remove("changing");

  }, 350);

}


/* =========================================================
   DATE + DAY
========================================================= */

function updateDate() {

  const now = new Date();


  day.textContent =
    now
      .toLocaleDateString(
        undefined,
        {
          weekday: "long"
        }
      )
      .toUpperCase();


  date.textContent =
    now
      .toLocaleDateString(
        undefined,
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      )
      .toUpperCase();

}


/* =========================================================
   LOAD ONE VIDEO
========================================================= */

function loadVideo(videoIndex) {

  if (
    !activePlaylist.length ||
    isSwitchingVideo
  ) {
    return;
  }


  const file =
    activePlaylist[videoIndex];


  if (!file) {
    return;
  }


  isSwitchingVideo = true;


  /*
    STOP CURRENT VIDEO COMPLETELY.
  */

  video.pause();


  /*
    Remove old media source.
  */

  video.removeAttribute("src");


  /*
    Reset media element.
  */

  video.load();


  /*
    Hide during source change.
  */

  video.classList.remove("ready");


  /*
    Set ONLY ONE source.
  */

  video.src = file;


  /*
    Load new source.
  */

  video.load();


  /*
    Wait for the new video to become playable.
  */

  const handleReady = () => {

    video.removeEventListener(
      "canplay",
      handleReady
    );


    /*
      Apply sound state.
    */

    video.muted =
      !soundEnabled;


    /*
      Start exactly this video.
    */

    const playPromise =
      video.play();


    if (
      playPromise &&
      typeof playPromise.then === "function"
    ) {

      playPromise
        .catch(() => {})
        .finally(() => {

          video.classList.add("ready");

          loading.classList.add("hidden");

          isSwitchingVideo = false;

        });

    }

    else {

      video.classList.add("ready");

      loading.classList.add("hidden");

      isSwitchingVideo = false;

    }

  };


  video.addEventListener(
    "canplay",
    handleReady,
    {
      once: true
    }
  );

}


/* =========================================================
   VIDEO ENDED
=========================================================

   IMPORTANT:

   We DO NOT move to another video when a 4-second
   video ends.

   We simply replay the same assigned video.

   Example:

   05:00–06:00
   morning.1 plays
   ↓
   ends after 4 sec
   ↓
   morning.1 plays again
   ↓
   continues until 06:00

========================================================= */

video.addEventListener(
  "ended",
  () => {

    if (isSwitchingVideo) {
      return;
    }


    /*
      Check whether the time has moved
      into a different video window.
    */

    const period =
      getCurrentPeriod();

    const correctIndex =
      getVideoForCurrentTime(period);


    /*
      If the assigned video has not changed,
      replay the SAME video.
    */

    if (
      period === activePeriod &&
      correctIndex === activeVideoIndex
    ) {

      video.currentTime = 0;

      video.play().catch(() => {});

      return;

    }


    /*
      Otherwise load the newly scheduled video.
    */

    changeScheduledVideo(
      period,
      correctIndex
    );

  }
);


/* =========================================================
   CHANGE SCHEDULED VIDEO
========================================================= */

function changeScheduledVideo(
  period,
  videoIndex
) {

  if (
    !VIDEO_GROUPS[period]
  ) {
    return;
  }


  const playlist =
    VIDEO_GROUPS[period];


  if (
    !playlist[videoIndex]
  ) {
    return;
  }


  activePeriod =
    period;

  activePlaylist =
    playlist;

  activeVideoIndex =
    videoIndex;


  loadVideo(videoIndex);

}


/* =========================================================
   CHECK SCHEDULE
========================================================= */

function checkSchedule() {

  const period =
    getCurrentPeriod();


  const videoIndex =
    getVideoForCurrentTime(
      period
    );


  /*
    Update greeting when period changes.
  */

  if (
    period !== activePeriod
  ) {

    activePeriod =
      period;

    activePlaylist =
      VIDEO_GROUPS[period];

    updateGreeting(period);

  }


  /*
    Change video only when its
    assigned time window changes.
  */

  if (
    videoIndex !== activeVideoIndex ||
    video.src === ""
  ) {

    activePlaylist =
      VIDEO_GROUPS[period];

    activeVideoIndex =
      videoIndex;

    loadVideo(videoIndex);

  }

}


/* =========================================================
   SOUND CONTROL
========================================================= */

function updateSoundUI() {

  if (soundEnabled) {

    soundButton.textContent =
      "🔊";

    soundButton.setAttribute(
      "aria-label",
      "Mute sound"
    );

    soundButton.setAttribute(
      "title",
      "Mute sound"
    );

    soundLabel.textContent =
      "Sound On";

  }

  else {

    soundButton.textContent =
      "🔇";

    soundButton.setAttribute(
      "aria-label",
      "Turn sound on"
    );

    soundButton.setAttribute(
      "title",
      "Turn sound on"
    );

    soundLabel.textContent =
      "Sound Off";

  }

}


/*
  Sound starts MUTED because browsers,
  especially iPhone/iPad browsers, normally
  block autoplay with sound.
*/

soundButton.addEventListener(
  "click",
  () => {

    soundEnabled =
      !soundEnabled;


    video.muted =
      !soundEnabled;


    updateSoundUI();


    /*
      When the user explicitly taps the button,
      the browser allows audio playback.
    */

    if (
      video.paused
    ) {

      video.play().catch(() => {});

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

updateDate();

updateSoundUI();

checkSchedule();


/* =========================================================
   CHECK TIME EVERY SECOND
=========================================================

   This makes transitions exact even if the page
   remains open around a boundary such as:

   05:59:59 → 06:00:00
   07:59:59 → 08:00:00
   19:59:59 → 20:00:00

========================================================= */

setInterval(
  () => {

    updateDate();

    checkSchedule();

  },
  1000
);


/* =========================================================
   MOBILE / IOS PLAYBACK RECOVERY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden &&
      video.src &&
      video.paused
    ) {

      video.muted =
        !soundEnabled;

      video.play().catch(() => {});

    }

  }
);


/* =========================================================
   VIDEO ERROR RECOVERY
========================================================= */

video.addEventListener(
  "error",
  () => {

    isSwitchingVideo = false;

    loading.classList.add("hidden");

  }
);

</script>

</body>
</html>
