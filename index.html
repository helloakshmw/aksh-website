<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#dcecff">
  <meta name="description" content="AKSH — A Safe Space For Every Mind">

  <title>AKSH</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #273344;
    }

    button,
    a {
      font: inherit;
    }

    /* =====================================================
       ARRIVAL PAGE
    ===================================================== */

    .arrival {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #b8d8f1 0%,
          #dcecf8 48%,
          #f8e7d9 100%
        );
    }

    /* =====================================================
       SOFT MORNING LIGHT
    ===================================================== */

    .sun-glow {
      position: absolute;
      width: min(48vw, 560px);
      height: min(48vw, 560px);

      right: -8%;
      top: -18%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 248, 214, 0.95) 0%,
          rgba(255, 231, 176, 0.55) 38%,
          rgba(255, 231, 176, 0) 72%
        );

      filter: blur(3px);
    }

    /* =====================================================
       CLOUDS
    ===================================================== */

    .cloud {
      position: absolute;

      width: 330px;
      height: 82px;

      border-radius: 100px;

      background: rgba(255, 255, 255, 0.72);

      filter: blur(2px);

      opacity: 0.72;

      animation: drift 55s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      background: inherit;
    }

    .cloud::before {
      width: 120px;
      height: 120px;

      left: 45px;
      bottom: 22px;
    }

    .cloud::after {
      width: 145px;
      height: 145px;

      right: 45px;
      bottom: 10px;
    }

    .cloud-1 {
      top: 16%;
      left: -360px;
    }

    .cloud-2 {
      top: 42%;
      left: -440px;

      transform: scale(0.65);

      animation-duration: 72s;
      animation-delay: -25s;
    }

    .cloud-3 {
      top: 64%;
      left: -400px;

      transform: scale(0.48);

      animation-duration: 88s;
      animation-delay: -50s;
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(calc(100vw + 800px));
      }
    }

    /* =====================================================
       TOP INFORMATION
    ===================================================== */

    .top {
      position: absolute;
      z-index: 5;

      top: 0;
      left: 0;
      right: 0;

      padding:
        max(22px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        0
        max(22px, env(safe-area-inset-left));
    }

    .top-inner {
      width: min(1180px, 100%);
      margin: auto;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    /* =====================================================
       AKSH ICON
    ===================================================== */

    .aksh-icon {
      width: 52px;
      height: 52px;

      object-fit: contain;

      display: block;
    }

    /* =====================================================
       DATE / DAY
    ===================================================== */

    .date-box {
      text-align: right;
      color: #354052;
    }

    .day {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .date {
      margin-top: 5px;

      font-size: 10px;

      opacity: 0.65;
    }

    /* =====================================================
       CENTER ARRIVAL CONTENT
    ===================================================== */

    .center {
      position: relative;
      z-index: 4;

      min-height: 100svh;

      width: min(900px, calc(100% - 36px));

      margin: auto;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        100px 0
        max(50px, env(safe-area-inset-bottom));
    }

    .welcome-small {
      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.28em;

      text-transform: uppercase;

      color: #526377;

      margin-bottom: 20px;
    }

    .wish {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(54px, 9vw, 108px);

      line-height: 0.92;

      font-weight: 400;

      letter-spacing: -0.055em;

      color: #273344;
    }

    .name-line {
      margin-top: 18px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(21px, 3vw, 32px);

      font-style: italic;

      color: #657083;
    }

    .message {
      max-width: 480px;

      margin-top: 22px;

      font-size: 12px;

      line-height: 1.75;

      color: #617083;
    }

    /* =====================================================
       ENTER
    ===================================================== */

    .enter {
      margin-top: 32px;

      display: inline-flex;

      align-items: center;

      gap: 12px;

      border: 0;

      border-radius: 999px;

      padding: 14px 17px 14px 21px;

      background: rgba(255, 255, 255, 0.76);

      color: #3f5065;

      text-decoration: none;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 0.1em;

      text-transform: uppercase;

      box-shadow:
        0 15px 40px rgba(63, 80, 101, 0.12);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .enter:hover {
      transform: translateY(-3px);

      background: rgba(255, 255, 255, 0.95);
    }

    .arrow {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      font-size: 14px;
    }

    /* =====================================================
       BOTTOM
    ===================================================== */

    .bottom {
      position: absolute;

      z-index: 5;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        0
        max(22px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
    }

    .bottom-inner {
      width: min(1180px, 100%);
      margin: auto;

      display: flex;

      justify-content: space-between;
      align-items: center;

      color: rgba(49, 61, 78, 0.55);

      font-size: 8px;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    .bottom-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #7894b1;
    }

    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 700px) {

      .aksh-icon {
        width: 45px;
        height: 45px;
      }

      .center {
        width: calc(100% - 30px);
      }

      .wish {
        font-size: clamp(48px, 14vw, 76px);
      }

      .message {
        max-width: 360px;
      }

      .cloud {
        transform: scale(0.72);
      }
    }

    /* =====================================================
       PHONE
    ===================================================== */

    @media (max-width: 430px) {

      .top {
        padding-top: 17px;
        padding-left: 16px;
        padding-right: 16px;
      }

      .aksh-icon {
        width: 40px;
        height: 40px;
      }

      .day {
        font-size: 8px;
      }

      .date {
        font-size: 8px;
      }

      .center {
        width: calc(100% - 28px);

        padding-top: 85px;
      }

      .welcome-small {
        font-size: 8px;
        margin-bottom: 16px;
      }

      .wish {
        font-size: clamp(45px, 14vw, 62px);
      }

      .name-line {
        font-size: 20px;
      }

      .message {
        font-size: 11px;
        line-height: 1.7;
      }

      .enter {
        margin-top: 27px;
      }

      .bottom {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    @media (max-width: 350px) {

      .wish {
        font-size: 43px;
      }

      .message {
        max-width: 290px;
      }
    }

    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .cloud {
        animation: none;
      }

      .enter {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <section class="arrival">

    <!-- MORNING SKY -->
    <div class="sun-glow"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>


    <!-- TOP -->
    <header class="top">

      <div class="top-inner">

        <img
          src="aksh-icon.PNG"
          alt="AKSH"
          class="aksh-icon"
        >

        <div class="date-box">

          <div
            class="day"
            id="day"
          >
            MONDAY
          </div>

          <div
            class="date"
            id="date"
          >
            11 AUGUST 2026
          </div>

        </div>

      </div>

    </header>


    <!-- ARRIVAL MESSAGE -->
    <main class="center">

      <div class="welcome-small">
        Welcome to AKSH
      </div>

      <h1
        class="wish"
        id="wish"
      >
        Good Morning
      </h1>

      <div
        class="name-line"
        id="nameLine"
      >
        May today feel a little lighter.
      </div>

      <p class="message">
        Take a breath before you begin.
        There is no rush here.
        You can arrive exactly as you are.
      </p>

      <a
        href="page1.html"
        class="enter"
      >
        Enter AKSH

        <span class="arrow">
          →
        </span>
      </a>

    </main>


    <!-- BOTTOM -->
    <footer class="bottom">

      <div class="bottom-inner">

        <span>
          A Safe Space For Every Mind
        </span>

        <span class="bottom-dot"></span>

      </div>

    </footer>

  </section>


  <script>

    /*
      PAGE 0
      Arrival greeting changes automatically
      according to the visitor's local time.
    */

    function updateArrivalGreeting() {

      const now = new Date();

      const hour = now.getHours();

      const wish = document.getElementById("wish");
      const nameLine = document.getElementById("nameLine");

      if (hour >= 5 && hour < 12) {

        wish.textContent = "Good Morning";

        nameLine.textContent =
          "May today feel a little lighter.";

      }

      else if (hour >= 12 && hour < 17) {

        wish.textContent = "Good Afternoon";

        nameLine.textContent =
          "Take a moment to breathe and be present.";

      }

      else if (hour >= 17 && hour < 20) {

        wish.textContent = "Good Evening";

        nameLine.textContent =
          "Let the day slow down around you.";

      }

      else {

        wish.textContent = "Good Night";

        nameLine.textContent =
          "May tonight bring you some peace.";

      }


      document.getElementById("day").textContent =
        now
          .toLocaleDateString(
            undefined,
            {
              weekday: "long"
            }
          )
          .toUpperCase();


      document.getElementById("date").textContent =
        now
          .toLocaleDateString(
            undefined,
            {
              day: "numeric",
              month: "long",
              year: "numeric"
            }
          )
          .toUpperCase();

    }


    updateArrivalGreeting();


    /*
      Keeps the greeting/date correct if the page
      remains open across a time change.
    */

    setInterval(
      updateArrivalGreeting,
      60000
    );

  </script>

</body>
</html>
