<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#10131d">
  <meta name="description" content="AKSH — A Safe Space For Every Mind">

  <title>AKSH</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #10131d;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .arrival {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background: #10131d;
      isolation: isolate;
    }

    /* =====================================================
       SINGLE VIDEO BACKGROUND
    ===================================================== */

    .video-background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10131d;
    }

    #backgroundVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      display: block;

      opacity: 0;

      transition: opacity 1s ease;
    }

    #backgroundVideo.ready {
      opacity: 1;
    }

    /* =====================================================
       VIDEO READABILITY OVERLAY
    ===================================================== */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.27) 0%,
          rgba(0, 0, 0, 0.03) 38%,
          rgba(0, 0, 0, 0.12) 60%,
          rgba(0, 0, 0, 0.48) 100%
        );
    }

    .soft-light {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255,255,255,0.08),
          transparent 45%
        );
    }

    /* =====================================================
       TOP
    ===================================================== */

    .top {
      position: absolute;
      z-index: 10;

      top: 0;
      left: 0;
      right: 0;

      padding:
        max(20px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        0
        max(22px, env(safe-area-inset-left));
    }

    .top-inner {
      width: min(1180px, 100%);
      margin: 0 auto;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .aksh-icon {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;

      filter:
        drop-shadow(0 3px 12px rgba(0,0,0,0.3));
    }

    .date-box {
      text-align: right;

      text-shadow:
        0 2px 14px rgba(0,0,0,0.35);
    }

    .day {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .date {
      margin-top: 5px;

      font-size: 9px;
      letter-spacing: 0.05em;

      opacity: 0.8;
    }

    /* =====================================================
       CENTER
    ===================================================== */

    .center {
      position: relative;
      z-index: 10;

      width: min(900px, calc(100% - 36px));
      height: 100svh;

      margin: auto;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        100px 0
        max(40px, env(safe-area-inset-bottom));
    }

    .welcome {
      margin-bottom: 18px;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: 0.28em;
      text-transform: uppercase;

      color: rgba(255,255,255,0.9);

      text-shadow:
        0 2px 15px rgba(0,0,0,0.4);
    }

    .wish {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(55px, 9vw, 110px);

      line-height: 0.88;

      font-weight: 400;

      letter-spacing: -0.055em;

      color: #ffffff;

      text-shadow:
        0 4px 30px rgba(0,0,0,0.3);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    .wish.changing {
      opacity: 0;
      transform: translateY(8px);
    }

    .message {
      max-width: 490px;

      margin-top: 21px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(17px, 2.5vw, 24px);

      line-height: 1.35;

      color: rgba(255,255,255,0.94);

      text-shadow:
        0 3px 20px rgba(0,0,0,0.35);
    }

    .sub-message {
      max-width: 420px;

      margin-top: 14px;

      font-size: 11px;
      line-height: 1.7;

      color: rgba(255,255,255,0.8);

      text-shadow:
        0 2px 12px rgba(0,0,0,0.4);
    }

    /* =====================================================
       ENTER
    ===================================================== */

    .enter {
      margin-top: 28px;

      display: inline-flex;
      align-items: center;
      gap: 12px;

      padding: 14px 17px 14px 21px;

      border-radius: 999px;

      background: rgba(255,255,255,0.94);

      color: #34283c;

      text-decoration: none;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: 0.1em;
      text-transform: uppercase;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.22);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .enter:hover {
      transform: translateY(-3px);
      background: #ffffff;
    }

    .arrow {
      width: 29px;
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(70,45,82,0.1);

      font-size: 14px;
    }

    /* =====================================================
       ATMOSPHERE LABEL
    ===================================================== */

    .time-label {
      position: absolute;
      z-index: 10;

      right: 24px;
      bottom: 24px;

      font-size: 8px;
      font-weight: 700;

      letter-spacing: 0.16em;
      text-transform: uppercase;

      color: rgba(255,255,255,0.62);

      text-shadow:
        0 2px 10px rgba(0,0,0,0.4);
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      position: absolute;
      z-index: 30;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #10131d;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-text {
      font-family: Georgia, serif;

      font-size: 21px;

      letter-spacing: 0.38em;

      margin-left: 0.38em;

      color: rgba(255,255,255,0.9);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .top {
        padding-left: 16px;
        padding-right: 16px;
      }

      .aksh-icon {
        width: 43px;
        height: 43px;
      }

      .day {
        font-size: 8px;
      }

      .date {
        font-size: 8px;
      }

      .center {
        width: calc(100% - 30px);
      }

      .wish {
        font-size: clamp(48px, 14vw, 70px);
      }

      .message {
        max-width: 330px;
        font-size: 18px;
      }

      .sub-message {
        max-width: 320px;
        font-size: 10px;
      }

      .time-label {
        display: none;
      }
    }

    @media (max-width: 360px) {

      .wish {
        font-size: 44px;
      }

      .message {
        font-size: 16px;
      }

      .enter {
        margin-top: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #backgroundVideo,
      .wish {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <section class="arrival">

    <!-- ===================================================
         ONE VIDEO ELEMENT ONLY
    ==================================================== -->

    <div class="video-background">

      <video
        id="backgroundVideo"
        muted
        playsinline
        preload="auto"
      ></video>

      <div class="overlay"></div>
      <div class="soft-light"></div>

    </div>


    <!-- ===================================================
         LOADING
    ==================================================== -->

    <div
      class="loading"
      id="loading"
    >
      <div class="loading-text">
        AKSH
      </div>
    </div>


    <!-- ===================================================
         TOP
    ==================================================== -->

    <header class="top">

      <div class="top-inner">

        <img
          src="aksh-icon.PNG"
          alt="AKSH"
          class="aksh-icon"
        >

        <div class="date-box">

          <div
            class="day"
            id="day"
          ></div>

          <div
            class="date"
            id="date"
          ></div>

        </div>

      </div>

    </header>


    <!-- ===================================================
         ARRIVAL
    ==================================================== -->

    <main class="center">

      <div class="welcome">
        Welcome to AKSH
      </div>

      <h1
        class="wish"
        id="wish"
      >
        Good Morning
      </h1>

      <div
        class="message"
        id="message"
      >
        May today feel a little lighter.
      </div>

      <p class="sub-message">
        Take a breath before you begin.
        There is no rush here.
        You can arrive exactly as you are.
      </p>

      <a
        href="page1.html"
        class="enter"
      >
        Enter AKSH

        <span class="arrow">
          →
        </span>
      </a>

    </main>


    <!-- ===================================================
         PERIOD
    ==================================================== -->

    <div
      class="time-label"
      id="timeLabel"
    >
      MORNING
    </div>

  </section>


  <script>

    /* =====================================================
       VIDEO FILES
    ===================================================== */

    const VIDEO_GROUPS = {

      morning: [
        "aksh-morning.1.mov",
        "aksh-morning.2.mov",
        "aksh-morning.3.mov",
        "aksh-morning.4.mov"
      ],

      afternoon: [
        "aksh-afternoon.1.mov",
        "aksh-afternoon.2.mov",
        "aksh-afternoon.3.mov",
        "aksh-afternoon.4.mov"
      ],

      evening: [
        "aksh-evening.1.mov",
        "aksh-evening.2.mov",
        "aksh-evening.3.mov"
      ],

      night: [
        "aksh-night.1.mov",
        "aksh-night.2.mov"
      ]

    };


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const video =
      document.getElementById("backgroundVideo");

    const loading =
      document.getElementById("loading");

    const wish =
      document.getElementById("wish");

    const message =
      document.getElementById("message");

    const timeLabel =
      document.getElementById("timeLabel");

    const day =
      document.getElementById("day");

    const date =
      document.getElementById("date");


    /* =====================================================
       STATE
    ===================================================== */

    let activePeriod = null;

    let activePlaylist = [];

    let activeIndex = 0;

    let changingVideo = false;


    /* =====================================================
       DETERMINE TIME PERIOD
    ===================================================== */

    function getCurrentPeriod() {

      const now = new Date();

      const hour = now.getHours();

      const minute = now.getMinutes();


      if (hour >= 5 && hour < 12) {
        return "morning";
      }


      if (hour >= 12 && hour < 17) {
        return "afternoon";
      }


      if (
        hour >= 17 &&
        (
          hour < 19 ||
          (hour === 19 && minute < 30)
        )
      ) {
        return "evening";
      }


      return "night";

    }


    /* =====================================================
       UPDATE DATE
    ===================================================== */

    function updateDate() {

      const now = new Date();


      day.textContent =
        now.toLocaleDateString(
          undefined,
          {
            weekday: "long"
          }
        ).toUpperCase();


      date.textContent =
        now.toLocaleDateString(
          undefined,
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        ).toUpperCase();

    }


    /* =====================================================
       UPDATE GREETING
    ===================================================== */

    function updateGreeting(period) {

      wish.classList.add("changing");


      setTimeout(() => {

        if (period === "morning") {

          wish.textContent = "Good Morning";

          message.textContent =
            "May today feel a little lighter.";

          timeLabel.textContent =
            "MORNING";

        }


        else if (period === "afternoon") {

          wish.textContent = "Good Afternoon";

          message.textContent =
            "Take a moment to breathe and be present.";

          timeLabel.textContent =
            "AFTERNOON";

        }


        else if (period === "evening") {

          wish.textContent = "Good Evening";

          message.textContent =
            "Let the day slow down around you.";

          timeLabel.textContent =
            "EVENING";

        }


        else {

          wish.textContent = "Good Night";

          message.textContent =
            "May tonight bring you some peace.";

          timeLabel.textContent =
            "NIGHT";

        }


        wish.classList.remove("changing");

      }, 400);

    }


    /* =====================================================
       PLAY ONE VIDEO
       
       IMPORTANT:
       - Stop current video
       - Clear old source
       - Assign ONE new source
       - Load
       - Play
       
       There is NEVER a second video element.
    ===================================================== */

    function playVideo(index) {

      if (
        changingVideo ||
        !activePlaylist.length
      ) {
        return;
      }


      changingVideo = true;


      const nextFile =
        activePlaylist[index];


      /*
        Completely stop the currently playing video.
      */

      video.pause();


      /*
        Remove the old media source.
      */

      video.removeAttribute("src");

      video.load();


      /*
        Small fade while switching.
      */

      video.classList.remove("ready");


      /*
        Set ONLY the next file.
      */

      video.src = nextFile;

      video.load();


      /*
        Wait until the new video can actually play.
      */

      const startNewVideo = () => {

        video.removeEventListener(
          "canplay",
          startNewVideo
        );


        const promise =
          video.play();


        if (promise) {

          promise
            .catch(() => {})
            .finally(() => {

              video.classList.add("ready");

              loading.classList.add("hidden");

              changingVideo = false;

            });

        }

        else {

          video.classList.add("ready");

          loading.classList.add("hidden");

          changingVideo = false;

        }

      };


      video.addEventListener(
        "canplay",
        startNewVideo,
        {
          once: true
        }
      );

    }


    /* =====================================================
       VIDEO ENDED
       
       Move to the next file only after the current
       video has completely ended.
    ===================================================== */

    video.addEventListener(
      "ended",
      () => {

        if (!activePlaylist.length) {
          return;
        }


        if (changingVideo) {
          return;
        }


        activeIndex++;


        if (
          activeIndex >=
          activePlaylist.length
        ) {

          activeIndex = 0;

        }


        playVideo(activeIndex);

      }
    );


    /* =====================================================
       CHANGE PERIOD
    ===================================================== */

    function updatePeriod() {

      const period =
        getCurrentPeriod();


      updateDate();


      /*
        Nothing changes if we're still
        inside the same period.
      */

      if (period === activePeriod) {
        return;
      }


      activePeriod = period;


      activePlaylist =
        VIDEO_GROUPS[period];


      activeIndex = 0;


      updateGreeting(period);


      /*
        Only now change the video.
      */

      playVideo(activeIndex);

    }


    /* =====================================================
       START PAGE
    ===================================================== */

    updateDate();

    updatePeriod();


    /* =====================================================
       CHECK TIME EVERY MINUTE
    ===================================================== */

    setInterval(
      updatePeriod,
      60000
    );


    /* =====================================================
       MOBILE AUTOPLAY RECOVERY
    ===================================================== */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          !document.hidden &&
          video.paused &&
          video.src
        ) {

          video.play().catch(() => {});

        }

      }
    );


    /* =====================================================
       IF VIDEO LOAD FAILS
    ===================================================== */

    video.addEventListener(
      "error",
      () => {

        changingVideo = false;

        /*
          Try the next video instead of leaving
          the screen broken.
        */

        if (activePlaylist.length > 1) {

          activeIndex++;

          if (
            activeIndex >=
            activePlaylist.length
          ) {
            activeIndex = 0;
          }

          setTimeout(
            () => playVideo(activeIndex),
            800
          );

        }

      }
    );

  </script>

</body>
</html>
