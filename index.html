<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10131d">
  <meta name="description" content="AKSH — A Safe Space For Every Mind">
  <title>AKSH</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #10131d;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .arrival {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100vh;
      overflow: hidden;
      background: #10131d;
      isolation: isolate;
    }

    /* ================= VIDEO ================= */

    .video-background {
      position: absolute;
      inset: 0;
      z-index: -5;
      overflow: hidden;
      background: #10131d;
    }

    #backgroundVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #backgroundVideo.ready {
      opacity: 1;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.20) 0%,
          rgba(0,0,0,0.01) 40%,
          rgba(0,0,0,0.08) 65%,
          rgba(0,0,0,0.42) 100%
        );
    }

    .soft-atmosphere {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(255,255,255,0.08),
          transparent 46%
        );
    }

    /* ================= TOP LEFT SOUND ================= */

    .sound-control {
      position: absolute;
      z-index: 30;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
    }

    .sound-button {
      width: 44px;
      height: 44px;

      border: 1px solid rgba(255,255,255,0.30);
      border-radius: 50%;

      background: rgba(0,0,0,0.24);
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      font-size: 17px;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 8px 25px rgba(0,0,0,0.18);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .sound-button:hover {
      transform: scale(1.06);
      background: rgba(0,0,0,0.36);
    }

    /* ================= TOP RIGHT DATE ================= */

    .date-box {
      position: absolute;
      z-index: 20;

      top: max(23px, env(safe-area-inset-top));
      right: max(22px, env(safe-area-inset-right));

      text-align: right;

      color: #fff;

      text-shadow:
        0 2px 14px rgba(0,0,0,0.35);
    }

    .day {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .date {
      margin-top: 5px;
      font-size: 9px;
      letter-spacing: 0.05em;
      opacity: 0.82;
    }

    /* ================= CENTER ================= */

    .center {
      position: relative;
      z-index: 10;

      width: min(900px, calc(100% - 36px));
      height: 100svh;

      margin: auto;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        80px 0
        max(70px, env(safe-area-inset-bottom));
    }

    /* ICON ABOVE WELCOME */

    .center-icon {
      width: 66px;
      height: 66px;

      object-fit: contain;

      margin-bottom: 14px;

      filter:
        drop-shadow(0 5px 18px rgba(0,0,0,0.30));
    }

    .welcome {
      margin-bottom: 17px;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 0.25em;
      text-transform: uppercase;

      color: rgba(255,255,255,0.92);

      text-shadow:
        0 2px 15px rgba(0,0,0,0.40);
    }

    .wish {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(52px, 8.5vw, 105px);

      line-height: 0.90;

      font-weight: 400;

      letter-spacing: -0.055em;

      color: #fff;

      text-shadow:
        0 4px 30px rgba(0,0,0,0.30);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    .wish.changing {
      opacity: 0;
      transform: translateY(8px);
    }

    /* SMALL QUOTE */

    .message {
      max-width: 470px;

      margin-top: 18px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(16px, 2.2vw, 21px);

      line-height: 1.45;

      color: rgba(255,255,255,0.94);

      text-shadow:
        0 3px 20px rgba(0,0,0,0.35);
    }

    .sub-message {
      display: none;
    }

    /* ================= BEGIN JOURNEY ================= */

    .enter {
      margin-top: 30px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      padding: 14px 18px 14px 22px;

      border-radius: 999px;

      background: rgba(255,255,255,0.95);

      color: #34283c;

      text-decoration: none;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: 0.12em;
      text-transform: uppercase;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.22);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .enter:hover {
      transform: translateY(-3px);
      background: #fff;
    }

    .arrow {
      width: 29px;
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(70,45,82,0.10);

      font-size: 14px;
    }

    /* ================= TIME LABEL ================= */

    .time-label {
      position: absolute;
      z-index: 10;

      right: 24px;
      bottom: 24px;

      font-size: 8px;
      font-weight: 700;

      letter-spacing: 0.16em;
      text-transform: uppercase;

      color: rgba(255,255,255,0.62);

      text-shadow:
        0 2px 10px rgba(0,0,0,0.40);
    }

    /* ================= LOADING ================= */

    .loading {
      position: absolute;
      z-index: 40;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #10131d;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-text {
      font-family: Georgia, serif;

      font-size: 21px;

      letter-spacing: 0.38em;
      margin-left: 0.38em;

      color: rgba(255,255,255,0.90);
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .sound-control {
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
      }

      .sound-button {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }

      .date-box {
        top: max(20px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
      }

      .day {
        font-size: 8px;
      }

      .date {
        font-size: 8px;
      }

      .center {
        width: calc(100% - 30px);
      }

      .center-icon {
        width: 55px;
        height: 55px;
        margin-bottom: 12px;
      }

      .welcome {
        font-size: 8px;
        margin-bottom: 15px;
      }

      .wish {
        font-size: clamp(46px, 13vw, 68px);
      }

      .message {
        max-width: 330px;
        font-size: 17px;
      }

      .enter {
        margin-top: 26px;
      }

      .time-label {
        display: none;
      }
    }

    @media (max-width: 360px) {

      .center-icon {
        width: 48px;
        height: 48px;
      }

      .wish {
        font-size: 43px;
      }

      .message {
        font-size: 15px;
      }

      .enter {
        margin-top: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #backgroundVideo,
      .wish {
        transition: none;
      }
    }
  </style>
</head>

<body>

<section class="arrival">

  <!-- ================= VIDEO ================= -->

  <div class="video-background">

    <video
      id="backgroundVideo"
      muted
      playsinline
      preload="auto"
    ></video>

    <div class="video-overlay"></div>

    <div class="soft-atmosphere"></div>

  </div>


  <!-- ================= SOUND TOP LEFT ================= -->

  <div class="sound-control">

    <button
      type="button"
      class="sound-button"
      id="soundButton"
      aria-label="Turn sound on"
      title="Turn sound on"
    >
      🔇
    </button>

  </div>


  <!-- ================= DATE TOP RIGHT ================= -->

  <div class="date-box">

    <div
      class="day"
      id="day"
    ></div>

    <div
      class="date"
      id="date"
    ></div>

  </div>


  <!-- ================= LOADING ================= -->

  <div
    class="loading"
    id="loading"
  >
    <div class="loading-text">
      AKSH
    </div>
  </div>


  <!-- ================= CENTER ================= -->

  <main class="center">

    <!-- AKSH ICON -->

    <img
      src="aksh-icon.PNG"
      alt="AKSH"
      class="center-icon"
    >


    <!-- WELCOME -->

    <div class="welcome">
      Welcome to AKSH
    </div>


    <!-- GREETING -->

    <h1
      class="wish"
      id="wish"
    >
      Good Morning
    </h1>


    <!-- SMALL QUOTE -->

    <div
      class="message"
      id="message"
    >
      May today feel a little lighter.
    </div>


    <!-- BEGIN JOURNEY -->

    <a
      href="page1.html"
      class="enter"
    >
      Begin Your Journey

      <span class="arrow">
        →
      </span>
    </a>

  </main>


  <!-- ================= TIME LABEL ================= -->

  <div
    class="time-label"
    id="timeLabel"
  >
    MORNING
  </div>

</section>


<script>

/* =========================================================
   VIDEO FILES
========================================================= */

const VIDEO_GROUPS = {

  morning: [
    "aksh-morning.1.mov",
    "aksh-morning.2.mov",
    "aksh-morning.3.mov",
    "aksh-morning.4.mov"
  ],

  afternoon: [
    "aksh-afternoon.1.mov",
    "aksh-afternoon.2.mov",
    "aksh-afternoon.3.mov",
    "aksh-afternoon.4.mov"
  ],

  evening: [
    "aksh-evening.1.mov",
    "aksh-evening.2.mov",
    "aksh-evening.3.mov"
  ],

  night: [
    "aksh-night.1.mov",
    "aksh-night.2.mov"
  ]

};


/* =========================================================
   ELEMENTS
========================================================= */

const video =
  document.getElementById("backgroundVideo");

const loading =
  document.getElementById("loading");

const wish =
  document.getElementById("wish");

const message =
  document.getElementById("message");

const day =
  document.getElementById("day");

const date =
  document.getElementById("date");

const timeLabel =
  document.getElementById("timeLabel");

const soundButton =
  document.getElementById("soundButton");


/* =========================================================
   STATE
========================================================= */

let activePeriod = null;

let activeVideoIndex = -1;

let activePlaylist = [];

let isSwitchingVideo = false;

let soundEnabled = false;


/* =========================================================
   CURRENT MINUTES
========================================================= */

function getMinutesNow() {

  const now = new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );

}


/* =========================================================
   CURRENT PERIOD
========================================================= */

function getCurrentPeriod() {

  const minutes =
    getMinutesNow();


  if (minutes < 300) {
    return "night";
  }


  if (minutes < 720) {
    return "morning";
  }


  if (minutes < 1020) {
    return "afternoon";
  }


  if (minutes < 1200) {
    return "evening";
  }


  return "night";

}


/* =========================================================
   EXACT VIDEO SCHEDULE
========================================================= */

function getVideoForCurrentTime(period) {

  const minutes =
    getMinutesNow();


  /* MORNING */

  if (period === "morning") {

    if (minutes < 360) return 0;

    if (minutes < 480) return 1;

    if (minutes < 600) return 2;

    return 3;

  }


  /* AFTERNOON */

  if (period === "afternoon") {

    if (minutes < 780) return 0;

    if (minutes < 870) return 1;

    if (minutes < 960) return 2;

    return 3;

  }


  /* EVENING */

  if (period === "evening") {

    if (minutes < 1065) return 0;

    if (minutes < 1140) return 1;

    return 2;

  }


  /* NIGHT */

  if (minutes >= 1200) {
    return 0;
  }

  return 1;

}


/* =========================================================
   DATE
========================================================= */

function updateDate() {

  const now = new Date();


  day.textContent =
    now.toLocaleDateString(
      undefined,
      {
        weekday: "long"
      }
    ).toUpperCase();


  date.textContent =
    now.toLocaleDateString(
      undefined,
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    ).toUpperCase();

}


/* =========================================================
   GREETING
========================================================= */

function updateGreeting(period) {

  wish.classList.add("changing");


  setTimeout(() => {

    if (period === "morning") {

      wish.textContent =
        "Good Morning";

      message.textContent =
        "May today feel a little lighter.";

      timeLabel.textContent =
        "MORNING";

    }

    else if (period === "afternoon") {

      wish.textContent =
        "Good Afternoon";

      message.textContent =
        "Take a gentle pause. You have time.";

      timeLabel.textContent =
        "AFTERNOON";

    }

    else if (period === "evening") {

      wish.textContent =
        "Good Evening";

      message.textContent =
        "Let the day slow down around you.";

      timeLabel.textContent =
        "EVENING";

    }

    else {

      wish.textContent =
        "Good Night";

      message.textContent =
        "May tonight bring you some peace.";

      timeLabel.textContent =
        "NIGHT";

    }


    wish.classList.remove("changing");

  }, 350);

}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(videoIndex) {

  if (
    !activePlaylist.length ||
    isSwitchingVideo
  ) {
    return;
  }


  const file =
    activePlaylist[videoIndex];


  if (!file) {
    return;
  }


  isSwitchingVideo = true;


  video.pause();

  video.removeAttribute("src");

  video.load();

  video.classList.remove("ready");

  video.src = file;

  video.load();


  const handleReady = () => {

    video.removeEventListener(
      "canplay",
      handleReady
    );


    video.muted =
      !soundEnabled;


    const playPromise =
      video.play();


    if (
      playPromise &&
      typeof playPromise.then === "function"
    ) {

      playPromise
        .catch(() => {})
        .finally(() => {

          video.classList.add("ready");

          loading.classList.add("hidden");

          isSwitchingVideo = false;

        });

    }

    else {

      video.classList.add("ready");

      loading.classList.add("hidden");

      isSwitchingVideo = false;

    }

  };


  video.addEventListener(
    "canplay",
    handleReady,
    {
      once: true
    }
  );

}


/* =========================================================
   VIDEO ENDED
========================================================= */

video.addEventListener(
  "ended",
  () => {

    if (isSwitchingVideo) {
      return;
    }


    const period =
      getCurrentPeriod();


    const correctIndex =
      getVideoForCurrentTime(period);


    /*
      Same scheduled video:
      replay it.
    */

    if (
      period === activePeriod &&
      correctIndex === activeVideoIndex
    ) {

      video.currentTime = 0;

      video.play().catch(() => {});

      return;

    }


    /*
      Time window changed:
      load the correct video.
    */

    activePeriod =
      period;

    activePlaylist =
      VIDEO_GROUPS[period];

    activeVideoIndex =
      correctIndex;

    updateGreeting(period);

    loadVideo(correctIndex);

  }
);


/* =========================================================
   SCHEDULE CHECK
========================================================= */

function checkSchedule() {

  const period =
    getCurrentPeriod();


  const videoIndex =
    getVideoForCurrentTime(period);


  if (
    period !== activePeriod
  ) {

    activePeriod =
      period;

    activePlaylist =
      VIDEO_GROUPS[period];

    updateGreeting(period);

  }


  if (
    videoIndex !== activeVideoIndex ||
    !video.src
  ) {

    activePlaylist =
      VIDEO_GROUPS[period];

    activeVideoIndex =
      videoIndex;

    loadVideo(videoIndex);

  }

}


/* =========================================================
   SOUND
========================================================= */

soundButton.addEventListener(
  "click",
  () => {

    soundEnabled =
      !soundEnabled;


    video.muted =
      !soundEnabled;


    soundButton.textContent =
      soundEnabled
        ? "🔊"
        : "🔇";


    soundButton.setAttribute(
      "aria-label",
      soundEnabled
        ? "Mute sound"
        : "Turn sound on"
    );


    video.play().catch(() => {});

  }
);


/* =========================================================
   START
========================================================= */

updateDate();

checkSchedule();


/* =========================================================
   CHECK EVERY SECOND
========================================================= */

setInterval(
  () => {

    updateDate();

    checkSchedule();

  },
  1000
);


/* =========================================================
   RETURN FROM BACKGROUND
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden &&
      video.src &&
      video.paused
    ) {

      video.muted =
        !soundEnabled;

      video.play().catch(() => {});

    }

  }
);


/* =========================================================
   ERROR
========================================================= */

video.addEventListener(
  "error",
  () => {

    isSwitchingVideo = false;

    loading.classList.add("hidden");

  }
);

</script>

</body>
</html>
