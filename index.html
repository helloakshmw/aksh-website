<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#11111b">
  <meta name="description" content="AKSH — A Safe Space For Every Mind">
  <title>AKSH</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: #11111b;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    /* =====================================================
       FULL SCREEN ARRIVAL
    ===================================================== */

    .arrival {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background: #11111b;
      isolation: isolate;
    }

    /* =====================================================
       VIDEO BACKGROUND
    ===================================================== */

    .video-layer {
      position: absolute;
      inset: 0;
      z-index: -5;
      overflow: hidden;
      background: #11111b;
    }

    #backgroundVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      display: block;

      opacity: 0;

      transition: opacity 1.4s ease;
    }

    #backgroundVideo.visible {
      opacity: 1;
    }

    /*
      Dark cinematic layer above the video.
      Keeps text readable without destroying the video.
    */

    .video-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.28) 0%,
          rgba(0,0,0,.03) 35%,
          rgba(0,0,0,.18) 65%,
          rgba(0,0,0,.52) 100%
        );

      z-index: 1;
    }

    /*
      Subtle glass/light layer.
    */

    .atmosphere {
      position: absolute;
      inset: 0;
      z-index: 2;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255,255,255,.08),
          transparent 42%
        );

      pointer-events: none;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .top {
      position: absolute;
      z-index: 10;

      top: 0;
      left: 0;
      right: 0;

      padding:
        max(20px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        0
        max(22px, env(safe-area-inset-left));
    }

    .top-inner {
      width: min(1180px, 100%);
      margin: 0 auto;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    /* =====================================================
       AKSH ICON
    ===================================================== */

    .aksh-icon {
      width: 52px;
      height: 52px;

      object-fit: contain;

      display: block;

      filter:
        drop-shadow(0 3px 12px rgba(0,0,0,.25));
    }

    /* =====================================================
       DATE / DAY
    ===================================================== */

    .date-box {
      text-align: right;

      color: #fff;

      text-shadow:
        0 2px 15px rgba(0,0,0,.3);
    }

    .day {
      font-size: 10px;

      font-weight: 800;

      letter-spacing: .18em;

      text-transform: uppercase;
    }

    .date {
      margin-top: 5px;

      font-size: 9px;

      letter-spacing: .05em;

      opacity: .78;
    }

    /* =====================================================
       CENTER
    ===================================================== */

    .center {
      position: relative;
      z-index: 10;

      width: min(900px, calc(100% - 36px));

      height: 100svh;

      margin: auto;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        100px 0
        max(40px, env(safe-area-inset-bottom));
    }

    .welcome {
      font-size: 9px;

      font-weight: 800;

      letter-spacing: .28em;

      text-transform: uppercase;

      color: rgba(255,255,255,.85);

      text-shadow:
        0 2px 15px rgba(0,0,0,.3);

      margin-bottom: 18px;
    }

    .wish {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(55px, 9vw, 110px);

      line-height: .88;

      font-weight: 400;

      letter-spacing: -.055em;

      color: #fff;

      text-shadow:
        0 4px 30px rgba(0,0,0,.28);

      transition:
        opacity .5s ease,
        transform .5s ease;
    }

    .wish.changing {
      opacity: 0;
      transform: translateY(8px);
    }

    .message {
      max-width: 490px;

      margin-top: 21px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(17px, 2.5vw, 24px);

      line-height: 1.35;

      color: rgba(255,255,255,.92);

      text-shadow:
        0 3px 20px rgba(0,0,0,.3);
    }

    .sub-message {
      max-width: 420px;

      margin-top: 14px;

      font-size: 11px;

      line-height: 1.7;

      color: rgba(255,255,255,.78);

      text-shadow:
        0 2px 12px rgba(0,0,0,.35);
    }

    /* =====================================================
       ENTER BUTTON
    ===================================================== */

    .enter {
      margin-top: 28px;

      display: inline-flex;

      align-items: center;

      gap: 12px;

      padding: 14px 17px 14px 21px;

      border-radius: 999px;

      background: rgba(255,255,255,.92);

      color: #34283c;

      text-decoration: none;

      font-size: 9px;

      font-weight: 800;

      letter-spacing: .1em;

      text-transform: uppercase;

      box-shadow:
        0 15px 40px rgba(0,0,0,.22);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        transform .25s ease,
        background .25s ease;
    }

    .enter:hover {
      transform: translateY(-3px);

      background: #fff;
    }

    .arrow {
      width: 29px;
      height: 29px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(70,45,82,.1);

      font-size: 14px;
    }

    /* =====================================================
       TIME LABEL
    ===================================================== */

    .time-label {
      position: absolute;

      z-index: 10;

      right: 24px;
      bottom: 24px;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: .16em;

      text-transform: uppercase;

      color: rgba(255,255,255,.6);

      text-shadow:
        0 2px 10px rgba(0,0,0,.35);
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      position: absolute;

      z-index: 20;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #11111b;

      transition:
        opacity .8s ease,
        visibility .8s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-mark {
      font-family: Georgia, serif;

      font-size: 22px;

      letter-spacing: .38em;

      margin-left: .38em;

      color: rgba(255,255,255,.9);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .top {
        padding-left: 16px;
        padding-right: 16px;
      }

      .aksh-icon {
        width: 43px;
        height: 43px;
      }

      .day {
        font-size: 8px;
      }

      .date {
        font-size: 8px;
      }

      .center {
        width: calc(100% - 30px);
      }

      .wish {
        font-size: clamp(48px, 14vw, 70px);
      }

      .message {
        font-size: 18px;
        max-width: 330px;
      }

      .sub-message {
        max-width: 320px;
        font-size: 10px;
      }

      .time-label {
        display: none;
      }
    }

    @media (max-width: 360px) {

      .wish {
        font-size: 44px;
      }

      .message {
        font-size: 16px;
      }

      .enter {
        margin-top: 23px;
      }
    }

    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      #backgroundVideo {
        transition: none;
      }

      .wish {
        transition: none;
      }
    }
  </style>
</head>

<body>

<section class="arrival">

  <!-- ===================================================
       VIDEO BACKGROUND
  ==================================================== -->

  <div class="video-layer">

    <video
      id="backgroundVideo"
      muted
      autoplay
      playsinline
      preload="auto"
    ></video>

    <div class="video-overlay"></div>

    <div class="atmosphere"></div>

  </div>


  <!-- ===================================================
       LOADING
  ==================================================== -->

  <div
    class="loading"
    id="loading"
  >
    <div class="loading-mark">
      AKSH
    </div>
  </div>


  <!-- ===================================================
       TOP
  ==================================================== -->

  <header class="top">

    <div class="top-inner">

      <img
        src="aksh-icon.PNG"
        alt="AKSH"
        class="aksh-icon"
      >

      <div class="date-box">

        <div
          class="day"
          id="day"
        >
          MONDAY
        </div>

        <div
          class="date"
          id="date"
        >
          11 AUGUST 2026
        </div>

      </div>

    </div>

  </header>


  <!-- ===================================================
       ARRIVAL MESSAGE
  ==================================================== -->

  <main class="center">

    <div class="welcome">
      Welcome to AKSH
    </div>

    <h1
      class="wish"
      id="wish"
    >
      Good Morning
    </h1>

    <div
      class="message"
      id="message"
    >
      May today feel a little lighter.
    </div>

    <p class="sub-message">
      Take a breath before you begin.
      There is no rush here.
      You can arrive exactly as you are.
    </p>

    <a
      href="page1.html"
      class="enter"
    >
      Enter AKSH

      <span class="arrow">
        →
      </span>
    </a>

  </main>


  <!-- ===================================================
       CURRENT ATMOSPHERE
  ==================================================== -->

  <div
    class="time-label"
    id="timeLabel"
  >
    MORNING
  </div>

</section>


<script>

/* =========================================================
   VIDEO GROUPS
========================================================= */

const videoGroups = {

  morning: [
    "aksh-morning.1.mov",
    "aksh-morning.2.mov",
    "aksh-morning.3.mov",
    "aksh-morning.4.mov"
  ],

  afternoon: [
    "aksh-afternoon.1.mov",
    "aksh-afternoon.2.mov",
    "aksh-afternoon.3.mov",
    "aksh-afternoon.4.mov"
  ],

  evening: [
    "aksh-evening.1.mov",
    "aksh-evening.2.mov",
    "aksh-evening.3.mov"
  ],

  night: [
    "aksh-night.1.mov",
    "aksh-night.2.mov"
  ]

};


/* =========================================================
   ELEMENTS
========================================================= */

const video =
  document.getElementById("backgroundVideo");

const loading =
  document.getElementById("loading");

const wish =
  document.getElementById("wish");

const message =
  document.getElementById("message");

const timeLabel =
  document.getElementById("timeLabel");

const day =
  document.getElementById("day");

const date =
  document.getElementById("date");


/* =========================================================
   STATE
========================================================= */

let currentPeriod = "";
let currentVideos = [];
let currentVideoIndex = 0;


/* =========================================================
   GET CURRENT TIME PERIOD
========================================================= */

function getPeriod() {

  const now = new Date();

  const hour = now.getHours();

  const minute = now.getMinutes();


  /*
    MORNING
    05:00 - 11:59
  */

  if (hour >= 5 && hour < 12) {

    return "morning";

  }


  /*
    AFTERNOON
    12:00 - 16:59
  */

  if (hour >= 12 && hour < 17) {

    return "afternoon";

  }


  /*
    EVENING
    17:00 - 19:29
  */

  if (
    hour === 17 ||
    hour === 18 ||
    (hour === 19 && minute < 30)
  ) {

    return "evening";

  }


  /*
    NIGHT
    19:30 onward
    and before 05:00
  */

  return "night";

}


/* =========================================================
   ARRIVAL TEXT
========================================================= */

function updateArrivalText(period) {

  wish.classList.add("changing");

  setTimeout(() => {

    if (period === "morning") {

      wish.textContent = "Good Morning";

      message.textContent =
        "May today feel a little lighter.";

      timeLabel.textContent =
        "MORNING";

    }

    else if (period === "afternoon") {

      wish.textContent = "Good Afternoon";

      message.textContent =
        "Take a moment to breathe and be present.";

      timeLabel.textContent =
        "AFTERNOON";

    }

    else if (period === "evening") {

      wish.textContent = "Good Evening";

      message.textContent =
        "Let the day slow down around you.";

      timeLabel.textContent =
        "EVENING";

    }

    else {

      wish.textContent = "Good Night";

      message.textContent =
        "May tonight bring you some peace.";

      timeLabel.textContent =
        "NIGHT";

    }

    wish.classList.remove("changing");

  }, 450);

}


/* =========================================================
   DATE
========================================================= */

function updateDate() {

  const now = new Date();


  day.textContent =
    now.toLocaleDateString(
      undefined,
      {
        weekday: "long"
      }
    ).toUpperCase();


  date.textContent =
    now.toLocaleDateString(
      undefined,
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    ).toUpperCase();

}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(index) {

  if (!currentVideos.length) {
    return;
  }

  const source =
    currentVideos[index];


  /*
    Fade old video out.
  */

  video.classList.remove("visible");


  setTimeout(() => {

    video.src = source;

    video.load();


    const playPromise =
      video.play();


    if (playPromise !== undefined) {

      playPromise.catch(() => {

        /*
          Some mobile browsers may delay autoplay.
          Muted + playsinline allows autoplay where supported.
        */

      });

    }

  }, 500);

}


/* =========================================================
   VIDEO READY
========================================================= */

video.addEventListener(
  "canplay",
  () => {

    video.classList.add("visible");

    loading.classList.add("hidden");

  }
);


/* =========================================================
   VIDEO ENDED
========================================================= */

video.addEventListener(
  "ended",
  () => {

    currentVideoIndex++;

    /*
      When the last video finishes,
      start the first video again.
    */

    if (
      currentVideoIndex >=
      currentVideos.length
    ) {

      currentVideoIndex = 0;

    }

    loadVideo(currentVideoIndex);

  }
);


/* =========================================================
   CHANGE PERIOD
========================================================= */

function updateEnvironment() {

  const period =
    getPeriod();


  /*
    Only reload videos when the
    actual time period changes.
  */

  if (period === currentPeriod) {

    updateDate();

    return;

  }


  currentPeriod = period;

  currentVideos =
    videoGroups[period];

  currentVideoIndex = 0;


  updateArrivalText(period);

  updateDate();

  loadVideo(currentVideoIndex);

}


/* =========================================================
   START
========================================================= */

updateEnvironment();


/*
  Check every minute.

  Example:
  19:29 → evening
  19:30 → night
*/

setInterval(
  updateEnvironment,
  60000
);


/* =========================================================
   SAFETY:
   IF BROWSER DOES NOT AUTOPLAY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden &&
      video.paused
    ) {

      video.play().catch(() => {});

    }

  }
);

</script>

</body>
</html>
