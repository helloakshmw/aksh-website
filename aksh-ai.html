<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH Intelligence</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  color:#e9edf5;
  background:#080b12;
}

.page{
  min-height:100svh;
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:40px 24px;

  background:
    radial-gradient(circle at 50% 42%,rgba(90,120,190,.18),transparent 28%),
    radial-gradient(circle at 20% 20%,rgba(93,75,150,.16),transparent 30%),
    radial-gradient(circle at 85% 75%,rgba(42,145,164,.12),transparent 28%),
    linear-gradient(145deg,#080b12,#111625 55%,#080b11);
}

.page::before{
  content:"";

  position:absolute;

  width:430px;
  height:430px;

  border-radius:50%;

  border:1px solid rgba(181,202,255,.08);

  box-shadow:
    0 0 100px rgba(111,143,222,.08),
    inset 0 0 80px rgba(111,143,222,.05);

  animation:orb 9s ease-in-out infinite;
}

.page::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      115deg,
      transparent 0 45%,
      rgba(255,255,255,.025) 50%,
      transparent 55%
    );

  pointer-events:none;
}

.top{
  position:absolute;

  z-index:5;

  top:25px;
  left:25px;
  right:25px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-family:Georgia,"Times New Roman",serif;

  font-size:20px;

  letter-spacing:.18em;

  color:#f5f6fb;
}

.back{
  padding:10px 15px;

  border-radius:100px;

  text-decoration:none;

  color:#d9deeb;

  font-size:10px;

  border:1px solid rgba(255,255,255,.1);

  background:rgba(255,255,255,.045);

  backdrop-filter:blur(18px);
}

.content{
  position:relative;

  z-index:3;

  width:min(650px,100%);

  text-align:center;
}

.mark{
  width:76px;
  height:76px;

  margin:0 auto 30px;

  border-radius:50%;

  display:grid;
  place-items:center;

  font-family:Georgia,"Times New Roman",serif;

  font-size:25px;

  color:#dce6ff;

  border:1px solid rgba(185,207,255,.2);

  background:
    radial-gradient(
      circle,
      rgba(132,164,239,.22),
      rgba(70,88,138,.06) 58%,
      transparent 70%
    );

  box-shadow:
    0 0 55px rgba(112,145,226,.15);

  animation:float 5s ease-in-out infinite;
}

.eyebrow{
  margin-bottom:16px;

  color:#8d9ab5;

  font-size:8px;

  letter-spacing:.3em;

  text-transform:uppercase;
}

h1{
  margin:0;

  font-family:Georgia,"Times New Roman",serif;

  font-size:clamp(48px,8vw,76px);

  line-height:.95;

  font-weight:400;

  letter-spacing:-.06em;
}

h1 span{
  color:#9cb8ff;

  font-style:italic;
}

.description{
  width:min(490px,100%);

  margin:25px auto 34px;

  color:#8f99ad;

  font-size:12px;

  line-height:1.8;
}

/* =========================================================
   AI INPUT
========================================================= */

.ai-box{
  width:min(520px,100%);

  margin:auto;

  padding:7px;

  border-radius:22px;

  border:1px solid rgba(190,207,255,.13);

  background:rgba(255,255,255,.045);

  box-shadow:
    0 25px 80px rgba(0,0,0,.25);

  backdrop-filter:blur(25px);
}

.ai-box textarea{
  display:block;

  width:100%;

  min-height:92px;

  resize:none;

  border:0;
  outline:0;

  border-radius:17px;

  padding:17px;

  color:#e9edf5;

  background:transparent;

  font-family:inherit;

  font-size:12px;

  line-height:1.6;
}

.ai-box textarea::placeholder{
  color:#68748a;
}

.ai-actions{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:6px 7px;
}

.ai-status{
  color:#66748b;

  font-size:8px;

  letter-spacing:.08em;
}

.talk{
  border:0;

  padding:11px 17px;

  border-radius:100px;

  color:#0c111c;

  background:#dce6ff;

  font-size:9px;

  font-weight:700;

  cursor:pointer;

  transition:.3s ease;
}

.talk:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 25px rgba(160,188,255,.2);
}

.response{
  min-height:0;

  margin:18px auto 0;

  color:#9ba6ba;

  font-size:10px;

  line-height:1.7;

  opacity:0;

  transition:.4s ease;
}

.response.show{
  opacity:1;
}

.bottom{
  position:absolute;

  z-index:5;

  bottom:25px;

  left:25px;
  right:25px;

  display:flex;

  justify-content:center;

  color:#566174;

  font-size:8px;

  letter-spacing:.1em;
}

/* =========================================================
   ANIMATION
========================================================= */

@keyframes orb{

  0%,100%{
    transform:scale(.92);
    opacity:.65;
  }

  50%{
    transform:scale(1.06);
    opacity:1;
  }

}

@keyframes float{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .page{
    padding:30px 18px;
  }

  .top{
    top:18px;
    left:18px;
    right:18px;
  }

  .logo{
    font-size:18px;
  }

  .content{
    margin-top:20px;
  }

  .mark{
    width:65px;
    height:65px;

    margin-bottom:24px;
  }

  h1{
    font-size:48px;
  }

  .description{
    font-size:11px;

    margin-top:21px;
    margin-bottom:28px;
  }

  .ai-box{
    border-radius:19px;
  }

}
</style>
</head>

<body>

<section class="page">

  <div class="top">

    <div class="logo">
      AKSH
    </div>

    <a
      href="homepage.html"
      class="back"
    >
      ← Back
    </a>

  </div>


  <main class="content">

    <div class="mark">
      A
    </div>

    <div class="eyebrow">
      AKSH Intelligence
    </div>

    <h1>
      A quieter place<br>
      <span>to think.</span>
    </h1>

    <p class="description">
      You can put your thoughts here exactly as they are.
      AKSH Intelligence can help you reflect, organise
      what you're feeling, or simply begin a conversation.
    </p>


    <div class="ai-box">

      <textarea
        id="message"
        placeholder="What's on your mind?"
      ></textarea>

      <div class="ai-actions">

        <div class="ai-status">
          AKSH I · HERE TO LISTEN
        </div>

        <button
          class="talk"
          onclick="respond()"
        >
          Begin
        </button>

      </div>

    </div>


    <div
      class="response"
      id="response"
    ></div>

  </main>


  <div class="bottom">
    AI CAN ASSIST · HUMAN SUPPORT IS ALWAYS AVAILABLE
  </div>

</section>


<script>

function respond(){

  const message =
    document.getElementById("message").value.trim();

  const response =
    document.getElementById("response");

  if(!message){

    response.textContent =
      "You don't have to know exactly what to say. Start with one word.";

  }else{

    response.textContent =
      "Thank you for putting that into words. Take your time — we can begin from here.";

  }

  response.classList.add("show");

}

</script>

</body>
</html>
